    agentCustomToolResult:
      name: agent.custom_tool_result
      title: agent.custom_tool_result
      summary: Deliver the user's result of a custom tool call.
      description: "Harness to executor request (capability agent; sent only to an executor that declared agent.custom_tools). The executor emitted agent.custom_tool_use (its event_id is the tool_use_id) and waits; the platform sends the result the user's application submitted with user.custom_tool_result. Only the first result of a call counts: the platform accepts one per tool_use_id and the executor answers a repeat, an unknown tool_use_id or a call it no longer waits for with accepted=false. Idempotent by tool_use_id: the platform retries the same result until the executor answers, also on a new connection. Timeout: the executor owns the wait. When its own limit passes it ends the call with a failed agent.tool_result (tool_use_id of the call, is_error true), continues the turn, and answers a later result with accepted=false; the platform stops accepting results for that call. Cancel: turn.cancel ends the waiting call as canceled with the turn, and the platform drops results it has not delivered yet for a turn that ended."
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          id:
            $ref: schemas/common.json#/$defs/JsonRpcId
          method:
            type: string
            const: agent.custom_tool_result
          params:
            type: object
            additionalProperties: false
            properties:
              session_id:
                type: string
              tool_use_id:
                type: string
              content:
                type: array
                items:
                  $ref: schemas/tool.json#/$defs/ContentBlock
              is_error:
                type: boolean
            required:
