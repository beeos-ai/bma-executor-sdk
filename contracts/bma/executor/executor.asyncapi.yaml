    desktopAttach:
      name: desktop.attach
      title: desktop.attach
      summary: Attach a desktop session to the machine's running desktop.
      description: Harness to executor request (machine-scoped executors that claim display.desktop). The machine's desktop agent runs from machine start (desktop-relay.md §1); the executor hands it the session and answers once the agent accepted it. The agent then dials the session's relay lanes at relay_url with the ticket (Authorization bearer) and serves the session until it is closed (session_close, or a lane refused with 4001/4003/4004) or attached again, which replaces the earlier attach. width and height, together, resize the desktop unless the same size was asked for last. wallpaper names the environment's default wallpaper; the result asks for its bytes (desktop.wallpaper) when the machine lacks them. Waits at most 5 s for a desktop that is still starting, then answers ResourceUnavailable with data.reason desktop_starting and data.retryable true (the platform answers 409 machine_starting stage=desktop_starting with Retry-After). With capture_id, attach only the media relay of that already running screen_live capture on machine_id; session_id remains the desktop relay session. This requires an exact active machine/capture match and forbids width, height and wallpaper. It never starts a capture, the legacy peer-to-peer path or another input worker, and a missing capture is rejected.
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          id:
            $ref: schemas/common.json#/$defs/JsonRpcId
          method:
            type: string
            const: desktop.attach
          params:
            type: object
            additionalProperties: false
            properties:
              session_id:
                type: string
              capture_id:
                type: string
                description: The active screen_live capture to attach as media only (contract 1.21.0); distinct from the desktop session_id.
              machine_id:
                type: string
              relay_url:
                type: string
              ticket:
                type: string
              width:
                type: integer
                x-go-type: int
              height:
                type: integer
                x-go-type: int
              wallpaper:
                $ref: schemas/desktop.json#/$defs/DesktopWallpaper
            required:
              - session_id
              - machine_id
              - relay_url
              - ticket
        required:
          - jsonrpc
          - id
          - method
          - params
      x-bma-jsonrpc-method: desktop.attach
      x-bma-direction: harness-to-executor
      x-bma-kind: request
      x-bma-channel: control
      x-bma-idempotent-by: session_id
    desktopWallpaper:
      name: desktop.wallpaper
      title: desktop.wallpaper
      summary: Send one chunk of the default wallpaper a desktop.attach asked for.
      description: Harness to executor request. Chunks follow each other from offset 0 (data is standard base64, at most max_process_write_bytes decoded); the chunk with done installs the image when its sha256 matches and applies it to the running desktop.
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          id:
            $ref: schemas/common.json#/$defs/JsonRpcId
          method:
            type: string
            const: desktop.wallpaper
          params:
            type: object
            additionalProperties: false
            properties:
              sha256:
                type: string
              ext:
                type: string
              offset:
                type: integer
              data:
                type: string
              done:
                type: boolean
            required:
              - sha256
              - ext
              - offset
              - data
              - done
        required:
          - jsonrpc
          - id
          - method
          - params
      x-bma-jsonrpc-method: desktop.wallpaper
      x-bma-direction: harness-to-executor
      x-bma-kind: request
      x-bma-channel: control
    skillInstall:
      name: skill.install
      title: skill.install
      summary: Install one skill revision on the machine.
      description: Harness to executor request (machine-scoped). The executor downloads the revision archive with download_token, verifies digest, and installs it. Idempotent by (skill_id, revision_id, digest). Installed at $BMA_HOME/installations/executor/machines/{machine_id}/skills/{skill_id}/revisions/{revision_id}/ (the archive's single top-level directory removed). The platform calls it (contract 2.3.0) on the session's hands machine before a platform tool call runs there, and, for a session whose brain runs on the machine (turn.start without tools_mcp_*), on that machine before every turn.start, once per frozen skill revision of the session, in the order the session froze them. That turn's config.system then names each installed revision's SKILL.md at that path; an executor that sandboxes its brain lets it read those directories, never write them. A failed install ends the turn failed (session.error skills_install_failed) without a turn.start; when the executor does not declare skills.install the turn runs without the skills after a session.error skills_unsupported.
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          id:
            $ref: schemas/common.json#/$defs/JsonRpcId
          method:
            type: string
            const: skill.install
          params:
            type: object
            additionalProperties: false
            properties:
              machine_id:
                type: string
              skill_id:
                type: string
              revision_id:
                type: string
              digest:
                type: string
              download_token:
                type: string
              download_expires_at:
                type: integer
            required:
              - machine_id
              - skill_id
              - revision_id
              - digest
              - download_token
              - download_expires_at
        required:
          - jsonrpc
          - id
          - method
          - params
      x-bma-jsonrpc-method: skill.install
      x-bma-direction: harness-to-executor
      x-bma-kind: request
      x-bma-channel: control
      x-bma-idempotent-by: skill_id+revision_id+digest
    workspaceBackup:
      name: workspace.backup
      title: workspace.backup
      summary: Upload one backup of the machine workspace.
      description: Harness to executor request (machine-scoped). The executor walks paths (absolute), skipping exclude entries and its own BMA_HOME, and streams a tar+zstd archive with PUT to /daemon/machine-backups/{backup_id}/archive over the machine token, with the tree fingerprint in X-BMA-Backup-Fingerprint. When the fingerprint equals skip_if_fingerprint nothing is uploaded and the result is "unchanged". Restore has no method; a recreated executor fetches /daemon/machine-backup-restore before executor.register.
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          id:
            $ref: schemas/common.json#/$defs/JsonRpcId
          method:
            type: string
            const: workspace.backup
          params:
            type: object
            additionalProperties: false
            properties:
              backup_id:
                type: string
              paths:
                type: array
                items:
                  type: string
              exclude:
                type: array
                items:
                  type: string
              skip_if_fingerprint:
                type: string
            required:
              - backup_id
              - paths
        required:
          - jsonrpc
          - id
          - method
          - params
      x-bma-jsonrpc-method: workspace.backup
      x-bma-direction: harness-to-executor
      x-bma-kind: request
      x-bma-channel: control
      x-bma-idempotent-by: backup_id
    sessionFilesFlush:
      name: session_files.flush
      title: session_files.flush
      summary: Upload the session outputs written so far and wait for the uploads.
      description: Harness to executor request (machine-scoped, contract 1.13.0). Before the platform pauses or hibernates the machine it asks the executor to upload every changed file under the outputs of every session it shows (what the periodic scan would upload next, without waiting for the file to be seen stable) and answers when all uploads are done. "flushed" means no upload is outstanding; "failed" means at least one upload failed and may be retried, so the platform must not pause yet. A file the platform refuses for good (size, quota, name) is not a failure. Idempotent; an executor that does not know the method answers -32601, which the platform treats as nothing to flush.
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          id:
            $ref: schemas/common.json#/$defs/JsonRpcId
          method:
            type: string
            const: session_files.flush
          params:
            type: object
            additionalProperties: false
            properties: {}
        required:
          - jsonrpc
          - id
          - method
          - params
      x-bma-jsonrpc-method: session_files.flush
      x-bma-direction: harness-to-executor
      x-bma-kind: request
      x-bma-channel: control
    turnStart:
      name: turn.start
      title: turn.start
      summary: Start an agent turn.
      description: Harness to executor request (capability agent). Opens the agent session on first use (no session.assign) or continues it; executor_session_ref from an earlier TurnStartResult lets the executor resume its local conversation after a restart. The executor answers as soon as the turn is accepted and reports progress with session.event. Idempotent by turn_id. A session with a running turn answers -32013 conflict (use turn.input); a turn.start while max_sessions turns are running answers -32009 (an idle session holds no slot). A request that would serialize to more than 48 KiB carries a single input_ref block as its input (contract 1.7.0, only to an executor that declared agent.input_by_reference).
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          id:
            $ref: schemas/common.json#/$defs/JsonRpcId
          method:
            type: string
            const: turn.start
          params:
            type: object
            additionalProperties: false
            properties:
              session_id:
                type: string
              turn_id:
                type: string
              input_id:
                type: string
              input:
                type: array
                minItems: 1
                items:
                  $ref: schemas/agent.json#/$defs/AgentInputBlock
              executor_session_ref:
                type: string
              config:
                $ref: schemas/agent.json#/$defs/AgentTurnConfig
              deadline_ms:
                type: integer
                minimum: 1
              metadata:
                type: object
                additionalProperties:
                  type: string
            required:
              - session_id
              - turn_id
              - input_id
              - input
        required:
          - jsonrpc
          - id
          - method
          - params
      x-bma-jsonrpc-method: turn.start
      x-bma-direction: harness-to-executor
      x-bma-kind: request
      x-bma-channel: control
      x-bma-idempotent-by: turn_id
    turnInput:
      name: turn.input
      title: turn.input
      summary: Add user input to the running turn.
      description: Harness to executor request (capability agent). The local agent consumes the input at its next step (contract 1.25.0, agent.steering - at the running turn's next step boundary, before its next model request; without it after the running prompt ends). Idempotent by input_id. When turn_id is not the running turn the executor answers -32013 conflict and the harness starts a new turn instead. A request that would serialize to more than 48 KiB carries a single input_ref block as its input (contract 1.7.0, only to an executor that declared agent.input_by_reference).
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          id:
            $ref: schemas/common.json#/$defs/JsonRpcId
          method:
            type: string
            const: turn.input
          params:
            type: object
            additionalProperties: false
            properties:
              session_id:
                type: string
              turn_id:
                type: string
              input_id:
                type: string
              input:
                type: array
                minItems: 1
                items:
                  $ref: schemas/agent.json#/$defs/AgentInputBlock
            required:
              - session_id
              - turn_id
              - input_id
              - input
        required:
          - jsonrpc
          - id
          - method
          - params
      x-bma-jsonrpc-method: turn.input
      x-bma-direction: harness-to-executor
      x-bma-kind: request
      x-bma-channel: control
      x-bma-idempotent-by: input_id
    turnCancel:
      name: turn.cancel
      title: turn.cancel
      summary: Stop the running turn.
      description: Harness to executor request (capability agent). The executor stops the agent loop, cancels its local tool calls, withdraws open interactions (interaction.cancel turn_canceled), and ends the turn with session.status_idle turn_outcome=canceled. The session stays open for the next turn.start. Unlike tool.cancel (one harness-dispatched tool call) and session.stop (a hand session and its processes), it targets only the agent turn.
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          id:
            $ref: schemas/common.json#/$defs/JsonRpcId
          method:
            type: string
            const: turn.cancel
          params:
            type: object
            additionalProperties: false
            properties:
              session_id:
                type: string
              turn_id:
                type: string
              reason:
                type: string
            required:
              - session_id
              - turn_id
        required:
          - jsonrpc
          - id
          - method
          - params
      x-bma-jsonrpc-method: turn.cancel
      x-bma-direction: harness-to-executor
      x-bma-kind: request
      x-bma-channel: control
    sessionCompact:
      name: session.compact
      title: session.compact
      summary: Compact an idle agent context without sending a turn.
      description: Explicit idle-session maintenance. The platform reserves the session against new inputs, pending decisions and automatic continuations before calling. The executor independently rejects an active turn, pending interactions or another maintenance operation. It keeps the original transcript, compacts an isolated durable context and atomically publishes its pointer and immutable receipt only after success. Failed or cancelled preparation preserves the old context. Unknown publication is reconciled with the same operation_id and expected version, never a fresh id. Metadata contains maintenance-only platform credentials, not a historical turn token. No tool may run during summarization. Older handlers explicitly refuse this method.
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          id:
            $ref: schemas/common.json#/$defs/JsonRpcId
          method:
            type: string
            const: session.compact
          params:
            type: object
            additionalProperties: false
            properties:
              session_id:
                type: string
              operation_id:
                type: string
                minLength: 1
                maxLength: 128
                pattern: ^[a-zA-Z0-9_-]+$
              expected_context_version:
                type: integer
                minimum: 0
                maximum: 9007199254740990
              expected_last_input_id:
                type: string
              model:
                type: string
              deadline_ms:
                type: integer
                minimum: 1
                maximum: 300000
              metadata:
                type: object
                additionalProperties:
                  type: string
            required:
              - session_id
              - operation_id
              - expected_context_version
              - expected_last_input_id
              - model
              - deadline_ms
              - metadata
        required:
          - jsonrpc
          - id
          - method
          - params
      x-bma-jsonrpc-method: session.compact
      x-bma-direction: harness-to-executor
      x-bma-kind: request
      x-bma-channel: control
      x-bma-idempotent-by: operation_id
    sessionCompactCancel:
      name: session.compact_cancel
      title: session.compact_cancel
      summary: Request cancellation of one context maintenance operation.
      description: Durably fences publication of the exact operation or returns its already-applied receipt. It never closes the conversation or cancels an ordinary turn. canceled=true means the operation cannot publish, including a late retry; settled=false means its SDK reservation still belongs to work that has not settled. The platform retains its admission barrier until settled=true, and reconciles uncertain replies by repeating this exact cancel request.
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          id:
            $ref: schemas/common.json#/$defs/JsonRpcId
          method:
            type: string
            const: session.compact_cancel
          params:
            type: object
            additionalProperties: false
            properties:
              session_id:
                type: string
              operation_id:
                type: string
              expected_context_version:
                type: integer
                minimum: 0
                maximum: 9007199254740990
              expected_last_input_id:
                type: string
              model:
                type: string
            required:
              - session_id
              - operation_id
              - expected_context_version
              - expected_last_input_id
              - model
        required:
          - jsonrpc
          - id
          - method
          - params
      x-bma-jsonrpc-method: session.compact_cancel
      x-bma-direction: harness-to-executor
      x-bma-kind: request
      x-bma-channel: control
    sessionClose:
      name: session.close
      title: session.close
      summary: Close an agent session.
      description: Harness to executor request (capability agent). The executor cancels a running turn as turn.cancel does, waits until its events are acknowledged, releases the local conversation, and then sends session.ended. closed=false for an unknown session. A later turn.start with the same session_id starts a new local conversation.
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          id:
            $ref: schemas/common.json#/$defs/JsonRpcId
          method:
            type: string
            const: session.close
          params:
            type: object
            additionalProperties: false
            properties:
              session_id:
                type: string
              reason:
                type: string
            required:
              - session_id
              - reason
        required:
          - jsonrpc
          - id
          - method
          - params
      x-bma-jsonrpc-method: session.close
      x-bma-direction: harness-to-executor
      x-bma-kind: request
      x-bma-channel: control
    sessionEventDelta:
      name: session.event_delta
      title: session.event_delta
      summary: Stream a preview of a durable agent event.
      description: Executor to harness notification (capability agent). Transient and lossy; never acknowledged or resent. event_id is the event_id of the durable session.event that finalizes the preview. The harness relays it to subscribers as Anthropic event_start and event_delta.
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          method:
            type: string
            const: session.event_delta
          params:
            type: object
            additionalProperties: false
            properties:
              session_id:
                type: string
              turn_id:
                type: string
              event_id:
                type: string
              event_type:
                $ref: schemas/agent.json#/$defs/EventDeltaType
              index:
                type: integer
                minimum: 0
              text:
                type: string
            required:
              - session_id
              - turn_id
              - event_id
