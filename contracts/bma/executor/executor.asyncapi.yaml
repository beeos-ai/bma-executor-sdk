asyncapi: 3.0.0
id: https://contracts.beeos.ai/executor.asyncapi
info:
  title: BMA Executor Protocol channels
  version: 2.901.0
  description: "WebSocket channels for bma.executor.v1 and bma.executor.v1.1. The control channel carries JSON-RPC 2.0 requests, notifications, and responses. The mcp channel carries raw MCP JSON-RPC with no BMA wrapper. PTY bytes travel on per-attach outbound host sockets (subprotocol bma.terminal.v1), not on these channels. Contract 1.4.0 adds the platform tools endpoint (x-bma-platform-tools): the HTTP MCP endpoint a brain on one machine calls to run its tools on the session's hands machine."
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
defaultContentType: application/json
servers:
  machine:
    host: "{host}"
    protocol: wss
    protocolVersion: "1.1"
    pathname: /v1/machines/{machine_id}/channel
    description: Machine-scoped executor channel (control only). Token is a short-lived executor JWT from POST /v1/machines/{machine_id}/token; machine_id must equal the machine in the credential, else 404.
    security:
      - $ref: "#/components/securitySchemes/executorJWT"
    variables:
      host:
        default: executor.example.com
        description: BMA executor host.
      machine_id:
        description: Machine id; executors read it from BMA_MACHINE_ID.
  environment:
    host: "{host}"
    protocol: wss
    protocolVersion: "1.1"
    pathname: /v1/environments/{environment_id}/channel
    description: Environment-scoped executor channel (control, and mcp via ?channel=mcp). Token is a short-lived executor JWT from POST /v1/environments/{environment_id}/token; environment_id must equal the environment in the credential, else 404.
    security:
      - $ref: "#/components/securitySchemes/executorJWT"
    variables:
      host:
        default: executor.example.com
        description: BMA executor host.
      environment_id:
        description: Environment id.
  control:
    host: "{host}"
    protocol: wss
    protocolVersion: "1.1"
    pathname: /v1/executors/channel
    description: "Deprecated: use the machine or environment server. Legacy executor control channel, served as an alias until the legacy paths are removed (contract 2.0). Token is a short-lived executor JWT."
    x-bma-deprecated: true
    security:
      - $ref: "#/components/securitySchemes/executorJWT"
    variables:
      host:
        default: executor.example.com
        description: BMA executor host.
  mcp:
    host: "{host}"
    protocol: wss
    protocolVersion: "1.1"
    pathname: /v1/executors/channel
    description: "Deprecated: use the environment server with ?channel=mcp. Legacy raw MCP JSON-RPC channel for one environment-origin MCP server."
    x-bma-deprecated: true
    security:
      - $ref: "#/components/securitySchemes/executorJWT"
    variables:
      host:
        default: executor.example.com
        description: BMA executor host.
channels:
  control:
    address: /v1/executors/channel?channel=control
    title: Executor control channel
    x-bma-addresses:
