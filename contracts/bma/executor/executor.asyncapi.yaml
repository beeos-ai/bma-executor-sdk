  securitySchemes:
    executorJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Channel-scoped executor JWT fetched from POST /v1/environments/{environment_id}/token with an environment key or POST /v1/machines/{machine_id}/token with a machine daemon token (legacy aliases: POST /api/v1/executors/token for a machine daemon token, POST /v1/executors/token for an environment key). A machine-scoped JWT carries machine_id and daemon_token_id."
x-bma-token-endpoints:
  - method: POST
    path: /v1/machines/{machine_id}/token
    authentication:
      - machine-daemon-token
    description: Machine-scoped executor token (owner bma-machine). machine_id must equal the machine in the credential, else 404; the executor_id of the result is exec_<machine_id>. The body environment_id is empty or absent.
    request:
      $ref: schemas/executor.json#/$defs/ExecutorTokenRequest
    response:
      $ref: schemas/executor.json#/$defs/ExecutorTokenResponse
  - method: POST
    path: /v1/environments/{environment_id}/token
    authentication:
      - environment-key
    description: Environment-scoped executor token (owner bma-environment). environment_id must equal the environment of the key, else 404; a body environment_id, when sent, must equal it.
    request:
      $ref: schemas/executor.json#/$defs/ExecutorTokenRequest
    response:
      $ref: schemas/executor.json#/$defs/ExecutorTokenResponse
x-bma-platform-tools:
  description: "Platform tools endpoint (contract 1.4.0). When turn.start metadata carries tools_mcp_url, tools_mcp_token and tools_mcp_token_expires_at (the session binds this executor as the brain machine and a different machine as the hands machine, and the executor declared platform_credentials brain_tools), the brain sends every tool call of the turn to tools_mcp_url as MCP JSON-RPC over HTTPS (Authorization: Bearer <tools_mcp_token>) and never runs a tool locally (fail closed). The token is bound to the org, session, turn, brain machine and brain epoch; it lives 1 hour and is renewed with tools_token.refresh. The platform checks token and epoch, re-evaluates the tool policy, verifies the approval, claims the idempotency key, then runs the tool on the hands machine through its own tool.call or process.* methods; the hands executor's local policy may still refuse. A turn.cancel, session.close or turn end cancels the calls of the turn on the hands machine (process.interrupt, then process.terminate after a grace period). A brain disconnect does not kill processes already running on the hands machine; their results are kept by idempotency key for 24 hours and a brain that resumes the turn in a new epoch retries with the same key to get the result (replayed=true)."
  endpoint: https://{host}/v1/machines/{brain_machine_id}/mcp
  authentication:
    - tools_mcp_token
  tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
  mcp-tools: "Contract 1.14.0. The names of the turn.start AgentTurnConfig.mcp_tools entries (mcp__<mcp_server_name>__<tool_name>) are tools of the endpoint for that turn too: tools/list lists them after the platform tools, and tools/call runs the named tool on its MCP server (not on the hands machine) with the server's credential, through the same token, policy, approval and idempotency checks; a name the turn was not given answers invalid params. The answer is the server's CallToolResult (text over 100,000 characters replaced by a preview), with structuredContent outcome; a server that could not be used answers isError with outcome not_forwarded (could not connect, credential refused: safe to retry) or unknown (the request left and no answer came: never rerun) and error_code mcp_connection_failed or mcp_authentication_failed."
  platform-tools: "Contract 1.26.0. The names of the turn.start AgentTurnConfig.platform_tools entries are tools of the endpoint for that turn too: tools/list lists them, and tools/call runs the named tool on the platform itself (no hands machine; it works while the session has no machine bound), through the same token, policy, approval and idempotency checks; a name the turn was not given answers invalid params. generate_image (input tool.json GenerateImageInput, structuredContent tool.json GenerateImageResult) calls the image model on the session's own model route (the provider its model calls go to, which pays), stores each image as a session output file (output_path generated/<name>.png, mounted at uploads/generated/<name>.png, with an XMP TC260 AIGC label written without re-encoding the pixels) and answers a text, one preview image per file (at most 1024 px, annotations.audience [assistant]) and structuredContent. A model the turn does not offer answers error_code image_model_not_allowed with available_models. A keyed call still generating when sync_wait_ms passes answers in_progress; the generation completes on the platform and the same key returns its result (replayed=true) without generating or recording usage again (contracts/bma/platform-tool-image.vectors.json). Contract 2.1.0: web_search (input tool.json WebSearchInput, structuredContent tool.json WebSearchResult) and web_fetch (tool.json WebFetchInput / WebFetchResult) of agent_toolset_20260401 are platform tools too, offered when the agent's toolset enables them (the agent tool_policy decides them like its other toolset tools) and run on the platform: web_search with the platform's search providers (Chinese-region queries first to a Chinese provider, the next provider while one is throttled or unavailable; structuredContent.provider names the one that answered; the platform pays; each search is one usage fact of the session at that provider's list price), web_fetch through the platform's SSRF guard (public addresses only at connect time, every redirect hop included; robots.txt respected). Their text carries the external content inside <untrusted_web_content> … </untrusted_web_content>. A turn runs at most 20 web_search and 30 web_fetch calls; past that a call answers max_uses_exceeded (contracts/bma/platform-tool-web.vectors.json). Contract 2.4.0: a brain that runs its tools on its own machine reaches the same endpoint for the turn's platform tools with platform_tools_mcp_token (turn.start metadata platform_tools_mcp_*, platform_credentials platform_tools): that token lists and runs only the turn's platform_tools (web_search, web_fetch); any other name answers invalid params."
  tools-call-meta:
    ai.beeos.bma/approval: "Approval evidence for a call the policy resolved as always_ask: the interaction id the user answered with allow. A missing or mismatched value answers approval_required or approval_invalid."
    ai.beeos.bma/idempotency_key: Caller-chosen key (1-200 bytes) that makes a repeated call return the stored result instead of running the tool again; the same key with different input answers idempotency_key_reused. Results are kept for 24 hours.
    ai.beeos.bma/sync_wait_ms: How long the call waits for the hands machine before it answers in_progress (the work continues and the same key fetches the result).
  structured-content:
    outcome: "executed | not_forwarded | unknown. executed: ran and finished. not_forwarded: certainly not run (for example the hands machine was offline for the whole wait). unknown: forwarded but the result is lost (hands restarted or disconnected); the platform never reruns it."
    error_code: "Open set, set when the call did not execute normally: environment_unavailable, machine_starting, machine_rebuilding, permission_denied, approval_required, approval_invalid, in_progress, idempotency_key_reused, for computer use calls desktop_busy and desktop_human_control (a person holds the desktop control lease: observe and action are both refused, nothing runs, no screenshot), and for generate_image content_policy_violation, invalid_image_input, rate_limited, image_model_unavailable, image_model_not_allowed and billing_suspended (contract 1.26.0), for web_search and web_fetch url_not_allowed, unsupported_content_type, content_too_large, fetch_failed, search_unavailable, rate_limited, max_uses_exceeded and billing_suspended (contract 2.1.0); receivers must accept values they do not know. A paused pool hands machine is woken for the call; machine_starting / machine_rebuilding (outcome not_forwarded, retryable: the text says when to call again) is a pool machine still starting or being rebuilt when the wait of the call ends; environment_unavailable is a machine that is offline (contracts/bma/platform-tool-machine-wake.vectors.json)."
    replayed: true when the result is the stored one of an earlier call with the same idempotency key.
    output_file: Path on the hands machine of the full output when it was truncated.
    pid: Process id on the hands machine of a call that is still running (in_progress).
    files: Contract 1.26.0. Session files the call created (tool.json ToolResultFile[]); the brain copies them into agent.tool_result.bma_files.
x-bma-token-endpoint:
  deprecated: true
  description: "Deprecated alias of POST /v1/environments/{environment_id}/token: it takes an environment key only, and the key names the environment. The machine daemon token alias is POST /api/v1/executors/token (of POST /v1/machines/{machine_id}/token, the token names the machine); a machine token sent here is answered 401, an environment key sent there too (ADR-0023 3.3: one credential kind per path, nothing read from the token)."
  method: POST
  path: /v1/executors/token
  authentication:
    - environment-key
  request:
    $ref: schemas/executor.json#/$defs/ExecutorTokenRequest
  response:
    $ref: schemas/executor.json#/$defs/ExecutorTokenResponse
