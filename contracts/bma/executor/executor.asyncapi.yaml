      x-bma-direction: executor-to-harness
      x-bma-kind: notification
      x-bma-channel: control
    sessionHistory:
      name: session.history
      title: session.history
      summary: Read the conversation of a session before a turn.
      description: "Executor to harness request (capability agent, contract 1.15.0). The executor that is the session's brain (the target the session's turns are dispatched to) reads the session's conversation as the platform's event log keeps it, the single source of truth of a session: the durable events before the opening input of the given running turn, a page at a time in log order (has_more says more follow). Only the conversation travels: user.message, agent.message, agent.tool_use, agent.tool_result, agent.custom_tool_use, user.custom_tool_result, agent.mcp_tool_use and agent.mcp_tool_result, each with its bma_sequence, id, type and official body. To an executor that declared agent.input_by_reference a user.message whose body is over 48 KiB carries its content as a single input_ref block (contract 1.7.0) whose input_id is the event's id: the inputs endpoint answers the message's content blocks. A brain calls it when it opens a session it holds no local state for although the session has a past, for example a session whose earlier turns ran on another brain (data migration from another stack) or whose state was lost; it rebuilds its context from the events, replaying messages, tool calls and their results in its model's format under its usual context limits, and answers the turn.start with context_rebuilt true. Only the session's brain may read it: any other connection gets forbidden (-32001), before any turn of the session was dispatched not_dispatched (-32013, retryable); a turn that is not open is session_not_active (-32007); an unknown or deleted session is session_not_found (-32002). A harness without the method answers -32601; the brain then has no history to rebuild from."
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          id:
            $ref: schemas/common.json#/$defs/JsonRpcId
          method:
            type: string
            const: session.history
          params:
            type: object
            additionalProperties: false
            properties:
              session_id:
                type: string
              turn_id:
                type: string
              after:
                type: integer
                minimum: 0
              limit:
                type: integer
                minimum: 1
                maximum: 500
            required:
              - session_id
              - turn_id
        required:
          - jsonrpc
          - id
          - method
          - params
      x-bma-jsonrpc-method: session.history
      x-bma-direction: executor-to-harness
      x-bma-kind: request
      x-bma-channel: control
    interactionRequest:
      name: interaction.request
      title: interaction.request
      summary: Ask the platform for an approval or an answer.
      description: Executor to harness request (capability agent). The harness opens one platform agent interaction (the same request on desktop, mobile and integrations) and answers with interaction.response later. Idempotent by interaction_id. A permission request references the agent.tool_use event in tool_use_id, sent earlier with evaluated_permission ask. The executor keeps local authority; it may still deny, and it treats expires_at as a local deny. An interaction_id of the form appr_ plus 24 lower-case hex digits (the deterministic approval id) is adopted as the platform interaction id; the interactions API, its card and the session stream use it, platform_interaction_id equals it, and a repeat of it (after an executor restart too) names the same interaction, never a second card. The same id for another tool_use_id (within one executor epoch) or another kind is refused with error conflict (-32013) and the stored interaction is left unchanged. An interaction_id of any other form is only the executor's key; the platform assigns its own id (int_...) and returns it.
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
