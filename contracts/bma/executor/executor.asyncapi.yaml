    modelTokenRefresh:
      name: model_token.refresh
      title: model_token.refresh
      summary: Fetch a fresh model token for a running turn.
      description: "Executor to harness request (capability agent). A brain started by turn.start with a model credential (metadata model_token, valid 1 hour) calls it before the token expires (the reference executors do so when less than 10 minutes remain) and joins model_base_url with the new model_token for its next model calls; the old token stays valid until it expires. The platform signs a new token only while the turn is active (pending, running or rescheduling) and the turn belongs to a session routed to this executor's machine, so a turn that ended, was canceled or failed gets no further tokens: this is how the platform revokes model access per turn (a token already issued runs out its own expiry). Each call returns a new token; calls are not idempotent and a repeat is harmless. Errors carry data.reason: turn_inactive (-32007: the turn is not active), forbidden (-32001: the session or turn is unknown, belongs to another executor, or this executor is not entitled to platform credentials), model_token_unavailable (-32012: the platform issues no such token). A harness without the method answers -32601; the executor then keeps the token it has."
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          id:
            $ref: schemas/common.json#/$defs/JsonRpcId
          method:
            type: string
            const: model_token.refresh
          params:
            type: object
            additionalProperties: false
            properties:
              session_id:
                type: string
              turn_id:
                type: string
            required:
              - session_id
              - turn_id
        required:
          - jsonrpc
          - id
          - method
          - params
      x-bma-jsonrpc-method: model_token.refresh
      x-bma-direction: executor-to-harness
      x-bma-kind: request
      x-bma-channel: control
    toolsTokenRefresh:
      name: tools_token.refresh
      title: tools_token.refresh
      summary: Fetch a fresh platform tools token for a running turn.
      description: "Executor to harness request (capability agent, contract 1.4.0). A brain started by turn.start with a platform tools credential (metadata tools_mcp_token, valid 1 hour, handed over only when the session's brain machine and hands machine differ) calls it before the token expires (the reference executors do so when less than 10 minutes remain) and uses the new tools_mcp_token with tools_mcp_url for its next tool calls; the old token stays valid until it expires or its epoch is superseded. The shape and rules are those of model_token.refresh: the platform signs a new token only while the turn is active (pending, running or rescheduling), the turn belongs to a session routed to this executor's machine as the brain machine, and the call comes from the turn's current epoch, so a turn that ended, was canceled or failed, or was started again in a newer epoch gets no further token for the old epoch. Each call returns a new token; calls are not idempotent and a repeat is harmless. Errors carry data.reason: turn_inactive (-32007: the turn is not active), forbidden (-32001: the session or turn is unknown, belongs to another executor, or this executor is not entitled to brain_tools), tools_token_unavailable (-32012: the platform issues no such token for this turn, for example brain and hands are one machine and the turn has no platform tools). A brain started with platform_tools_mcp_* (contract 2.4.0) refreshes that credential the same way: the result's tools_mcp_url and tools_mcp_token are its new platform_tools_mcp_url and platform_tools_mcp_token. A harness without the method answers -32601; the executor then keeps the token it has."
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          id:
            $ref: schemas/common.json#/$defs/JsonRpcId
          method:
            type: string
            const: tools_token.refresh
          params:
            type: object
            additionalProperties: false
            properties:
              session_id:
                type: string
              turn_id:
                type: string
            required:
              - session_id
              - turn_id
        required:
          - jsonrpc
          - id
          - method
          - params
      x-bma-jsonrpc-method: tools_token.refresh
      x-bma-direction: executor-to-harness
      x-bma-kind: request
      x-bma-channel: control
    workingLogRead:
      name: working_log.read
      title: working_log.read
      summary: Read a page of the session's working log.
      description: "Executor to harness request (capability agent, contract 1.22.0, ADR-0083). The executor that is the session's brain (the target the session's turns are dispatched to) reads the working log it keeps on the platform: its entries after the given sequence, in order, a page at a time (has_more says that more follow), and the highest local sequence the platform has acknowledged. An executor reads it when it opens a session it holds no copy of, for example after another instance of its brain fleet ran the session's earlier turns. Only the session's brain may read it: any other connection gets forbidden (-32001), and before any turn of the session was dispatched not_dispatched (-32013, retryable). An unknown or deleted session is session_not_found (-32002)."
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          id:
            $ref: schemas/common.json#/$defs/JsonRpcId
          method:
            type: string
            const: working_log.read
          params:
            type: object
            additionalProperties: false
            properties:
              session_id:
                type: string
              after:
                type: integer
                minimum: 0
              limit:
                type: integer
                minimum: 1
                maximum: 500
            required:
              - session_id
        required:
          - jsonrpc
          - id
          - method
          - params
      x-bma-jsonrpc-method: working_log.read
      x-bma-direction: executor-to-harness
      x-bma-kind: request
      x-bma-channel: control
    workingLogAppend:
      name: working_log.append
      title: working_log.append
      summary: Append entries to the session's working log.
      description: Executor to harness request (capability agent, contract 1.22.0, ADR-0083). The session's brain appends entries to the working log it keeps on the platform; the answer means they are stored. An entry whose key the log already has is skipped, so a repeated append is harmless; the entries of one call are stored together or not at all, at most 500 per call. acked_sequence moves the platform's record of the highest acknowledged local sequence up (never down, never beyond the log). The same refusals as working_log.read apply; a refused append means the executor is no longer the session's brain and must stop the session's turn. Invalid entries (no type, a payload that is not an object, too many) and an acked_sequence beyond the log are invalid_params with data.reason invalid_entry, batch_too_large or acked_beyond_log.
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          id:
            $ref: schemas/common.json#/$defs/JsonRpcId
          method:
            type: string
            const: working_log.append
          params:
            type: object
            additionalProperties: false
            properties:
              session_id:
                type: string
              entries:
                type: array
                maxItems: 500
                items:
                  $ref: schemas/agent.json#/$defs/WorkingLogEntry
              acked_sequence:
                type: integer
                minimum: 0
            required:
              - session_id
        required:
          - jsonrpc
          - id
          - method
          - params
      x-bma-jsonrpc-method: working_log.append
      x-bma-direction: executor-to-harness
      x-bma-kind: request
      x-bma-channel: control
