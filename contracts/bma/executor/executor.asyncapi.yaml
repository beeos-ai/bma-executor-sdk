components:
  messages:
    screenStart:
      name: screen.start
      title: screen.start
      summary: Start a native WebRTC screen producer.
      description: "Deprecated: a native screen producer publishes into the SFU with screen.live (display.screen_live) instead; screen.start and screen.stop are removed once no executor declares display.native_webrtc. Starts a single native screen relay for this machine; no shell or virtual desktop is created. The server-selected session is idempotent; another active session is rejected. The relay ticket must never be logged. Human input remains disabled until separately fenced and authorized."
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          id:
            $ref: schemas/common.json#/$defs/JsonRpcId
          method:
            type: string
            const: screen.start
          params:
            type: object
            additionalProperties: false
            properties:
              session_id:
                type: string
              relay_url:
                type: string
              relay_ticket:
                type: string
            required:
              - session_id
              - relay_url
              - relay_ticket
        required:
          - jsonrpc
          - id
          - method
          - params
      x-bma-jsonrpc-method: screen.start
      x-bma-direction: harness-to-executor
      x-bma-kind: request
      x-bma-channel: control
      x-bma-idempotent-by: session_id
    screenStop:
      name: screen.stop
      title: screen.stop
      summary: Stop a native screen session.
      description: Deprecated with screen.start. Fences human input and stops the named native screen producer, waiting for cleanup before returning. Never resumes an agent. A repeated stop is safe; it must not affect a replacement session.
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          id:
            $ref: schemas/common.json#/$defs/JsonRpcId
          method:
            type: string
            const: screen.stop
          params:
            type: object
            additionalProperties: false
            properties:
              session_id:
                type: string
            required:
              - session_id
        required:
          - jsonrpc
          - id
          - method
          - params
      x-bma-jsonrpc-method: screen.stop
      x-bma-direction: harness-to-executor
      x-bma-kind: request
      x-bma-channel: control
      x-bma-idempotent-by: session_id
    screenLive:
      name: screen.live
      title: screen.live
      summary: Publish, renew or stop the machine's live screen in the SFU.
      description: "The platform's command to the screen publisher of a machine (desktop-relay.md §5; ADR-0080). screen_live_start: join room at url with token as publisher_identity and publish one SCREEN_SHARE video track; answer published=true only once the track is published. screen_live_renew: extend the publisher's local lease to expires_at_ms. screen_live_stop: unpublish and leave the room. The publisher stops on its own when the local lease passes without a renew. A start for the same session_id and generation is idempotent; a start with a higher generation replaces the current publication. width and height (start only, both or neither) are the size the session asked for; a physical screen keeps its own size. The token must never be logged. The publisher receives the holder's signed input as SFU data (bma.input.v1) and hands it to the executor's control gate; it holds no input authority itself. An executor declares at most one of display.screen_live and display.native_webrtc."
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          id:
            $ref: schemas/common.json#/$defs/JsonRpcId
          method:
            type: string
            const: screen.live
          params:
            type: object
            additionalProperties: false
            properties:
              type:
                type: string
                enum:
                  - screen_live_start
                  - screen_live_renew
                  - screen_live_stop
              request_id:
                type: string
              session_id:
                type: string
                description: The capture (one publication); distinct from the desktop session.
              desktop_session_id:
                type: string
              machine_id:
                type: string
                description: Must equal the executor's machine; otherwise invalid params.
              generation:
                type: integer
                minimum: 1
                x-go-type: int64
              room:
                type: string
              url:
                type: string
                description: SFU signaling URL (wss), on screen_live_start.
              token:
                type: string
                description: Publisher access token for room, on screen_live_start. Never logged.
              publisher_identity:
                type: string
              expires_at_ms:
                type: integer
                x-go-type: int64
                description: The publisher's local lease deadline (Unix milliseconds).
              width:
                type: integer
                x-go-type: int32
              height:
                type: integer
                x-go-type: int32
            required:
              - type
              - request_id
              - session_id
              - machine_id
              - generation
              - room
              - expires_at_ms
        required:
          - jsonrpc
          - id
          - method
          - params
      x-bma-jsonrpc-method: screen.live
      x-bma-direction: harness-to-executor
      x-bma-kind: request
      x-bma-channel: control
      x-bma-idempotent-by: session_id
    screenControl:
      name: screen.control
      title: screen.control
      summary: Grant, renew, release or hand back a human's input lease on the live screen.
      description: The executor's input fence for screen live sessions (rewrite-realtime.md §1.2). grant and renew admit only signed input (desktop-relay.md §5b) from identity, signed with input_key (32-byte Ed25519 public key, base64url without padding), under epoch and lease_id until expires_at_ms, and refuse the agent's input meanwhile; epoch never decreases within the executor process. release and handback drain the holder's input and release everything it holds before answering; handback lets the agent resume. The executor answers accepted only after the fence is in effect.
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          id:
            $ref: schemas/common.json#/$defs/JsonRpcId
          method:
            type: string
            const: screen.control
          params:
            type: object
            additionalProperties: false
            properties:
              session_id:
                type: string
                description: The capture.
              action:
                type: string
                enum:
                  - grant
                  - renew
                  - release
                  - handback
              machine_id:
                type: string
              epoch:
                type: integer
                x-go-type: int64
              lease_id:
                type: string
              identity:
                type: string
                description: The holder's SFU participant identity (grant, renew).
              input_key:
                type: string
                description: The holder's Ed25519 public key, base64url (grant, renew).
              expires_at_ms:
                type: integer
                x-go-type: int64
            required:
              - session_id
              - action
              - machine_id
              - epoch
              - lease_id
        required:
          - jsonrpc
          - id
          - method
          - params
      x-bma-jsonrpc-method: screen.control
      x-bma-direction: harness-to-executor
      x-bma-kind: request
      x-bma-channel: control
      x-bma-idempotent-by: lease_id
    executorRegister:
      name: executor.register
      title: executor.register
      summary: Register an executor connection.
      description: Executor to harness request, the first frame on the control channel. protocol MUST equal the negotiated WebSocket subprotocol; otherwise the server answers -32010 and closes with 4003. A machine-scoped executor sends an empty environment_id. resume.active_sessions reattaches sessions after reconnect. A machine-scoped executor that declares neither capabilities.process nor capabilities.agent is answered -32012 with data.reason "capability_missing" and data.capability "process" instead of a result; no runtime is bound and the connection stays unregistered.
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          jsonrpc:
            type: string
            const: "2.0"
          id:
            $ref: schemas/common.json#/$defs/JsonRpcId
          method:
            type: string
            const: executor.register
          params:
            type: object
            additionalProperties: false
            properties:
              protocol:
                $ref: schemas/common.json#/$defs/ProtocolVersion
              environment_id:
                type: string
              executor:
                $ref: schemas/executor.json#/$defs/ExecutorInfo
              capabilities:
                $ref: schemas/executor.json#/$defs/Capabilities
              resume:
                $ref: schemas/executor.json#/$defs/ExecutorResume
            required:
              - protocol
              - environment_id
              - executor
              - capabilities
        required:
          - jsonrpc
          - id
          - method
          - params
