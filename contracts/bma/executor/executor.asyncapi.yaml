    description: "Addresses: GET /v1/environments/{environment_id}/channel?channel=mcp; address below is the deprecated legacy alias. Raw MCP JSON-RPC for one environment-origin MCP server. Connect with ?channel=mcp&session_id=<id>&server_key=<key>. No BMA wrapper and no mcp.start/mcp.frame/mcp.stop methods."
    messages:
