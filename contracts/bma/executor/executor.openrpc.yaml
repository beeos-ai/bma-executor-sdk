openrpc: 1.2.6
info:
  title: BMA Executor Protocol
  version: 2.901.0
  description: >-
    Machine-readable method catalog for bma.executor.v1 and bma.executor.v1.1, the outbound
    WebSocket + JSON-RPC 2.0 contract between a BMA harness and an executor. The prose lives in
    docs/architecture/executor-protocol-v1.md and the v1.1 delta doc. JSON-RPC params are named
    object members; each OpenRPC param is one member.


    x-bma-since is the first protocol that has the method; a server never sends a v1.1 method to a
    v1 connection. x-bma-capability names the capability bit the harness checks before sending the
    method; an executor without it answers -32012 capability_unavailable.


    WebSocket close codes: 4001 token expired (reconnect with a new token), 4003 unsupported
    protocol, 4004 replaced by a newer connection for the same executor (stop), 4005 drained
    (reconnect).
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - name: machine
    url: wss://{host}/v1/machines/{machine_id}/channel?channel=control
    summary: Machine-scoped executor control channel.
    description: The executor's token comes from POST /v1/machines/{machine_id}/token. machine_id must equal the machine in the credential, otherwise the server answers 404. Executors read it from BMA_MACHINE_ID.
    variables:
      host:
        default: executor.example.com
        description: BMA executor host.
      machine_id:
        default: mach_example
        description: Machine id.
  - name: environment
    url: wss://{host}/v1/environments/{environment_id}/channel?channel=control
    summary: Environment-scoped executor control channel; ?channel=mcp selects the raw MCP channel.
    description: The executor's token comes from POST /v1/environments/{environment_id}/token. environment_id must equal the environment in the credential, otherwise the server answers 404. The raw MCP channel for one environment-origin MCP server is the same path with ?channel=mcp&session_id={session_id}&server_key={server_key}.
    variables:
      host:
        default: executor.example.com
        description: BMA executor host.
      environment_id:
        default: env_example
        description: Environment id.
  - name: control
    url: wss://{host}/v1/executors/channel?channel=control
    summary: Deprecated alias of the machine and environment servers; executor control channel.
    variables:
      host:
        default: executor.example.com
        description: BMA executor host.
  - name: mcp
    url: wss://{host}/v1/executors/channel?channel=mcp&session_id={session_id}&server_key={server_key}
    summary: Deprecated alias of the environment server with ?channel=mcp; raw MCP JSON-RPC channel for one environment-origin MCP server.
    variables:
      host:
        default: executor.example.com
        description: BMA executor host.
      session_id:
        default: sess_example
        description: Assigned session id.
      server_key:
        default: chrome
        description: MCP server key from the session assignment.
methods:
  - name: screen.start
    summary: Start a native WebRTC screen producer.
    description: >-
      Deprecated: a native screen producer publishes into the SFU with screen.live
      (display.screen_live) instead; screen.start and screen.stop are removed once
      no executor declares display.native_webrtc.
      Starts a single native screen relay for this machine; no shell or virtual
      desktop is created. The server-selected session is idempotent; another
      active session is rejected. The relay ticket must never be logged. Human
      input remains disabled until separately fenced and authorized.
    deprecated: true
    tags:
      - name: screen
    x-bma-direction: harness-to-executor
    x-bma-kind: request
    x-bma-channel: control
    x-bma-since: bma.executor.v1.1
    x-bma-capability: display.native_webrtc
    x-bma-idempotent-by: session_id
    params:
      - name: session_id
        required: true
        schema:
          type: string
      - name: relay_url
        required: true
        schema:
          type: string
      - name: relay_ticket
        required: true
        schema:
          type: string
    result:
      name: result
      schema:
        $ref: schemas/executor.json#/$defs/ScreenStartResult
  - name: screen.stop
    summary: Stop a native screen session.
    description: >-
      Deprecated with screen.start.
      Fences human input and stops the named native screen producer, waiting
      for cleanup before returning. Never resumes an agent. A repeated stop
      is safe; it must not affect a replacement session.
    deprecated: true
    tags:
      - name: screen
    x-bma-direction: harness-to-executor
    x-bma-kind: request
    x-bma-channel: control
    x-bma-since: bma.executor.v1.1
    x-bma-capability: display.native_webrtc
    x-bma-idempotent-by: session_id
    params:
      - name: session_id
        required: true
        schema:
          type: string
    result:
      name: result
      schema:
        $ref: schemas/executor.json#/$defs/ScreenStopResult
  - name: screen.live
    summary: Publish, renew or stop the machine's live screen in the SFU.
    description: >-
      The platform's command to the screen publisher of a machine (desktop-relay.md §5; ADR-0080).
      screen_live_start: join room at url with token as publisher_identity and publish one
      SCREEN_SHARE video track; answer published=true only once the track is published.
      screen_live_renew: extend the publisher's local lease to expires_at_ms. screen_live_stop:
      unpublish and leave the room. The publisher stops on its own when the local lease passes
      without a renew. A start for the same session_id and generation is idempotent; a start
      with a higher generation replaces the current publication. width and height (start only,
      both or neither) are the size the session asked for; a physical screen keeps its own size.
      The token must never be logged. The publisher receives the holder's signed input as SFU data
      (bma.input.v1) and hands it to the executor's control gate; it holds no input authority
      itself. An executor declares at most one of display.screen_live and display.native_webrtc.
    tags:
      - name: screen
    x-bma-direction: harness-to-executor
    x-bma-kind: request
    x-bma-channel: control
    x-bma-since: bma.executor.v1.1
    x-bma-capability: display.screen_live
    x-bma-idempotent-by: session_id
    params:
      - name: type
        required: true
        schema:
          type: string
          enum:
            - screen_live_start
            - screen_live_renew
            - screen_live_stop
      - name: request_id
        required: true
        schema:
          type: string
      - name: session_id
        required: true
        schema:
          type: string
          description: The capture (one publication); distinct from the desktop session.
      - name: desktop_session_id
        required: false
        schema:
          type: string
      - name: machine_id
        required: true
        schema:
          type: string
          description: Must equal the executor's machine; otherwise invalid params.
      - name: generation
        required: true
        schema:
          type: integer
          minimum: 1
          x-go-type: int64
      - name: room
        required: true
        schema:
          type: string
      - name: url
        required: false
        schema:
          type: string
          description: SFU signaling URL (wss), on screen_live_start.
      - name: token
        required: false
        schema:
          type: string
          description: Publisher access token for room, on screen_live_start. Never logged.
      - name: publisher_identity
        required: false
        schema:
          type: string
      - name: expires_at_ms
        required: true
        schema:
          type: integer
          x-go-type: int64
          description: The publisher's local lease deadline (Unix milliseconds).
      - name: width
        required: false
        schema:
          type: integer
          x-go-type: int32
      - name: height
        required: false
        schema:
          type: integer
          x-go-type: int32
    result:
      name: result
      schema:
        $ref: schemas/executor.json#/$defs/ScreenLiveResult
    errors:
      - $ref: "#/components/errors/InvalidParams"
      - $ref: "#/components/errors/CapabilityUnavailable"
      - $ref: "#/components/errors/ResourceUnavailable"
  - name: screen.control
    summary: Grant, renew, release or hand back a human's input lease on the live screen.
    description: >-
      The executor's input fence for screen live sessions (rewrite-realtime.md §1.2). grant and
      renew admit only signed input (desktop-relay.md §5b) from identity, signed with input_key
      (32-byte Ed25519 public key, base64url without padding), under epoch and lease_id until
      expires_at_ms, and refuse the agent's input meanwhile; epoch never decreases within the
      executor process. release and handback drain the holder's input and release everything it
      holds before answering; handback lets the agent resume. The executor answers accepted only
      after the fence is in effect.
    tags:
      - name: screen
    x-bma-direction: harness-to-executor
    x-bma-kind: request
    x-bma-channel: control
    x-bma-since: bma.executor.v1.1
    x-bma-capability: display.screen_control
    x-bma-idempotent-by: lease_id
    params:
      - name: session_id
        required: true
        schema:
          type: string
          description: The capture.
      - name: action
        required: true
        schema:
          type: string
          enum:
            - grant
            - renew
            - release
            - handback
      - name: machine_id
        required: true
        schema:
          type: string
      - name: epoch
        required: true
        schema:
          type: integer
          x-go-type: int64
      - name: lease_id
        required: true
        schema:
          type: string
      - name: identity
        required: false
        schema:
          type: string
          description: The holder's SFU participant identity (grant, renew).
      - name: input_key
        required: false
        schema:
          type: string
          description: The holder's Ed25519 public key, base64url (grant, renew).
      - name: expires_at_ms
        required: false
        schema:
          type: integer
          x-go-type: int64
    result:
      name: result
      schema:
        $ref: schemas/executor.json#/$defs/ScreenControlResult
    errors:
      - $ref: "#/components/errors/InvalidParams"
      - $ref: "#/components/errors/CapabilityUnavailable"
  - name: executor.register
    summary: Register an executor connection.
    description: Executor to harness request, the first frame on the control channel. protocol MUST
      equal the negotiated WebSocket subprotocol; otherwise the server answers -32010 and closes
      with 4003. A machine-scoped executor sends an empty environment_id. resume.active_sessions
      reattaches sessions after reconnect. A machine-scoped executor that declares neither
      capabilities.process nor capabilities.agent is answered -32012 with data.reason
      "capability_missing" and data.capability "process" instead of a result; no runtime is bound
      and the connection stays unregistered.
    tags:
      - name: executor
    x-bma-direction: executor-to-harness
    x-bma-kind: request
    x-bma-channel: control
    x-bma-since: bma.executor.v1
    params:
      - name: protocol
        required: true
        schema:
          $ref: schemas/common.json#/$defs/ProtocolVersion
      - name: environment_id
        required: true
        description: Selfhost environment id; empty for a machine-scoped executor.
        schema:
          type: string
      - name: executor
        required: true
        schema:
          $ref: schemas/executor.json#/$defs/ExecutorInfo
      - name: capabilities
        required: true
        schema:
          $ref: schemas/executor.json#/$defs/Capabilities
      - name: resume
        required: false
        schema:
          $ref: schemas/executor.json#/$defs/ExecutorResume
    result:
      name: ExecutorRegisterResult
      schema:
        $ref: schemas/executor.json#/$defs/ExecutorRegisterResult
    errors:
      - $ref: "#/components/errors/InvalidParams"
      - $ref: "#/components/errors/InvalidRequest"
      - $ref: "#/components/errors/Unauthorized"
      - $ref: "#/components/errors/Forbidden"
      - $ref: "#/components/errors/NotFound"
      - $ref: "#/components/errors/PayloadTooLarge"
      - $ref: "#/components/errors/UnsupportedProtocol"
      - $ref: "#/components/errors/CapabilityUnavailable"
      - $ref: "#/components/errors/InternalError"
  - name: executor.heartbeat
    summary: Refresh the executor lease.
    description: Executor to harness request, sent every heartbeat_interval_ms. Two missed heartbeats
      expire the lease server-side. drain=true means the executor must stop accepting new sessions
      and finish current work.
    tags:
      - name: executor
    x-bma-direction: executor-to-harness
    x-bma-kind: request
    x-bma-channel: control
    x-bma-since: bma.executor.v1
    params:
      - name: connection_id
        required: true
        schema:
          type: string
      - name: active_sessions
        required: true
        schema:
          type: array
          items:
            type: string
      - name: load
        required: false
        schema:
          $ref: schemas/common.json#/$defs/ExecutorLoad
    result:
      name: ExecutorHeartbeatResult
      schema:
        $ref: schemas/executor.json#/$defs/ExecutorHeartbeatResult
    errors:
      - $ref: "#/components/errors/InvalidParams"
      - $ref: "#/components/errors/Unauthorized"
      - $ref: "#/components/errors/LeaseExpired"
      - $ref: "#/components/errors/InternalError"
  - name: executor.token.refresh
    summary: Extend the connection with a fresh executor token.
    description: Executor to harness request. Before the current token expires the executor fetches
      a new one from POST /v1/machines/{machine_id}/token or POST /v1/environments/{environment_id}/token
      (legacy aliases POST /api/v1/executors/token, POST /v1/executors/token) with its original credential and sends it on the open
      control channel. The harness verifies that it names the same executor, scope and machine
      credential as the connection and moves the connection's 4001 deadline to the new token's
      expiry; nothing else about the connection changes. A rejected token leaves the old deadline in
      place. A harness without the method answers -32601; the executor then keeps reconnecting on
      4001.
    tags:
      - name: executor
    x-bma-direction: executor-to-harness
    x-bma-kind: request
    x-bma-channel: control
    x-bma-since: bma.executor.v1.1
    params:
      - name: token
        required: true
        schema:
          type: string
    result:
      name: ExecutorTokenRefreshResult
      schema:
        $ref: schemas/executor.json#/$defs/ExecutorTokenRefreshResult
    errors:
      - $ref: "#/components/errors/InvalidParams"
      - $ref: "#/components/errors/Unauthorized"
      - $ref: "#/components/errors/Forbidden"
      - $ref: "#/components/errors/InternalError"
  - name: executor.capabilities.update
    summary: Publish changed executor capabilities.
    description: Executor to harness notification. It may change capabilities, not the protocol version.
    tags:
      - name: executor
    x-bma-direction: executor-to-harness
    x-bma-kind: notification
    x-bma-channel: control
    x-bma-since: bma.executor.v1
    params:
      - name: capabilities
        required: true
        schema:
          $ref: schemas/executor.json#/$defs/Capabilities
  - name: executor.drain
    summary: Ask the executor to drain.
    description: Harness to executor request. The executor stops accepting new sessions, finishes
      current work, and reports active_sessions.
    tags:
      - name: executor
    x-bma-direction: harness-to-executor
    x-bma-kind: request
    x-bma-channel: control
    x-bma-since: bma.executor.v1
    params:
      - name: reason
        required: true
        schema:
          type: string
      - name: deadline_ms
        required: false
        schema:
          type: integer
          minimum: 1
    result:
      name: ExecutorDrainResult
      schema:
        $ref: schemas/executor.json#/$defs/ExecutorDrainResult
    errors:
      - $ref: "#/components/errors/InvalidParams"
      - $ref: "#/components/errors/InternalError"
  - name: executor.close
    summary: Close the executor connection.
    description: Either side notification, followed by WebSocket close code 1000 or 1001.
    tags:
      - name: executor
    x-bma-direction: bidirectional
    x-bma-kind: notification
    x-bma-channel: control
    x-bma-since: bma.executor.v1
    params:
      - name: reason
        required: true
        schema:
          type: string
  - name: session.assign
    summary: Assign a session to the executor.
    description: Harness to executor request. The executor rejects a session that exceeds its capability
      or resource limits with -32009. metadata.source "harness" marks a long-lived harness session;
      any other source is one-shot and ends after its tool call.
    tags:
      - name: session
    x-bma-direction: harness-to-executor
    x-bma-kind: request
    x-bma-channel: control
    x-bma-since: bma.executor.v1
    params:
      - name: session_id
        required: true
        schema:
          type: string
      - name: work_id
        required: true
        schema:
          type: string
      - name: agent_id
        required: false
        schema:
          type: string
      - name: environment_id
        required: true
        schema:
          type: string
      - name: deadline_ms
        required: false
        schema:
          type: integer
          minimum: 1
      - name: lease
        required: true
        schema:
          $ref: schemas/common.json#/$defs/Lease
      - name: resources
        required: false
        schema:
          type: array
          items:
            $ref: schemas/session.json#/$defs/SessionMemoryResource
          x-go-type: "[]json.RawMessage"
      - name: mcp_servers
        required: false
        schema:
          type: array
          items:
            $ref: schemas/mcp.json#/$defs/McpServerConfig
      - name: metadata
        required: false
        description: >-
          String key/value pairs. egress (contract 1.9.0, only to an executor that declared
          egress.forwarder): the JSON text of the session's EgressHandoff (schemas/executor.json), for an
          executor that runs the session's tools without running its turns (hands of a session whose brain
          is elsewhere). The harness sends session.assign before the session's tool calls and again on
          reconnect; every session.assign of a session, a repeated one included, replaces the session's
          handoff with the one it carries, and one without egress removes it (the session's connections go
          direct, so the sandbox's own network applies). The harness renews the token by a repeated
          session.assign before expires_at. The handoff ends with the session on this executor
          (session.stop, session.close). Never logged or echoed.
        schema:
          type: object
          additionalProperties:
            type: string
    result:
      name: SessionAssignResult
      schema:
        $ref: schemas/session.json#/$defs/SessionAssignResult
    errors:
      - $ref: "#/components/errors/InvalidParams"
      - $ref: "#/components/errors/Forbidden"
      - $ref: "#/components/errors/NotFound"
      - $ref: "#/components/errors/LeaseExpired"
      - $ref: "#/components/errors/ExecutorBusy"
      - $ref: "#/components/errors/InternalError"
  - name: session.ready
    summary: Report a session ready.
    description: Executor to harness request after session.assign is accepted.
    tags:
      - name: session
    x-bma-direction: executor-to-harness
    x-bma-kind: request
    x-bma-channel: control
    x-bma-since: bma.executor.v1
    params:
      - name: session_id
        required: true
        schema:
          type: string
      - name: work_id
        required: true
        schema:
          type: string
      - name: lease_token
        required: true
        schema:
          type: string
    result:
      name: Ack
      schema:
        $ref: schemas/common.json#/$defs/Ack
    errors:
      - $ref: "#/components/errors/InvalidParams"
      - $ref: "#/components/errors/SessionNotActive"
      - $ref: "#/components/errors/LeaseExpired"
      - $ref: "#/components/errors/InternalError"
  - name: session.event
    summary: Emit a durable session event.
    description: Executor to harness request for durable session events. A tool executor's event is
      idempotent by its JSON-RPC id. An agent executor (capability agent) also sends turn_id,
      event_id and sequence; the harness deduplicates by (session_id, event_id), accepts a sequence at
      or below acked_sequence as a duplicate, and rejects a gap with -32013 conflict
      (data.expected_sequence). An agent event matches schemas/agent.json AgentEvent. The JSON-RPC response is the ACK; the executor keeps every unacked
      event and resends them in sequence order after reconnect, before any new event. Contract 1.7.0
      clarifies two rules that keep a session from stalling. A failure on the harness side that
      resending can fix (storage conflict or outage) is answered with data.retryable true and the
      executor resends the same event; only a rejection of the event itself (invalid params) is
      permanent, and it ends the turn; the executor sends session.error (bma_error_code
      event_rejected) and session.status_idle for the turn in place of the rejected event, renumbers
      from data.expected_sequence only so that this session.error is accepted, and never continues
      the turn.
    tags:
      - name: session
    x-bma-direction: executor-to-harness
    x-bma-kind: request
    x-bma-channel: control
    x-bma-since: bma.executor.v1
    x-bma-idempotent-by: jsonrpc_id
    params:
      - name: session_id
        required: true
        schema:
          type: string
      - name: turn_id
        required: false
        description: Agent sessions; the turn that produced the event.
        schema:
          type: string
      - name: event_id
        required: false
        description: Agent sessions; executor-assigned, unique within the session, stable across resends.
        schema:
          type: string
      - name: sequence
        required: false
        description: Agent sessions; starts at 1 and increases by 1 per durable event within the session.
        schema:
          type: integer
          minimum: 1
      - name: idempotency_key
        required: false
        description: Agent sessions; optional key the executor keeps for this event across process
          restarts (its outbox entry id, for example). A new executor epoch renumbers sequence and
          suffixes event_id, so only this key lets the harness recognize an event it stored just
          before the executor crashed. The harness acknowledges an event whose key the session
          already stored as a duplicate (sequence advanced, nothing added to the session log), in
          any epoch. Without it an event resent in a new epoch is stored again (at-least-once).
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: event
        required: true
        schema:
          $ref: schemas/session.json#/$defs/SessionEvent
          x-go-type: json.RawMessage
    result:
      name: SessionEventResult
      schema:
        $ref: schemas/session.json#/$defs/SessionEventResult
    errors:
      - $ref: "#/components/errors/InvalidParams"
      - $ref: "#/components/errors/SessionNotActive"
      - $ref: "#/components/errors/LeaseExpired"
      - $ref: "#/components/errors/PayloadTooLarge"
      - $ref: "#/components/errors/Conflict"
      - $ref: "#/components/errors/InternalError"
  - name: session.status
    summary: Report session status.
    description: Executor to harness notification. detail carries free-form context such as tool_running
      or mcp_unavailable.
    tags:
      - name: session
    x-bma-direction: executor-to-harness
    x-bma-kind: notification
    x-bma-channel: control
    x-bma-since: bma.executor.v1
    params:
      - name: session_id
        required: true
        schema:
          type: string
      - name: status
        required: true
        schema:
          $ref: schemas/session.json#/$defs/SessionStatus
      - name: detail
        required: false
        schema:
          type: string
  - name: session.stop
    summary: Stop a session.
    description: Harness to executor request. The executor terminates every process and MCP server of
      the session (SIGTERM, then SIGKILL) and then sends session.ended.
    tags:
      - name: session
    x-bma-direction: harness-to-executor
    x-bma-kind: request
    x-bma-channel: control
    x-bma-since: bma.executor.v1
    params:
      - name: session_id
        required: true
        schema:
          type: string
      - name: reason
        required: true
        schema:
          type: string
      - name: deadline_ms
        required: false
        schema:
          type: integer
          minimum: 1
    result:
      name: SessionStopResult
      schema:
        $ref: schemas/session.json#/$defs/SessionStopResult
    errors:
      - $ref: "#/components/errors/InvalidParams"
      - $ref: "#/components/errors/SessionNotActive"
      - $ref: "#/components/errors/Timeout"
      - $ref: "#/components/errors/InternalError"
  - name: session.ended
    summary: Report a session ended.
    description: Executor to harness request, sent after every process of the session is gone. Retried
      until accepted.
    tags:
      - name: session
    x-bma-direction: executor-to-harness
    x-bma-kind: request
    x-bma-channel: control
    x-bma-since: bma.executor.v1
    params:
      - name: session_id
        required: true
        schema:
          type: string
      - name: reason
        required: true
        schema:
          type: string
    result:
      name: Ack
      schema:
        $ref: schemas/common.json#/$defs/Ack
    errors:
      - $ref: "#/components/errors/InvalidParams"
      - $ref: "#/components/errors/SessionNotActive"
      - $ref: "#/components/errors/ExecutorBusy"
      - $ref: "#/components/errors/InternalError"
  - name: tool.call
    summary: Dispatch a tool call.
    description: Harness to executor request. The executor acknowledges the dispatch and reports the
      outcome separately with tool.result. A duplicate tool_call_id is acknowledged without
      re-execution. A tool the executor does not serve is -32012 with data.capability "tool:<name>".
    tags:
      - name: tool
    x-bma-direction: harness-to-executor
    x-bma-kind: request
    x-bma-channel: control
    x-bma-since: bma.executor.v1
    # The tool param selects the input schema, in the shape of the OpenAPI
    # Discriminator Object (propertyName + mapping) applied to the params.
    x-bma-params-discriminator:
      propertyName: tool
      param: input
      mapping:
        bash: schemas/tool.json#/$defs/BashInput
        read: schemas/tool.json#/$defs/ReadInput
        write: schemas/tool.json#/$defs/WriteInput
        edit: schemas/tool.json#/$defs/EditInput
        glob: schemas/tool.json#/$defs/GlobInput
        grep: schemas/tool.json#/$defs/GrepInput
        list_files: schemas/tool.json#/$defs/ListFilesInput
        computer_observe: schemas/tool.json#/$defs/ComputerObserveInput
        computer_action: schemas/tool.json#/$defs/ComputerActionInput
