        required: true
        schema:
          $ref: schemas/process.json#/$defs/ProcessStream
      - name: cursor
        required: true
        schema:
          type: integer
          minimum: 0
      - name: max_bytes
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 32768
          x-go-type: int
      - name: wait_ms
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 300000
    result:
      name: ProcessReadResult
      schema:
        $ref: schemas/process.json#/$defs/ProcessReadResult
    errors:
      - $ref: "#/components/errors/InvalidParams"
      - $ref: "#/components/errors/SessionNotActive"
      - $ref: "#/components/errors/NotFound"
