  - name: process.start
    summary: Start a process.
    description: 'Harness to executor request (v1.1 §3.3). Idempotent by (session_id, process_id): a
      repeat returns the live state. wait_ms waits up to that long for the process to end before
      answering. A spawn failure is an error with data.reason "spawn_failed". io_mode, file_transfer,
      package_install and git_credentials each require the matching process capability bit.'
    tags:
      - name: process
    x-bma-direction: harness-to-executor
    x-bma-kind: request
    x-bma-channel: control
    x-bma-since: bma.executor.v1.1
    x-bma-capability: process.enabled
    x-bma-idempotent-by: session_id+process_id
    params:
      - name: session_id
        required: true
        schema:
          type: string
      - name: process_id
        required: true
        schema:
          type: string
      - name: argv
        required: true
        description: Command and arguments (at most 256 entries, 4 KiB each, 16 KiB total). Must be empty
          when file_transfer or package_install is set.
        schema:
          type: array
          items:
            type: string
          maxItems: 256
      - name: cwd
        required: false
        schema:
          type: string
      - name: env
        required: false
        schema:
          type: object
          additionalProperties:
            type: string
      - name: stdin
        required: false
        schema:
          $ref: schemas/process.json#/$defs/StdinMode
      - name: stderr
        required: false
        description: Empty keeps separate stdout/stderr streams.
        schema:
          $ref: schemas/process.json#/$defs/StderrMode
      - name: wait_ms
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 300000
      - name: timeout_ms
        required: false
        description: Kills the process and ends it as failed with reason "timeout".
        schema:
          type: integer
          minimum: 0
          maximum: 86400000
      - name: metadata
        required: false
        description: >-
          Who started the process. A process an agent tool started (a command, a file transfer, a
          package install) always carries agent_session_id (the public agent session id) and
          tool_call_id; it carries no initiator. A process the platform started on its own carries
          initiator "platform" and no agent_session_id. A process
          with neither is not started by the harness: an executor that resolves a directory, files or
          owner per session refuses it (reason session_rejected) instead of using a default.
          Human console terminals are terminal.attach, not process.start.
        schema:
          type: object
          additionalProperties:
            type: string
      - name: io_mode
        required: false
        description: Requires capability process.pty.
        schema:
          $ref: schemas/process.json#/$defs/IOMode
      - name: file_transfer
        required: false
        description: Requires capability process.file_transfer. Excludes argv entries, io_mode and
          git_credentials.
        schema:
          $ref: schemas/process.json#/$defs/ProcessFileTransfer
      - name: package_install
        required: false
        description: Requires capability process.package_install. Excludes argv entries, io_mode,
          file_transfer and git_credentials.
        schema:
          $ref: schemas/process.json#/$defs/ProcessPackageInstall
      - name: git_credentials
        required: false
        description: Installs a per-process Git credential helper for https://github.com that fetches
          short-lived tokens for this process while it runs. Requires capability
          process.git_credentials.
        schema:
          type: boolean
    result:
      name: ProcessState
      schema:
        $ref: schemas/process.json#/$defs/ProcessState
    errors:
      - $ref: "#/components/errors/InvalidParams"
      - $ref: "#/components/errors/SessionNotActive"
      - $ref: "#/components/errors/ResourceUnavailable"
      - $ref: "#/components/errors/CapabilityUnavailable"
      - $ref: "#/components/errors/Conflict"
      - $ref: "#/components/errors/InternalError"
  - name: process.read
    summary: Read process output from a cursor.
    description: Harness to executor request (v1.1 §3.4). Long-polls up to wait_ms for new bytes.
      gap=true when bytes before earliest_cursor were dropped from the ring buffer. A read that
      reports an ended process of an agent session uploads that session's changed outputs before it
      answers, retrying transient upload failures for at most 10 s, and lists them in
      session_outputs (contract 2.901.0) with whether each upload went through; reading the ended
      process again retries what is still pending.
