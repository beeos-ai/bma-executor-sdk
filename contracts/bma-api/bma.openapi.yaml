        it triggers no action. Official clients ignore event types they do not know. Carries `bma_sequence` like every
        other session event."
      required:
        - type
        - role
        - outcome
      properties:
        type:
          type: string
          enum:
            - session.bma_placement
        id:
          type: string
        processed_at:
          type: string
          format: date-time
        role:
          type: string
          enum:
