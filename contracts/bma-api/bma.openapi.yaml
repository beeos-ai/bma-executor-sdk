        via a `user.custom_tool_result` event.
    BetaManagedAgentsDeletedMemory:
      type: object
      properties:
        id:
          type: string
          description: ID of the deleted memory (a `mem_...` value).
        type:
          type: string
          const: memory_deleted
      required:
        - id
        - type
      description: >-
        The confirmation that [Delete a
        Memory](https://platform.claude.com/docs/en/api/beta/memory_stores/memories/delete) returns.


        Deleting a memory doesn't delete its versions. [List Memory
        Versions](https://platform.claude.com/docs/en/api/beta/memory_stores/memory_versions/list) returns them while
        they are retained: each version is kept for at least the version retention period after it was written, unless
        the store itself is deleted.


        See the [memory guide](https://platform.claude.com/docs/en/managed-agents/memory#audit-memory-changes) to learn
        more about how long versions are kept.
