          description: The URL source of the search result.
        title:
          type: string
          description: The title of the search result.
        type:
          type: string
          const: search_result
      required:
        - citations
        - content
        - source
        - title
        - type
      description: A block containing a web search result.
    BetaManagedAgentsSearchResultCitations:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether citations are enabled for this search result.
      required:
        - enabled
      description: Citation settings for a search result.
    BetaManagedAgentsSearchResultContent:
      type: object
      properties:
        text:
          type: string
          description: The text content.
        type:
          type: string
          const: text
      required:
        - text
        - type
      description: Text content within a search result.
    BetaManagedAgentsSendSessionEvents:
      type: object
      properties:
        data:
          type: array
          items:
            anyOf:
              - $ref: "#/components/schemas/BetaManagedAgentsUserMessageEvent"
              - $ref: "#/components/schemas/BetaManagedAgentsUserInterruptEvent"
              - $ref: "#/components/schemas/BetaManagedAgentsUserToolConfirmationEvent"
              - $ref: "#/components/schemas/BetaManagedAgentsUserCustomToolResultEvent"
              - $ref: "#/components/schemas/BetaManagedAgentsUserDefineOutcomeEvent"
              - $ref: "#/components/schemas/BetaManagedAgentsUserToolResultEvent"
              - $ref: "#/components/schemas/BetaManagedAgentsSystemMessageEvent"
          description: Sent events
      description: Events that were successfully sent to the session.
    BetaManagedAgentsServerToolUsage:
      type: object
      properties:
        web_fetch_requests:
          type: number
          description: Number of server-executed web fetch requests.
        web_search_requests:
          type: number
          description: Number of server-executed web search requests.
      description: Cumulative count of server-executed tool invocations, broken down by tool.
    BetaManagedAgentsServiceAccountExecutionIdentity:
      type: object
      properties:
        type:
          type: string
          const: service_account
      required:
        - type
      description: The Anthropic-managed service account as returned in API responses.
    BetaManagedAgentsServiceAccountExecutionIdentityParams:
      type: object
      properties:
        type:
          type: string
          const: service_account
      required:
        - type
      description: The Anthropic-managed service account — the default execution principal. Carries no identifier.
    BetaManagedAgentsSession:
      type: object
      properties:
        id:
          type: string
        agent:
          $ref: "#/components/schemas/BetaManagedAgentsSessionAgent"
          description: Resolved `agent` definition for a `session`. Snapshot of the `agent` at `session` creation time.
        archived_at:
          type:
            - string
            - "null"
          description: When the session was archived. Null if not archived.
        budget:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsBudgetLimit"
            - type: "null"
          description: The session's enforced spend ceiling, or null when no budget is set.
        created_at:
          type: string
          description: A timestamp in RFC 3339 format
        environment_id:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        outcome_evaluations:
          type: array
          items:
            $ref: "#/components/schemas/BetaManagedAgentsOutcomeEvaluationResource"
          description: Per-outcome evaluation state. One entry per `define_outcome` event sent to the session.
        resources:
          type: array
          items:
            $ref: "#/components/schemas/BetaManagedAgentsSessionResource"
        stats:
          $ref: "#/components/schemas/BetaManagedAgentsSessionStats"
          description: Timing statistics for the session.
        status:
          type: string
          enum:
            - rescheduling
            - running
            - idle
            - terminated
          description: >-
            - `rescheduling` - Transient error occurred, retrying automatically.

            - `running` - Agent is actively executing.

            - `idle` - Agent is waiting for input, including user messages or tool   confirmations. Sessions start in
            idle.

            - `terminated` - Session has ended, either due to an error or completion.
        title:
          type:
            - string
            - "null"
        type:
          type: string
          const: session
        updated_at:
          type: string
          description: A timestamp in RFC 3339 format
        usage:
          $ref: "#/components/schemas/BetaManagedAgentsSessionUsage"
          description: Cumulative token usage for the session.
        vault_ids:
          type: array
          items:
            type: string
          description: Vault IDs attached to the session at creation. Empty when no vaults were supplied.
        deployment_id:
          type:
            - string
            - "null"
          description: Deployment ID when the session was created from a deployment reference. Null otherwise.
      required:
        - id
        - agent
        - archived_at
        - budget
        - created_at
        - environment_id
        - metadata
        - outcome_evaluations
        - resources
        - stats
        - status
        - title
        - type
        - updated_at
        - usage
        - vault_ids
      description: A Managed Agents `session`.
    BetaManagedAgentsSessionAgent:
      type: object
      properties:
        id:
          type: string
        description:
          type:
            - string
            - "null"
        execution_identity:
          $ref: "#/components/schemas/BetaManagedAgentsExecutionIdentity"
          description: 'Execution principal snapshotted from the agent at session creation. Always present; `{"type":
            "service_account"}` when runs carry no customer-named principal.'
        mcp_servers:
          type: array
          items:
            $ref: "#/components/schemas/BetaManagedAgentsMCPServerURLDefinition"
        model:
          $ref: "#/components/schemas/BetaManagedAgentsModelConfig"
          description: Model identifier and configuration.
        multiagent:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsSessionMultiagent"
            - type: "null"
          description: Resolved multiagent orchestration configuration. Null when the agent is single-threaded.
        name:
          type: string
        skills:
          type: array
          items:
            anyOf:
              - $ref: "#/components/schemas/BetaManagedAgentsAnthropicSkill"
              - $ref: "#/components/schemas/BetaManagedAgentsCustomSkill"
        system:
          type:
            - string
            - "null"
        tools:
          type: array
          items:
            anyOf:
              - $ref: "#/components/schemas/BetaManagedAgentsAgentToolset20260401"
              - $ref: "#/components/schemas/BetaManagedAgentsMCPToolset"
              - $ref: "#/components/schemas/BetaManagedAgentsCustomTool"
        type:
          type: string
          const: agent
        version:
          type: number
      required:
        - id
        - description
        - execution_identity
        - mcp_servers
        - model
        - multiagent
        - name
        - skills
        - system
        - tools
        - type
        - version
      description: Resolved `agent` definition for a `session`. Snapshot of the `agent` at `session` creation time.
    BetaManagedAgentsSessionAgentUpdate:
      type: object
      properties:
        mcp_servers:
          type: array
          items:
            $ref: "#/components/schemas/BetaManagedAgentsURLMCPServerParams"
          description: "Replacement MCP server list. Full replacement: the provided array becomes the new value. Send an empty
            array to clear; omit to preserve."
        tools:
          type: array
          items:
            anyOf:
              - $ref: "#/components/schemas/BetaManagedAgentsAgentToolset20260401Params"
              - $ref: "#/components/schemas/BetaManagedAgentsMCPToolsetParams"
              - $ref: "#/components/schemas/BetaManagedAgentsCustomToolParams"
          description: "Replacement tool list. Full replacement: the provided array becomes the new value. Send an empty array to
            clear; omit to preserve."
      description: "Mid-session agent configuration update. Only `tools` and `mcp_servers` are updatable. Full replacement:
        the provided array becomes the new value. To preserve existing entries, GET the session, modify the array, and
        POST it back."
    BetaManagedAgentsSessionBudgetReached:
      type: object
      properties:
        type:
          type: string
          const: budget_reached
      required:
        - type
      description: The agent stopped because the session's tracked list cost reached its budget, or because its usage includes
        a model with no list price (which the budget cannot measure). Raise the budget to continue — or, if raising is
        rejected because a model has no list price, remove the budget.
    BetaManagedAgentsSessionDeletedEvent:
      type: object
      properties:
        id:
