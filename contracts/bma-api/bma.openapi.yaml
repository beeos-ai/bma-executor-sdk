    Machine:
      type: object
      description: A machine (a workspace persistent machine, an org machine or a connected BYO machine with its one-time
        token) or a deprecated agent machine (kind, machine_pool_name, cpu, memory_mb, agent_id); the fields of the
        other families are absent.
      required:
        - id
        - type
      properties:
        type:
          type: string
          const: machine
        id:
          $ref: "#/components/schemas/MachineID"
        org_id:
          $ref: "#/components/schemas/OrganizationID"
        source_kind:
          $ref: "#/components/schemas/MachineSourceKind"
        agent_ids:
          type: array
          description: The agents bound to a persistent machine, sorted (MachineAgentIDs); on a persistent pool machine the only
            agents whose sessions may use it, every agent of the workspace when empty.
          items:
            $ref: "#/components/schemas/AgentProfileID"
        machine_pool_id:
          anyOf:
            - $ref: "#/components/schemas/MachinePoolID"
            - type: "null"
        display_name:
          $ref: "#/components/schemas/ResourceName"
        description:
          type: string
        provider:
          type: string
        lifecycle_state:
          $ref: "#/components/schemas/MachineLifecycleState"
        connection_state:
          $ref: "#/components/schemas/MachineConnectionState"
        connection_state_reason:
          type: string
        power_state:
          $ref: "#/components/schemas/MachinePowerState"
        last_observed_at:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        cwd:
          type: string
        env:
          type: object
          additionalProperties:
            type: string
        secret_env:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SecretID"
        lifecycle_reason_code:
          type: string
        lifecycle_reason_message:
          type: string
        failure_report:
          $ref: "#/components/schemas/MachineFailureReport"
        next_reconcile_after:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        provision_attempts:
          type: integer
          format: int32
        delete_attempts:
          type: integer
          format: int32
        metadata:
          $ref: "#/components/schemas/Metadata"
        deleted_at:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        kind:
          $ref: "#/components/schemas/AgentMachineKind"
        machine_pool_name:
          $ref: "#/components/schemas/ResourceName"
        cpu:
          anyOf:
            - type: integer
              format: int32
              minimum: 1
            - type: "null"
          description: The machine shape BMA reports, or null before the provider resolves it.
        memory_mb:
          anyOf:
            - type: integer
              format: int32
              minimum: 1
            - type: "null"
          description: The machine shape BMA reports, or null before the provider resolves it.
        agent_id:
          type: string
          description: "Agent machines only: the id /v1/agents uses (never the native agt_ id)."
        capabilities:
          oneOf:
            - $ref: "#/components/schemas/EmbeddedMachineCapabilities"
            - type: "null"
          description: Single read and create only; null when the project cannot use the machine. The native MachineCapabilities,
            without the type that GET /v1/machines/{machine_id}/capabilities adds.
        token:
          type: string
          description: "BYO connect only: the one-time machine token."
        token_record:
          $ref: "#/components/schemas/MachineDaemonToken"
        project_grants:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMachineGrant"
      additionalProperties: false
    MachineAgentIDs:
      type: array
      maxItems: 100
      uniqueItems: true
      description: The agents bound to a persistent machine (an agent may be bound to several). On a persistent pool machine
        they are also the only agents whose sessions may use it; empty, every agent of the owning workspace may. Each
        must be an agent of that workspace (404 otherwise). Replaced as a whole; only a persistent pool machine accepts
        a non-empty list.
      items:
        $ref: "#/components/schemas/AgentProfileID"
    MachineBackup:
      type: object
      required:
        - id
        - machine_id
        - state
        - reason
        - paths
        - exclude
        - size_bytes
        - digest
        - error
        - created_at
        - completed_at
      properties:
        id:
          type: string
          description: Machine backup ID (mbk_…).
        machine_id:
          type: string
        state:
          type: string
          enum:
            - uploading
            - ready
            - failed
        reason:
          type: string
          enum:
            - pause
            - periodic
            - manual
        paths:
          type:
            - array
            - "null"
          items:
            type: string
        exclude:
          type:
            - array
            - "null"
          items:
            type: string
        size_bytes:
          type:
            - integer
            - "null"
          description: Set once ready.
        digest:
          type:
            - string
            - "null"
          description: Set once ready.
        error:
          type: string
        created_at:
          type: string
          format: date-time
        completed_at:
          type:
            - string
            - "null"
          format: date-time
    MachineCapabilities:
