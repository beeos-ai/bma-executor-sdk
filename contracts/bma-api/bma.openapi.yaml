            - $ref: "#/components/schemas/BetaManagedAgentsCompactionLimitReachedError"
            - $ref: "#/components/schemas/BetaManagedAgentsRepositoryAuthenticationError"
            - $ref: "#/components/schemas/BetaManagedAgentsRepositoryForbiddenError"
