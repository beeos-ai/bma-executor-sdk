    direction: response
    field: bma_revision
    description: The BMA revision number of the skill, or of the skill version on a skill version.
    schema:
      type: integer
      minimum: 1
  - operation: GET /v1/skills, GET /v1/skills/{skill_id}, POST /v1/skills
    direction: response
    field: bma_description
    description: The skill description from SKILL.md.
    schema:
      type: string
  - operation: GET /v1/skills, GET /v1/skills/{skill_id}, POST /v1/skills
    direction: response
    field: bma_owner
    description: The project or organization that owns the skill.
    schema:
      $ref: "#/components/schemas/SkillOwner"
  - operation: POST /v1/skills
    direction: request
    field: bma_owner
    description: Native SkillOwner as JSON in the multipart upload; defaults to the current project.
    schema:
      type: string
  - operation: GET /v1/skills/{skill_id}
    direction: response
    field: bma_skill_md
    description: The SKILL.md text. Single read only.
    schema:
      type: string
  - operation: GET /v1/skills/{skill_id}
    direction: response
    field: bma_files
    description: The files of the latest version. Single read only.
    schema:
      type: array
      items:
        $ref: "#/components/schemas/SkillFile"
  - operation: GET /v1/agents, GET /v1/agents/{agent_id}
    direction: response
    field: bma_session_harness_capabilities
    description: Separately advertises input controls available when a NEW session explicitly overrides the default kernel
      with embedded:dsh. This is not the current profile default or an existing session capability, and never authorizes
      input acceptance or dispatch. A client must freeze the chosen override at creation.
    schema:
      $ref: "#/components/schemas/InputSessionHarnessCapabilities"
  - operation: GET /v1/agents, GET /v1/agents/{agent_id}
    direction: response
    field: bma_input_capabilities
    description: The input controls a session of this agent's own harness accepts (only the hosted embedded:dsh accepts
      any). Served for the current version only, not for retrieve with an earlier version or the versions list.
    schema:
      $ref: "#/components/schemas/InputExecutionCapabilities"
  - operation: GET /v1/sessions/{session_id}, POST /v1/sessions, POST /v1/sessions/{session_id}, POST
      /v1/sessions/{session_id}/archive
    direction: response
    field: bma_input_capabilities
    description: The input controls this session's executor accepts (only the hosted embedded:dsh accepts any). Not on list items.
    schema:
      $ref: "#/components/schemas/InputExecutionCapabilities"
  - operation: GET /v1/files
    direction: response
    field: bma_delivered
    description: "On the session outputs of a list with scope_id: true when the final reply of a turn that ended after the
      output was written names it by its path or file name, false otherwise (docs/architecture/session-deliverables.md).
      Omitted on other files and on lists without scope_id."
    schema:
      type: boolean
  - operation: GET /v1/files, GET /v1/files/{file_id}, POST /v1/files
    direction: response
    field: bma_sha256
    description: Lowercase hex SHA-256 of the file content, when known. Replaces the unprefixed `sha256` (removed 11-12; the
      official FileMetadata has no digest).
    schema:
      type: string
      pattern: ^[0-9a-f]{64}$
  - operation: GET /v1/files, GET /v1/files/{file_id}, POST /v1/files
    direction: response
    field: bma_metadata
    description: The file's labels (set with the X-Bma-File-Metadata upload header, filtered with the `metadata` list
      parameter); `{}` when unlabeled. Replaces the unprefixed `metadata` (removed 11-12).
    schema:
      $ref: "#/components/schemas/BmaFileLabels"
  - operation: GET /v1/sessions/{session_id}/events, GET /v1/sessions/{session_id}/events/stream
    direction: response
    field: bma_files
    description: Property of an `agent.tool_result` event. The session files the call created (the images of the platform
      tool `generate_image`, ADR-0101), so a client shows them with the call. Absent when it created none.
    schema:
      type: array
      items:
        $ref: "#/components/schemas/BmaToolResultFile"
