                metadata:
                  type: object
                  additionalProperties:
                    type: string
                  description: Arbitrary key-value metadata. Maximum 16 pairs, keys up to 64 chars, values up to 512 chars.
                multiagent:
                  anyOf:
                    - $ref: "#/components/schemas/BetaManagedAgentsMultiagentParams"
