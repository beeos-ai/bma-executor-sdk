    BetaManagedAgentsDeltaContent:
      type: object
      properties:
        content:
          $ref: "#/components/schemas/BetaManagedAgentsTextBlock"
          description: A partial element of the content array at index, typed like the element itself — the same shape the
            buffered agent.message carries in content.
        type:
          type: string
          const: content_delta
        index:
          type: number
          description: Which entry in the previewed event's content array this fragment lands in. Insert content as that entry
            when the index is new; append to the existing entry otherwise.
      required:
        - content
        - type
    BetaManagedAgentsDeltaEvent:
      type: object
      properties:
        delta:
          $ref: "#/components/schemas/BetaManagedAgentsDeltaContent"
          description: "One fragment of the previewed event. The delta type is named for the previewed event's field it streams
            into: agent.message events stream content_delta fragments, each a partial element of the content array."
        event_id:
          type: string
          description: The id of the event being previewed. Matches event.id on the corresponding event_start and the buffered
            event that reconciles the preview.
        type:
          type: string
          const: event_delta
      required:
        - delta
        - event_id
        - type
      description: An incremental update to an event that is still being streamed. Deltas are best-effort and may stop early;
        when the buffered event with id == event_id is produced it carries the complete content. A model request that
        ends early (an error or interrupt) produces no buffered event — its terminal span.model_request_end closes the
        preview. Only sent on stream connections that opt in via event_deltas; never appears in event history.
