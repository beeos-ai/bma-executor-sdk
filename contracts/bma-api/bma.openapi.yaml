        - name
        - description
        - model
        - system
        - tools
        - skills
        - mcp_servers
        - metadata
        - execution_identity
        - multiagent
        - version
        - created_at
        - updated_at
        - archived_at
      properties:
        id:
          type: string
        type:
          type: string
          const: agent
        name:
          type: string
        description:
          type:
            - string
            - "null"
        model:
          type: object
        system:
          type:
            - string
            - "null"
        tools:
