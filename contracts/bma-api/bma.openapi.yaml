            model supports at least one of the tools. A supported tool can still be rejected for your organization, for
            example when an admin has turned web search off.
        structured_outputs:
          $ref: "#/components/schemas/CapabilitySupport"
          description: Whether the model supports structured output / JSON mode / strict tool schemas.
        thinking:
          $ref: "#/components/schemas/ThinkingCapability"
          description: Thinking capability and supported type configurations.
      required:
        - batch
        - citations
        - code_execution
        - context_management
        - effort
        - image_input
        - pdf_input
        - server_tools
        - structured_outputs
        - thinking
