      description: "The turn stopped because the context was compacted the maximum number of times in a row without the model
        producing a message or a tool call, not because a request failed. The thread goes idle with `stop_reason:
        retries_exhausted` (a child thread then terminates); the next `user.message` starts a new turn."
    BetaManagedAgentsCredentialHostUnreachableError:
      type: object
      properties:
        credential_id:
          type: string
          description: ID of the affected credential.
        message:
          type: string
          description: Human-readable error description.
        retry_status:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsRetryStatusRetrying"
            - $ref: "#/components/schemas/BetaManagedAgentsRetryStatusExhausted"
            - $ref: "#/components/schemas/BetaManagedAgentsRetryStatusTerminal"
          description: What the client should do next.
        type:
          type: string
          const: credential_host_unreachable_error
        vault_id:
          type: string
          description: ID of the vault containing the affected credential.
      required:
        - credential_id
        - message
        - retry_status
        - type
        - vault_id
      description: An `environment_variable` credential's `auth.networking.allowed_hosts` includes a host the environment's
        network policy does not permit.
