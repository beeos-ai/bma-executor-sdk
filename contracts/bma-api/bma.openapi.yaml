            $ref: "#/components/schemas/BetaManagedAgentsSystemContentBlock"
          description: System content blocks to append. Text-only.
        type:
          type: string
          const: system.message
      required:
        - content
        - type
      description: "Privileged context for the accompanying turn and all subsequent turns, appended to the session's system
        context as a `role: \"system\"` turn rather than replacing the top-level system prompt. At most one per request:
