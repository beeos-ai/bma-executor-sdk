        type:
          type: string
          const: system.message
        processed_at:
          type:
            - string
            - "null"
          description: Timestamp when this system message was processed.
      required:
        - id
        - content
        - type
      description: 'A mid-conversation system message event. Carries system-role content that is appended to the session as a
