              - "null"
        - name: created_at[gte]
          in: query
          required: false
          description: Return only memory stores created at or after this time (inclusive).
          schema:
            type: string
        - name: created_at[lte]
          in: query
          required: false
          description: Return only memory stores created at or before this time (inclusive).
          schema:
            type: string
        - name: include_archived
          in: query
          required: false
          description: When `true`, archived stores are included in the results. Defaults to `false` (archived stores are excluded).
          schema:
            type: boolean
      responses:
        "200":
