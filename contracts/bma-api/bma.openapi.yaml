  - operation: GET /v1/environments, GET /v1/environments/{environment_id}, POST /v1/environments, POST
      /v1/environments/{environment_id}
    direction: response
    field: bma_placement
    description: The placement the environment declares; omitted when it declares none.
    schema:
      oneOf:
        - $ref: "#/components/schemas/BmaEnvironmentPlacement"
        - type: "null"
  - operation: POST /v1/sessions
    direction: request
    field: bma_placement
    description: Chooses the brain and hands machine for this session among the environment's candidates; omitted lets the
      scheduler choose.
    schema:
      oneOf:
        - $ref: "#/components/schemas/BmaSessionPlacementRequest"
        - type: "null"
  - operation: GET /v1/sessions, GET /v1/sessions/{session_id}, POST /v1/sessions, POST /v1/sessions/{session_id}
    direction: response
    field: bma_placement
    description: Where the session's brain and hands are bound and whether each is waiting; omitted for a session created
      without a placement.
    schema:
      oneOf:
        - $ref: "#/components/schemas/BmaSessionPlacement"
        - type: "null"
  - operation: GET /v1/sessions, GET /v1/sessions/{session_id}, POST /v1/sessions, POST /v1/sessions/{session_id}
    direction: response
    field: bma_waiting
    description: Present while the session's turn waits for the desktop of a machine (its status stays running). Sessions on
      one machine run concurrently; a machine's desktop is used by one turn at a time, taken at the turn's first
      computer use call and held until that turn ends. Omitted when the session does not wait.
    schema:
      $ref: "#/components/schemas/BmaSessionWaiting"
  - operation: GET /v1/environments, GET /v1/environments/{environment_id}
    direction: response
    field: bma_machine
    description: Present on an environment projected from a machine (read-only, no writes); absent on a cloud environment.
    schema:
      oneOf:
        - $ref: "#/components/schemas/BmaEnvironmentMachine"
        - type: "null"
  - operation: POST /v1/agents, POST /v1/agents/{agent_id}
    direction: request
    field: bma_auth
    description: Property of an entry of `mcp_servers[]`. The project secret the MCP server authenticates with.
    schema:
      oneOf:
        - $ref: "#/components/schemas/BmaMCPServerAuth"
        - type: "null"
  - operation: GET /v1/agents, GET /v1/agents/{agent_id}, POST /v1/agents, POST /v1/agents/{agent_id}
    direction: response
    field: bma_auth
    description: Property of an entry of `mcp_servers[]`; the secret reference, never the secret.
    schema:
      oneOf:
        - $ref: "#/components/schemas/BmaMCPServerAuth"
        - type: "null"
  - operation: GET /v1/sessions/{session_id}/events, GET /v1/sessions/{session_id}/events/stream, POST
      /v1/sessions/{session_id}/events
    direction: response
    field: bma_sequence
    description: "Durable position of the BMA event an event is projected from. One BMA event can project to several events
      (frames) that share its `bma_sequence`, so it is a cursor between BMA events, not a unique frame id.
      `Last-Event-ID: <n>` and the history cursor resume strictly after sequence n; a caller that must not lose a frame
      of the last sequence it saw resumes from n-1 and drops the frames it already applied by event `id`. Absent on
      events that are not projected from a durable event (for example a stream `error`). On the `user.message` send
      response it is the cursor to subscribe from."
    schema:
      oneOf:
        - type: integer
          minimum: 1
  - operation: POST /v1/sessions/{session_id}/events
    direction: response
    field: bma_resume_cursor
    description: "On a `user.message` send response only: the `Last-Event-ID` to stream from to receive this message's
      `user.message` and everything after it. It is the session's last event sequence before the send (0 for an empty
      session, still sent), because a queued input has no event of its own until it is admitted. For an idempotent
      replay whose input already has its event it is that event's sequence minus 1. Absent when no safe cursor is known;
      the caller then locates the turn on the stream by `bma_input_id`. The official send response has no cursor; send
      first, then subscribe from this cursor."
    schema:
      oneOf:
        - type: integer
          minimum: 0
  - operation: GET /v1/sessions/{session_id}/events, GET /v1/sessions/{session_id}/events/stream, POST
      /v1/sessions/{session_id}/events
    direction: response
    field: bma_input_id
    description: The BMA input a `user.message` was accepted as.
    schema:
      oneOf:
        - type: string
  - operation: POST /v1/sessions/{session_id}/events
    direction: request
    field: bma_delivery_mode
    description: "On a `user.message` (new stack): how it joins a session whose turn is running. `queued` (the default, the
      official behavior): it waits with `processed_at` null and runs as its own turn after the running one. `steering`:
      it joins the running turn, which reads it at its next step boundary (after the results of its current tool calls,
      before its next model request); it starts no turn of its own and is processed when the turn takes it. One that
      cannot join the running turn is re-filed as queued and runs as its own turn after it; its event then shows
      `bma_delivery_mode` `queued` and `bma_delivery_reason`. With no turn running it starts a turn as any message. The
      content of a steering message is at most 40 KiB. Echoed on the event."
    schema:
      type: string
      enum:
        - queued
        - steering
  - operation: GET /v1/sessions/{session_id}/events, GET /v1/sessions/{session_id}/events/stream, POST
      /v1/sessions/{session_id}/events
    direction: response
    field: bma_delivery_mode
    description: How a `user.message` was delivered; absent when it was sent without one (queued). `steering` while it waits
      for or has joined the running turn; `queued` when sent queued, or when a steering message could not join the
      running turn, or any message was sent while a turn waits for the user (requires_action), and runs as a turn of its
      own (then with `bma_delivery_reason`).
    schema:
      type: string
      enum:
        - queued
        - steering
  - operation: GET /v1/sessions/{session_id}/events, GET /v1/sessions/{session_id}/events/stream, POST
      /v1/sessions/{session_id}/events
    direction: response
    field: bma_delivery_reason
    description: "On a `user.message` that runs as a turn of its own other than as sent (`bma_delivery_mode` is then
      `queued`): `harness_no_steering` (sent `steering`; the brain running the turn takes no message mid-turn),
      `turn_ended` (sent `steering`; the turn ended before its next step boundary) or `awaiting_action` (sent while a
      turn of the session waits for the user at `requires_action`, with any delivery mode: it runs after that turn;
      official Managed Agents answers 400 there, set on acceptance). For expired target-only steering, `turn_ended`
      means the target is no longer running and `runtime_rejected` means the runtime refused or cannot steer.
      `interrupted` (with `bma_steering_outcome` `expired`): a `user.interrupt` ended the turn before it took the
      steering message, so the stop covers it and it starts no turn of its own."
    schema:
      type: string
      enum:
        - harness_no_steering
        - turn_ended
        - awaiting_action
        - runtime_rejected
        - interrupted
  - operation: POST /v1/sessions/{session_id}/events
    direction: request
    field: bma_steering_target_input_id
    description: "Optional on `user.message` with `bma_delivery_mode: steering` (new stack). Only deliver to the running
      turn opened by this `bma_input_id`. If that turn is no longer running, ends before taking the input, or cannot
      accept steering, the input expires and does not start its own turn."
    schema:
      type: string
  - operation: GET /v1/sessions/{session_id}/events, GET /v1/sessions/{session_id}/events/stream, POST
      /v1/sessions/{session_id}/events
    direction: response
    field: bma_steering_outcome
    description: "On a target-only steering `user.message`: `pending` while delivery is unresolved, `adopted` after the
      runtime acknowledges delivery to the target turn, or `expired` when it will not be delivered. Expired events keep
      their input identity and carry `bma_delivery_reason` (`turn_ended` or `runtime_rejected`). Any steering
      `user.message` a `user.interrupt` ends its turn before taking also gets `expired`, with `bma_delivery_reason`
      `interrupted`. An idempotent POST replay returns the original acceptance with the same input ID. Read the events
      list for the final result even if the original response or stream frame was pending."
    schema:
      type: string
      enum:
        - pending
        - adopted
        - expired
  - operation: GET /v1/sessions/{session_id}/events, GET /v1/sessions/{session_id}/events/stream
    direction: response
    field: bma_error_code
    description: "BMA's stable reason on a `session.error`, next to the Anthropic error `type`. Scheduling reasons (brain
      and hands apart): `scheduling_timeout` (a turn waited longer than `queue_timeout_seconds`), `brain_unavailable`
      (the machine brain is permanently unavailable, or stayed disconnected longer than `brain_offline_timeout_seconds`;
      later inputs of the session answer 400 with the same code and a new session is needed), `hands_unavailable` (a BYO
      or persistent hands machine is permanently unavailable). The same field is on the 4xx error body of a request:
      `placement_unsatisfiable` (400 `invalid_request_error`: no candidate can satisfy the requirements, or a machine
      chosen for the session is not a candidate) and `remote_brain_not_allowed` (403 `permission_error`). A tool call
      whose hands machine is offline reports the tool result `error_code` `environment_unavailable` instead."
    schema:
      oneOf:
        - type: string
  - operation: POST /v1/sessions, POST /v1/sessions/{session_id}/events
    direction: response
    field: bma_error_code
    description: 'On an error response (`error.bma_error_code`, next to the Anthropic error `type`):
      `placement_unsatisfiable` (400 `invalid_request_error`; the message lists how many candidates each filter removed,
      for example "0/3 machines: 2 missing capability display, 1 remote_brain disabled"), `remote_brain_not_allowed`
      (403 `permission_error`), `brain_unavailable` (400, an input to a session whose machine brain is permanently
      unavailable) and `harness_unavailable` (400). `error.code` carries the same value until its removal on 2026-12-01
      (D-6).'
    schema:
      oneOf:
        - type: string
  - operation: GET /v1/skills, GET /v1/skills/{skill_id}, POST /v1/skills
    direction: response
    field: bma_name
    description: The machine-readable skill name from SKILL.md (`display_name` is the human title).
    schema:
      type: string
  - operation: GET /v1/skills, GET /v1/skills/{skill_id}, POST /v1/skills, GET /v1/skills/{skill_id}/versions, POST
