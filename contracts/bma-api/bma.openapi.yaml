openapi: 3.1.0
info:
  title: BMA API
  version: 1.0.0
  description: "The public REST API of the BMA api host. Operations in the official Anthropic Managed Agents and Admin API
    shapes carry `x-bma-extension: false`; BMA extensions carry `x-bma-extension: true` and follow the Anthropic style
    (ADR 0023 1.3.3): top-level `/v1/<plural_snake>` paths, POST updates and actions, `{data, next_page}` lists, the
    Anthropic error envelope (BMA reasons in `error.bma_error_code`), `Idempotency-Key` on creates and the
    `bma-workspace-id` scope header. Extension fields on official objects are top-level `bma_*` properties."
  x-bma-official-sdk: "@anthropic-ai/sdk 1.6.0"
servers:
  - url: https://api.beeos.ai
    description: Production
  - url: https://api.staging.beeos.ai
    description: Staging
security:
  - apiKey: []
  - bearer: []
tags:
  - name: Vaults
    description: Vaults and credentials in Anthropic's shape (BetaManagedAgentsVault / BetaManagedAgentsCredential). A vault
      is an independent resource; a project can have any number of them. BMA stores each vault and credential as a
      project-owned native secret (a vault is a tagged record, a credential is tagged with its vault id), so metadata
      keys starting with `bma_` are reserved, and a vault leaves 13 and a credential 12 of the native 16 metadata pairs
      to the caller. Credentials never return secret material.
  - name: Terminal sessions
    description: Terminal sessions. `machine_id` is named in the body of the create and as the filter of the list; every
      other operation addresses the session by its id alone (404 for an unknown id or one in another project).
  - name: Desktop sessions
    description: Remote desktop sessions. `machine_id` is named once, in the body of the create; every other operation
      addresses the session by its id alone (the server resolves the machine and project, and answers 404 for an unknown
      id or one in another project).
  - name: Machines
    description: "Machines: persistent machines owned by the workspace, BYO connect and org machines."
  - name: Machine pools
    description: Organization machine pools and their project grants.
  - name: Skills
    description: "Skills in Anthropic's shape (BetaSkill), without versions. Every skill is `source.type` `custom`:
      Anthropic's own skills are not hosted, so listing another source is an empty page. `display_name` is the caller's
      free-form label (1-255 characters, not unique; the SKILL.md `name` until one is set, which stays `bma_name`) and
      `latest_version_id` its latest revision."
  - name: Model providers
    description: An organization's own model upstreams, their models and those models' workspace grants (ADR-0088), for
      organizations on the new stack. Organization owners and admins write; keys are write-only. Calls naming such a
      model go to the tenant's endpoint with the tenant's key and are paid by the tenant.
  - name: Machine backups
    description: Backups of a machine's working directory and the rebuild of a machine from one.
  - name: Session tool grants
    description: The standing tool permissions a session's user granted (ADR-0068).
  - name: MCP OAuth
    description: The OAuth authorization flow that stores an MCP server credential in a vault.
  - name: Me
    description: The calling user's own personal access tokens and organization invites.
  - name: Organization reports
    description: The Admin API usage and cost reports of the organization (owner and admin credentials).
  - name: agents
    description: Official `agents` resource (Anthropic SDK `agents`).
  - name: environments
    description: Official `environments` resource (Anthropic SDK `environments`).
  - name: files
    description: Official `files` resource (Anthropic SDK `files`).
  - name: memory_stores
    description: Official `memory_stores` resource (Anthropic SDK `memory_stores`).
  - name: memory_stores.memories
    description: Official `memory_stores.memories` resource (Anthropic SDK `memory_stores.memories`).
  - name: models
    description: Official `models` resource (Anthropic SDK `models`).
  - name: organization
    description: Official `organization` resource (Anthropic SDK `organization`).
  - name: organization.api_keys
    description: Official `organization.api_keys` resource (Anthropic SDK `organization.api_keys`).
  - name: organization.invites
    description: Official `organization.invites` resource (Anthropic SDK `organization.invites`).
  - name: organization.users
    description: Official `organization.users` resource (Anthropic SDK `organization.users`).
  - name: organization.workspaces
    description: Official `organization.workspaces` resource (Anthropic SDK `organization.workspaces`).
  - name: organization.workspaces.members
    description: Official `organization.workspaces.members` resource (Anthropic SDK `organization.workspaces.members`).
  - name: sessions
    description: Official `sessions` resource (Anthropic SDK `sessions`).
  - name: sessions.events
    description: Official `sessions.events` resource (Anthropic SDK `sessions.events`).
  - name: sessions.resources
    description: Official `sessions.resources` resource (Anthropic SDK `sessions.resources`).
