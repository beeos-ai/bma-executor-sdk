    ModelInfo:
      type: object
      properties:
        id:
          type: string
          description: Unique model identifier.
        capabilities:
          anyOf:
            - $ref: "#/components/schemas/ModelCapabilities"
            - type: "null"
          description: Object mapping capability names to their support details. Keys are always present for all known capabilities.
        created_at:
          type: string
          description: RFC 3339 datetime string representing the time at which the model was released. May be set to an epoch
            value if the release date is unknown.
        deprecated_at:
          type:
            - string
            - "null"
          description: RFC 3339 datetime string representing the time of the model's most recent deprecation. Populated for
            `deprecated` and `retired` models; `null` while the model is `active`.
        display_name:
          type: string
          description: A human-readable name for the model.
        lifecycle:
          type: string
          enum:
            - active
            - deprecated
            - retired
          description: >-
            The model's current lifecycle stage.


            - `active`: The model is available for use, open to new adopters, and not   scheduled for retirement.

            - `deprecated`: The model remains callable for organizations with existing   access, but is headed for
            retirement and closed to new adopters.

            - `retired`: The model is no longer available for use; inference requests naming   it fail. It remains in
            the catalogue as the historical record of its   retirement.
        line:
          anyOf:
            - $ref: "#/components/schemas/ModelLine"
            - type: "null"
          description: The model line this model belongs to, such as `opus` for both Claude Opus 4.5 and Claude Opus 4.6. More
            lines may be added. `null` when the model belongs to no line; do not infer a line from the `id`.
        max_input_tokens:
          type:
            - number
            - "null"
          description: Maximum input context window size in tokens for this model.
        max_tokens:
          type:
            - number
            - "null"
          description: Maximum value for the `max_tokens` parameter when using this model.
        retires_at:
          type:
            - string
            - "null"
          description: "RFC 3339 datetime string representing the model's currently scheduled retirement date. The schedule can be
            revised until retirement occurs; `null` while the model is `active` or while no retirement is scheduled. A
            past date on a `deprecated` model means retirement is overdue, not that it has occurred: `lifecycle` is the
            retirement signal."
        type:
          type: string
          const: model
          description: |-
            Object type.

            For Models, this is always `"model"`.
      required:
        - id
        - capabilities
        - created_at
        - deprecated_at
        - display_name
        - lifecycle
        - line
        - max_input_tokens
        - max_tokens
        - retires_at
        - type
