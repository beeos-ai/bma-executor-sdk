                    - $ref: "#/components/schemas/BetaManagedAgentsAgentWithOverridesParams"
                  description: Agent identifier. Accepts the `agent` ID string, which pins the latest version for the session, or an
                    `agent` object with both id and version specified.
                environment_id:
                  type: string
                  description: ID of the `environment` defining the container configuration for this session.
                budget:
                  $ref: "#/components/schemas/BetaManagedAgentsBudgetLimit"
                  description: Enforced spend ceiling for the session. Omit to create an uncapped session. Every model the session can run
                    — the agent's model and each callable agent's model — must have a public list price, or the request
                    is rejected with reason `model_not_budgetable`.
                initial_events:
                  type: array
                  items:
                    anyOf:
                      - $ref: "#/components/schemas/BetaManagedAgentsUserMessageEventParams"
                      - $ref: "#/components/schemas/BetaManagedAgentsUserDefineOutcomeEventParams"
                  description: Initial events to send to the `session` at creation, processed in order. Supports `user.message` and
                    `user.define_outcome` events. Maximum 50 events.
                metadata:
                  type: object
                  additionalProperties:
                    type: string
                  description: Arbitrary key-value metadata attached to the session. Maximum 16 pairs, keys up to 64 chars, values up to
                    512 chars.
                resources:
                  type: array
                  items:
                    anyOf:
                      - $ref: "#/components/schemas/BetaManagedAgentsGitHubRepositoryResourceParams"
                      - $ref: "#/components/schemas/BetaManagedAgentsFileResourceParams"
                      - $ref: "#/components/schemas/BetaManagedAgentsMemoryStoreResourceParam"
                  description: Resources (e.g. repositories, files) to mount into the session's container.
                title:
                  type:
                    - string
                    - "null"
                  description: Human-readable session title.
                vault_ids:
                  type: array
                  items:
                    type: string
                  description: Vault IDs for stored credentials the agent can use during the session.
              required:
                - agent
                - environment_id
