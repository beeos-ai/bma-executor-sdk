        session_files:
          $ref: "#/components/schemas/MachineSessionFilesCapability"
        desktop:
          $ref: "#/components/schemas/MachineDesktopCapability"
        permissions:
          $ref: "#/components/schemas/MachineInteractionPermissions"
        protocol_versions:
          $ref: "#/components/schemas/MachineProtocolVersions"
        harnesses:
          type: array
          description: Ids of the hosted agents the machine's executor declared at its latest executor.register (for example dsh,
            claude-code), in declaration order, kept while the machine is offline (BMA extension, Experimental,
            ADR-0029). Omitted when it declared none.
          items:
            type: string
      additionalProperties: false
    MachineConnectionState:
      type: string
      enum:
        - online
        - asleep
        - offline
    MachineDaemonToken:
      type: object
      additionalProperties: false
      required:
        - id
        - org_id
        - machine_id
        - name
        - metadata
        - created_at
        - last_used_at
        - revoked_at
        - revoke_reason
      properties:
        id:
          $ref: "#/components/schemas/MachineDaemonTokenID"
        org_id:
          $ref: "#/components/schemas/OrganizationID"
        machine_id:
          $ref: "#/components/schemas/MachineID"
        name:
          $ref: "#/components/schemas/ResourceName"
        metadata:
          $ref: "#/components/schemas/Metadata"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        last_used_at:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        revoked_at:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        revoke_reason:
          type: string
    MachineDaemonTokenID:
      type: string
      pattern: ^mdt_[a-z2-7]{26}$
    MachineDeleted:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
        type:
          const: machine_deleted
    MachineDesktopCapability:
      type: object
      additionalProperties: false
      required:
        - supported
        - webrtc
        - rfb
      properties:
        supported:
          type: boolean
        webrtc:
          type: boolean
        rfb:
          type: boolean
        livekit:
          type: boolean
          description: The registered executor supports canonical LiveKit capture. Missing or false means unavailable.
        control:
          type: boolean
          description: The registered executor admits a human's input under a desktop control lease (acquire_control). Missing or
            false means a desktop session on the machine cannot be taken over.
        native_webrtc:
          type: boolean
          description: The screen is the executor's own (display.native_webrtc, for example a phone), not a shell-hosted desktop.
            Missing or false means it is not.
        reason:
          type: string
          description: "Why desktop access is unavailable when supported is false (machine_desktop_unsupported: the machine's
            executor does not declare a desktop, or a BYO machine has no connected executor that declares one;
            desktop_unavailable: the deployment has no desktop service), or which transport is missing when supported is
            true (turn_unconfigured, hand_watch_unsupported). Creating a desktop session on a machine with
            supported=false answers 409 with error code desktop_unavailable. BYO machines have no desktop unless their
            executor declares one."
    MachineFailureReport:
      description: The machine's most recent daemon-reported failure. A single slot, overwritten by newer reports. Runtime
        crash reports remain as historical diagnostics; recovery may clear other failure stages.
      type: object
      additionalProperties: false
      required:
        - stage
        - output_tail
        - output_truncated
        - reported_at
      properties:
        stage:
          type: string
          enum:
            - startup_script
            - daemon_install
            - daemon_update
            - daemon_runtime
            - daemon_uninstall
            - daemon_uninstalled
        exit_status:
          type: integer
        output_tail:
          type: string
        output_truncated:
          type: boolean
        daemon_version:
          type: string
        target_version:
          type: string
        reported_at:
          $ref: "#/components/schemas/Timestamp"
    MachineID:
      description: Machine ID (mch_...).
      type: string
      pattern: ^mch_[a-z2-7]{26}$
    MachineInteractionPermissions:
      type: object
      additionalProperties: false
      required:
        - terminal
        - desktop_watch
        - desktop_control
      properties:
        terminal:
          type: boolean
        desktop_watch:
          type: boolean
        desktop_control:
          type: boolean
    MachineLifecycleState:
      type: string
      enum:
        - provisioning
        - provision_failed
        - active
        - deleting
        - delete_failed
        - deleted
    MachineMetadata:
      type: object
      description: User-supplied metadata stored on a machine, provided directly or copied from the machine pool that
        provisions it. A restriction of Metadata that leaves room for one reserved pair - BMA sets observed_platform on
        the machine to the platform reported by its daemon, so the key is reserved and at most 15 user pairs are
        accepted.
      maxProperties: 15
      propertyNames:
        minLength: 1
        maxLength: 64
      not:
        required:
          - observed_platform
      additionalProperties:
        type: string
        maxLength: 512
    MachinePool:
