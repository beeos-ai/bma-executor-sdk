        user_id:
          type: string
          description: ID of the User the API key acts as.
      required:
        - type
        - user_id
    APIKeyWorkspaceScope:
      type: object
      properties:
        type:
          type: string
          const: workspace
          description: 'Scope type. Always `"workspace"`: the API key belongs to one Workspace.'
