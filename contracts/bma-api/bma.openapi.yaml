    BetaManagedAgentsThreadLimitWorkflowRunError:
      type: object
      properties:
        message:
          type: string
          description: Short explanation written by the server. It never contains content from the run or its agents.
        type:
          type: string
          const: thread_limit_error
      required:
        - message
        - type
      description: The run exceeded the limit on the number of threads that a run can create.
    BetaManagedAgentsTimeoutWorkflowRunError:
      type: object
      properties:
        message:
          type: string
          description: Short explanation written by the server. It never contains content from the run or its agents.
        type:
          type: string
          const: timeout_error
      required:
        - message
        - type
      description: The run reached its time limit.
    BetaManagedAgentsToolUseLimitReachedError:
      type: object
      properties:
        message:
          type: string
          description: Human-readable error description.
        retry_status:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsRetryStatusRetrying"
            - $ref: "#/components/schemas/BetaManagedAgentsRetryStatusExhausted"
            - $ref: "#/components/schemas/BetaManagedAgentsRetryStatusTerminal"
          description: What the client should do next.
        type:
          type: string
          const: tool_use_limit_reached_error
      required:
        - message
        - retry_status
        - type
      description: "The turn stopped because the agent loop reached its limit on tool-use rounds (one model response that
        calls tools, plus running those tools, is one round), not because a request failed. The thread goes idle with
        `stop_reason: retries_exhausted` (a child thread then terminates); the next `user.message` starts a new turn."
    BetaManagedAgentsUnknownError:
      type: object
      properties:
        message:
          type: string
          description: Human-readable error description.
        retry_status:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsRetryStatusRetrying"
            - $ref: "#/components/schemas/BetaManagedAgentsRetryStatusExhausted"
            - $ref: "#/components/schemas/BetaManagedAgentsRetryStatusTerminal"
          description: What the client should do next.
        type:
          type: string
          const: unknown_error
      required:
        - message
        - retry_status
        - type
      description: An unknown or unexpected error occurred during session execution. A fallback variant; clients that don't
        recognize a new error code can match on `retry_status` and `message` alone.
    BetaManagedAgentsUnknownWorkflowRunError:
      type: object
      properties:
        message:
          type: string
          description: Short explanation written by the server. It never contains content from the run or its agents.
        type:
          type: string
          const: unknown_error
      required:
        - message
        - type
      description: A failure that has no type of its own.
