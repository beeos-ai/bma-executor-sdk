        - $ref: "#/components/schemas/BetaManagedAgentsAgentAutoEvaluatedPermissionAsk"
        - $ref: "#/components/schemas/BetaManagedAgentsAgentAutoEvaluatedPermissionDeny"
      description: "The server's per-invocation judgement under the auto permission policy. Its type always equals the event's
        top-level evaluated_permission. Open union: clients must tolerate unknown variants."
    BetaManagedAgentsAgentAutoEvaluatedPermissionAllow:
      type: object
      properties:
        type:
          type: string
          const: allow
