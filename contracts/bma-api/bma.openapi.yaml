        - name
        - management_kind
        - description
        - provider
        - default_machine_cpu
        - default_machine_memory_mb
        - default_machine_env
        - default_machine_secret_env
        - default_machine_provider_options
        - default_cwd
        - provider_config
        - runtime_protection_enabled
        - max_total_machines
        - max_total_cpu
        - max_total_memory_mb
        - min_machine_cpu
        - min_machine_memory_mb
        - max_machine_cpu
        - max_machine_memory_mb
        - delete_after_idle_minutes
        - pause_after_idle_minutes
        - archive_after_paused_days
        - delete_after_paused_days
        - metadata
        - created_at
        - updated_at
      properties:
        type:
          type: string
          const: machine_pool
        id:
          $ref: "#/components/schemas/MachinePoolID"
        org_id:
          $ref: "#/components/schemas/OrganizationID"
        name:
          $ref: "#/components/schemas/ResourceName"
        management_kind:
          $ref: "#/components/schemas/ManagementKind"
        description:
          type: string
        provider:
          type: string
        default_machine_cpu:
          type:
            - integer
            - "null"
          format: int32
          minimum: 1
          maximum: 2147483647
        default_machine_memory_mb:
          type:
            - integer
            - "null"
          format: int32
          minimum: 1
          maximum: 2147483647
        default_machine_env:
          description: Default environment for pool machines. A machine's environment, including resolved secret_env values, is
            applied to the provider machine at provisioning, so the provider_options startup_script and the daemon run
            with it, and is resolved again for each process at launch.
          type: object
          additionalProperties:
            type: string
        default_machine_secret_env:
          description: Default secret environment for pool machines, mapping env names to generic secret references. References
            are resolved to secret values wherever the machine environment is applied.
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SecretID"
        default_machine_provider_options:
          type: object
          additionalProperties: true
        default_cwd:
          type: string
        provider_auth_secret_id:
          type: string
          description: The organization's vault credential the pool's provider authenticates with, an opaque ID (a migrated one
            keeps its legacy sec_ ID); absent when the pool uses the platform's credential of its provider tier.
          pattern: ^[A-Za-z0-9_-]{1,128}$
        provider_config:
          type: object
          additionalProperties: true
        runtime_protection_enabled:
          description: Whether BMA deletes this pool's machines when the provider remains running after the daemon becomes inactive.
          type: boolean
        max_total_machines:
          description: "Deprecated, not enforced: how many machines a pool has no longer blocks new machines. Organization and
            project quotas over in-use machines (org resource limits max_in_use_pool_machines_per_project and
            max_in_use_pool_machines_per_org) govern capacity."
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
        max_total_cpu:
          description: "Deprecated, not enforced: organization and project in-use machine CPU quotas govern capacity."
          type:
            - integer
            - "null"
          format: int32
          minimum: 0
          maximum: 2147483647
        max_total_memory_mb:
          description: "Deprecated, not enforced: organization and project in-use machine memory quotas govern capacity."
          type:
            - integer
            - "null"
          format: int32
          minimum: 0
          maximum: 2147483647
        min_machine_cpu:
          type:
            - integer
            - "null"
          format: int32
          minimum: 0
          maximum: 2147483647
        min_machine_memory_mb:
          type:
            - integer
            - "null"
          format: int32
          minimum: 0
          maximum: 2147483647
        max_machine_cpu:
          type:
            - integer
            - "null"
          format: int32
          minimum: 1
          maximum: 2147483647
        max_machine_memory_mb:
          type:
            - integer
            - "null"
          format: int32
          minimum: 1
