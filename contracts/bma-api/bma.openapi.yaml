          description: "ID of the customer-managed encryption key (CMEK) configuration to use for this Workspace. Setting this
            field requires CMEK to be enabled for your organization. When set, data stored for this Workspace is
            encrypted with the referenced key. Create key configurations with the External Keys API. On Claude Platform
            on AWS the value for an AWS KMS key is the key's ARN, and your organization's own key must be a
            single-Region key in the same AWS account and Region as the Workspace. On that platform the key is validated
            against this Workspace when it is attached, so a key-policy problem is reported as an error on this request.
            This field is write-once: once a key is attached to a Workspace it cannot be detached or replaced. To rotate
            key material, rotate the underlying key on your cloud KMS; the `external_key_id` stays the same."
