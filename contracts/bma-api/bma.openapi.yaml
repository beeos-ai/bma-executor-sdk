        Beta names you can send in the `anthropic-beta` header.


        See [Beta headers](https://platform.claude.com/docs/en/api/beta-headers) for how to send them and where to find
        the name a feature needs.
    APIKey:
      type: object
      properties:
        id:
          type: string
          description: ID of the API key.
        created_at:
          type: string
          description: RFC 3339 datetime string indicating when the API Key was created.
        created_by:
          anyOf:
            - $ref: "#/components/schemas/APIKeyCreatedBy"
            - type: "null"
          description: The ID and type of the actor that created the API key, or `null` when the creator is not recorded (legacy,
            workload-identity-federated, or system-created keys).
        expires_at:
          type:
            - string
            - "null"
          description: RFC 3339 datetime string indicating when the API Key expires, or `null` if it never expires.
        name:
          type: string
          description: Name of the API key.
        partial_key_hint:
          type:
            - string
            - "null"
          description: Partially redacted hint for the API key.
        principal:
          anyOf:
            - $ref: "#/components/schemas/APIKeyUserActor"
            - $ref: "#/components/schemas/APIKeyServiceAccountActor"
            - type: "null"
          description: The principal the API key acts as (a User or a Service Account), or `null` if the API key is not bound to a
            principal.
        scope:
          anyOf:
            - $ref: "#/components/schemas/APIKeyOrganizationScope"
            - $ref: "#/components/schemas/APIKeyWorkspaceScope"
          description: "Where the API key belongs: its Workspace (`{\"type\": \"workspace\", \"workspace_id\": \"wrkspc_...\"}`,
            with the Workspace's real ID even when it is the organization's default Workspace), or the organization
            (`{\"type\": \"organization\"}`) for a principal-bound API key that has no Workspace."
        status:
          type: string
          enum:
            - active
            - archived
            - expired
            - inactive
          description: Status of the API key.
        type:
          type: string
          const: api_key
          description: |-
            Object type.

            For API Keys, this is always `"api_key"`.
      required:
        - id
        - created_at
        - created_by
        - expires_at
        - name
        - partial_key_hint
        - principal
        - scope
        - status
        - type
    APIKeyCreatedBy:
