    BetaManagedAgentsSessionMultiagent:
      anyOf:
        - $ref: "#/components/schemas/BetaManagedAgentsSessionMultiagentCoordinator"
        - $ref: "#/components/schemas/BetaManagedAgentsSessionMultiagent20261001"
      description: Resolved multiagent orchestration configuration as returned on a `session`.
    BetaManagedAgentsSessionMultiagent20261001:
      type: object
      properties:
        advisor:
          $ref: "#/components/schemas/BetaManagedAgentsMultiagentAdvisor"
          description: Whether the session's primary thread can consult an advisor model.
        subagents:
          $ref: "#/components/schemas/BetaManagedAgentsSessionMultiagentSubagents"
          description: Whether the agent can spawn session threads.
        type:
          type: string
          const: multiagent_20261001
        workflows:
          $ref: "#/components/schemas/BetaManagedAgentsSessionMultiagentWorkflows"
          description: Whether the agent can start workflow runs.
      required:
        - advisor
        - subagents
        - type
        - workflows
      description: Resolved multiagent configuration with three members, as copied to the `session` at creation.
    BetaManagedAgentsSessionMultiagentCoordinator:
      type: object
      properties:
        agents:
          type: array
          items:
            anyOf:
              - $ref: "#/components/schemas/BetaManagedAgentsSessionThreadAgent"
              - $ref: "#/components/schemas/BetaManagedAgentsAdvisor"
          description: Full `agent` definitions the coordinator may spawn as session threads.
        type:
          type: string
          const: coordinator
      required:
        - agents
        - type
      description: Resolved coordinator topology with full agent definitions for each roster member.
    BetaManagedAgentsSessionMultiagentSubagents:
      anyOf:
        - $ref: "#/components/schemas/BetaManagedAgentsSessionMultiagentSubagentsEnabled"
        - $ref: "#/components/schemas/BetaManagedAgentsMultiagentSubagentsDisabled"
      description: Whether the agent can spawn session threads.
    BetaManagedAgentsSessionMultiagentSubagentsEnabled:
      type: object
      properties:
        inline_agents:
          $ref: "#/components/schemas/BetaManagedAgentsMultiagentInlineAgents"
          description: Whether the agent can define inline agents, which are not saved, when it spawns session threads.
        predefined_agents:
          type: array
          items:
            $ref: "#/components/schemas/BetaManagedAgentsSessionThreadAgent"
          description: Full `agent` definitions of the predefined agents, which are saved agents that this agent can spawn as
            session threads.
        type:
          type: string
          const: enabled
      required:
        - inline_agents
        - predefined_agents
        - type
      description: The agent can spawn session threads.
    BetaManagedAgentsSessionMultiagentWorkflows:
      anyOf:
        - $ref: "#/components/schemas/BetaManagedAgentsSessionMultiagentWorkflowsEnabled"
        - $ref: "#/components/schemas/BetaManagedAgentsMultiagentWorkflowsDisabled"
      description: Whether the agent can start workflow runs.
    BetaManagedAgentsSessionMultiagentWorkflowsEnabled:
      type: object
      properties:
        inline_agents:
          $ref: "#/components/schemas/BetaManagedAgentsMultiagentInlineAgents"
          description: Whether a run's plan can define inline agents, which are not saved.
        predefined_agents:
          type: array
          items:
            $ref: "#/components/schemas/BetaManagedAgentsSessionThreadAgent"
          description: Full `agent` definitions of the predefined agents, which are saved agents that a run's plan can use.
        type:
          type: string
          const: enabled
      required:
        - inline_agents
        - predefined_agents
        - type
      description: The agent can start workflow runs.
    BetaManagedAgentsSessionRefusal:
      type: object
      properties:
        type:
          type: string
          const: refusal
      required:
        - type
      description: The turn ended because the model's response was refused, for example by a safety classifier.
    BetaManagedAgentsSessionRefusalStopDetails:
      type: object
      properties:
        category:
          type:
            - string
            - "null"
          enum:
            - cyber
            - bio
            - frontier_llm
            - reasoning_extraction
            - general_harms
            - null
          description: The policy category that triggered the refusal, or `null` when there is no named category. New values can
            be added over time.
        explanation:
          type:
            - string
            - "null"
          description: Human-readable explanation of the refusal, or `null` when none is available. The wording can change, so do
            not parse it.
        type:
          type: string
          const: refusal
      required:
        - category
        - explanation
        - type
      description: Structured information about a refusal.
    BetaManagedAgentsSessionRequiresAction:
      type: object
      properties:
        event_ids:
          type: array
          items:
            type: string
          description: The ids of events the agent is blocked on. Resolving fewer than all re-emits `session.status_idle` with the
            remainder.
        type:
          type: string
          const: requires_action
      required:
        - event_ids
        - type
      description: The agent is idle waiting on one or more blocking user-input events (tool confirmation, custom tool result,
        etc.). Resolving all of them transitions the session back to running.
    BetaManagedAgentsSessionResource:
      anyOf:
        - $ref: "#/components/schemas/BetaManagedAgentsGitHubRepositoryResource"
        - $ref: "#/components/schemas/BetaManagedAgentsFileResource"
        - $ref: "#/components/schemas/BetaManagedAgentsMemoryStoreResource"
    BetaManagedAgentsSessionRetriesExhausted:
      type: object
      properties:
        type:
          type: string
          const: retries_exhausted
      required:
        - type
      description: "The turn ended because repeated errors exhausted the retry budget or an error escalated to `retry_status:
        'exhausted'`."
    BetaManagedAgentsSessionStats:
      type: object
      properties:
        active_seconds:
          type: number
          description: Cumulative time in seconds the session spent in `running` status. Excludes idle time.
        duration_seconds:
          type: number
          description: Elapsed time since session creation in seconds. For terminated sessions, frozen at the final update.
      description: Timing statistics for a session.
    BetaManagedAgentsSessionStatusIdleEvent:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this event.
        processed_at:
          type: string
          description: Timestamp of status change.
        stop_details:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsSessionRefusalStopDetails"
            - type: "null"
          description: Structured information about why the session stopped. `null` when there is nothing more to report.
        stop_reason:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsSessionEndTurn"
            - $ref: "#/components/schemas/BetaManagedAgentsSessionRequiresAction"
            - $ref: "#/components/schemas/BetaManagedAgentsSessionRetriesExhausted"
            - $ref: "#/components/schemas/BetaManagedAgentsSessionBudgetReached"
            - $ref: "#/components/schemas/BetaManagedAgentsSessionRefusal"
        type:
          type: string
          const: session.status_idle
      required:
        - id
        - processed_at
        - stop_details
        - stop_reason
        - type
      description: Indicates the agent has paused and is awaiting user input.
    BetaManagedAgentsSessionStatusRescheduledEvent:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this event.
        processed_at:
          type: string
          description: Timestamp of status change.
        type:
          type: string
          const: session.status_rescheduled
      required:
        - id
        - processed_at
        - type
      description: Indicates the session is recovering from an error state and is rescheduled for execution.
    BetaManagedAgentsSessionStatusRunningEvent:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this event.
        processed_at:
          type: string
          description: Timestamp of status change.
        type:
          type: string
          const: session.status_running
      required:
        - id
        - processed_at
        - type
      description: Indicates the session is actively running and the agent is working.
    BetaManagedAgentsSessionStatusTerminatedEvent:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this event.
        processed_at:
          type: string
          description: Timestamp of status change.
        type:
          type: string
          const: session.status_terminated
      required:
        - id
        - processed_at
        - type
      description: Indicates the session has terminated, either due to an error or completion.
    BetaManagedAgentsSessionThreadAgent:
      type: object
      properties:
        id:
          type: string
        description:
          type:
            - string
            - "null"
        execution_identity:
          $ref: "#/components/schemas/BetaManagedAgentsExecutionIdentity"
          description: 'Execution principal snapshotted from the agent at session creation. Always present; `{"type":
            "service_account"}` when runs carry no customer-named principal.'
        mcp_servers:
          type: array
          items:
            $ref: "#/components/schemas/BetaManagedAgentsMCPServerURLDefinition"
        model:
          $ref: "#/components/schemas/BetaManagedAgentsModelConfig"
          description: Model identifier and configuration.
        name:
          type: string
        skills:
          type: array
          items:
            anyOf:
              - $ref: "#/components/schemas/BetaManagedAgentsAnthropicSkill"
              - $ref: "#/components/schemas/BetaManagedAgentsCustomSkill"
        system:
          type:
            - string
            - "null"
        tools:
          type: array
          items:
            anyOf:
              - $ref: "#/components/schemas/BetaManagedAgentsAgentToolset20260401"
              - $ref: "#/components/schemas/BetaManagedAgentsMCPToolset"
              - $ref: "#/components/schemas/BetaManagedAgentsCustomTool"
        type:
          type: string
          const: agent
        version:
          type: number
      required:
        - id
        - description
        - execution_identity
        - mcp_servers
        - model
        - name
        - skills
        - system
        - tools
        - type
        - version
      description: Resolved `agent` definition for a single `session_thread`. Snapshot of the agent at thread creation time.
        The multiagent roster is not repeated here; read it from `Session.agent`.
    BetaManagedAgentsSessionThreadCreatedEvent:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this event.
        agent_name:
          type: string
          description: Name of the callable agent the thread runs.
        processed_at:
          type: string
          description: Timestamp when the thread was created.
        session_thread_id:
          type: string
          description: Public `sthr_` ID of the newly created thread.
        type:
          type: string
          const: session.thread_created
        workflow_run_id:
          type:
            - string
            - "null"
          description: Identifier of the workflow run that created the thread, or `null` for any other thread.
      required:
        - id
        - agent_name
        - processed_at
        - session_thread_id
        - type
        - workflow_run_id
      description: Emitted when a child thread is created. Written to the parent thread's output stream so clients observing
        the session see child creation.
    BetaManagedAgentsSessionThreadStatusIdleEvent:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this event.
        agent_name:
          type: string
          description: Name of the agent the thread runs.
        processed_at:
          type: string
          description: Timestamp of the status transition.
        session_thread_id:
          type: string
          description: Public sthr_ ID of the thread that went idle.
        stop_details:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsSessionRefusalStopDetails"
            - type: "null"
          description: Structured information about why the thread stopped. `null` when there is nothing more to report.
        stop_reason:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsSessionEndTurn"
            - $ref: "#/components/schemas/BetaManagedAgentsSessionRequiresAction"
            - $ref: "#/components/schemas/BetaManagedAgentsSessionRetriesExhausted"
            - $ref: "#/components/schemas/BetaManagedAgentsSessionBudgetReached"
            - $ref: "#/components/schemas/BetaManagedAgentsSessionRefusal"
        type:
          type: string
          const: session.thread_status_idle
      required:
        - id
        - agent_name
        - processed_at
        - session_thread_id
        - stop_details
        - stop_reason
        - type
      description: A session thread has yielded and is awaiting input. Emitted on the thread's own stream and cross-posted to
        the primary stream for child threads.
    BetaManagedAgentsSessionThreadStatusRescheduledEvent:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this event.
        agent_name:
          type: string
          description: Name of the agent the thread runs.
        processed_at:
          type: string
          description: Timestamp of the status transition.
        session_thread_id:
          type: string
          description: Public sthr_ ID of the thread that is retrying.
        type:
          type: string
          const: session.thread_status_rescheduled
      required:
        - id
        - agent_name
        - processed_at
        - session_thread_id
        - type
      description: A session thread hit a transient error and is retrying automatically. Emitted on the thread's own stream
        and cross-posted to the primary stream for child threads.
    BetaManagedAgentsSessionThreadStatusRunningEvent:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this event.
        agent_name:
          type: string
          description: Name of the agent the thread runs.
        processed_at:
          type: string
          description: Timestamp of the status transition.
        session_thread_id:
          type: string
          description: Public sthr_ ID of the thread that started running.
        type:
          type: string
          const: session.thread_status_running
      required:
        - id
        - agent_name
        - processed_at
        - session_thread_id
        - type
      description: A session thread has begun executing. Emitted on the thread's own stream and cross-posted to the primary
        stream for child threads.
    BetaManagedAgentsSessionThreadStatusTerminatedEvent:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this event.
        agent_name:
          type: string
          description: Name of the agent the thread runs.
        processed_at:
          type: string
          description: Timestamp of the status transition.
        session_thread_id:
          type: string
          description: Public sthr_ ID of the thread that terminated.
        type:
          type: string
          const: session.thread_status_terminated
      required:
        - id
        - agent_name
        - processed_at
        - session_thread_id
        - type
      description: A session thread has terminated and will accept no further input. Emitted on the thread's own stream and
        cross-posted to the primary stream for child threads.
    BetaManagedAgentsSessionUpdatedEvent:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this event.
        processed_at:
          type: string
          description: Timestamp when the update was applied.
        type:
          type: string
          const: session.updated
        agent:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsSessionAgent"
            - type: "null"
          description: The session's effective agent configuration after the update. Present only when the update changed `agent`
            (tools or mcp_servers); when present it is the full materialised snapshot, not a diff.
        budget:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsBudgetLimit"
            - type: "null"
          description: "The session's budget after the update: the new budget when set or replaced, or null when the update
            removed it. Present only when the update changed the budget."
        metadata:
          type: object
          additionalProperties:
            type: string
          description: The session's full metadata bag after the update. Present when the update set non-empty metadata; absent
            when metadata was unchanged or cleared to empty.
        title:
          type:
            - string
            - "null"
          description: The session's new title. Present only when the update changed it.
      required:
        - id
        - processed_at
        - type
      description: Emitted when an UpdateSession request changed at least one field. Carries only the fields that changed;
        absent fields were not part of the update. The new configuration applies from the next turn.
    BetaManagedAgentsSessionUsage:
      type: object
      properties:
        active_seconds:
          type: number
          description: Cumulative time in seconds during which the session had at least one thread in running status. Overlapping
            activity from concurrent threads is counted once, unlike `stats.active_seconds`, which sums each thread's
            own active time. This is the duration the session's runtime cost is priced on.
        cache_creation:
          $ref: "#/components/schemas/BetaManagedAgentsCacheCreationUsage"
          description: Tokens used to create prompt cache entries, broken down by cache TTL.
        cache_read_input_tokens:
          type: number
          description: Total tokens read from prompt cache.
        input_tokens:
          type: number
          description: Total input tokens consumed across all turns.
        list_cost:
          anyOf:
            - $ref: "#/components/schemas/BetaMonetaryAmount"
            - type: "null"
          description: Cumulative list cost of the session across all turns, priced at public list rates. Absent until cost
            tracking is available for the session.
        output_tokens:
          type: number
          description: Total output tokens generated across all turns.
        server_tool_use:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsServerToolUsage"
            - type: "null"
          description: Cumulative server-executed tool usage across all turns. Absent until server-tool tracking is available for
            the session.
      description: Cumulative token usage for a session across all turns.
    BetaManagedAgentsSessionUsageEvent:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this event.
        processed_at:
          type: string
          description: Timestamp when the snapshot was taken.
        type:
          type: string
          const: session.usage
        usage:
          $ref: "#/components/schemas/BetaManagedAgentsSessionUsageSnapshot"
          description: The session's cumulative usage at the snapshot time.
        budget:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsBudgetLimit"
            - type: "null"
          description: The session's configured budget at the snapshot time, or null when the session has no budget.
      required:
        - id
        - processed_at
        - type
        - usage
      description: Periodic snapshot of the session's cumulative usage and tracked list cost.
    BetaManagedAgentsSessionUsageSnapshot:
      type: object
      properties:
        active_seconds:
          type: number
          description: Cumulative time in seconds during which the session had at least one thread in running status. Overlapping
            activity from concurrent threads is counted once. This is the duration the session's runtime cost is priced
            on.
        cache_creation:
          $ref: "#/components/schemas/BetaManagedAgentsCacheCreationUsage"
          description: Tokens used to create prompt cache entries, broken down by cache TTL.
        cache_read_input_tokens:
          type: number
          description: Total tokens read from prompt cache.
        input_tokens:
          type: number
          description: Total input tokens consumed across all turns.
        list_cost:
          $ref: "#/components/schemas/BetaMonetaryAmount"
          description: Cumulative list cost of the session across all turns, priced at public list rates.
        output_tokens:
          type: number
          description: Total output tokens generated across all turns.
        server_tool_use:
          $ref: "#/components/schemas/BetaManagedAgentsServerToolUsage"
          description: Cumulative server-executed tool usage across all turns.
      description: Point-in-time snapshot of a session's cumulative usage.
    BetaManagedAgentsSkillParams:
      anyOf:
        - $ref: "#/components/schemas/BetaManagedAgentsAnthropicSkillParams"
        - $ref: "#/components/schemas/BetaManagedAgentsCustomSkillParams"
      description: Skill to load in the session container.
    BetaManagedAgentsSpanModelRequestEndEvent:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this event.
        is_error:
          type:
            - boolean
            - "null"
          description: Whether the model request resulted in an error.
        model_request_start_id:
          type: string
          description: The id of the corresponding `span.model_request_start` event.
        model_usage:
          $ref: "#/components/schemas/BetaManagedAgentsSpanModelUsage"
          description: Token usage for this model request.
        processed_at:
          type: string
          description: Timestamp when the model request completed.
        type:
          type: string
          const: span.model_request_end
      required:
        - id
        - is_error
        - model_request_start_id
        - model_usage
        - processed_at
        - type
      description: Emitted when a model request completes.
    BetaManagedAgentsSpanModelRequestStartEvent:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this event.
        processed_at:
          type: string
          description: Timestamp when the model request started.
        type:
          type: string
          const: span.model_request_start
      required:
        - id
        - processed_at
        - type
      description: Emitted when a model request is initiated by the agent.
    BetaManagedAgentsSpanModelUsage:
      type: object
      properties:
        cache_creation_input_tokens:
          type: number
          description: Tokens used to create prompt cache in this request.
        cache_read_input_tokens:
          type: number
          description: Tokens read from prompt cache in this request.
        input_tokens:
          type: number
          description: Input tokens consumed by this request.
        output_tokens:
          type: number
          description: Output tokens generated by this request.
        speed:
          type:
            - string
            - "null"
          enum:
            - standard
            - fast
            - null
          description: Inference speed tier this request actually ran at. Mirrors `usage.speed` on /v1/messages. Only present when
            the fast-mode beta is active.
      required:
        - cache_creation_input_tokens
        - cache_read_input_tokens
        - input_tokens
        - output_tokens
      description: Token usage for a single model request.
    BetaManagedAgentsSpanOutcomeEvaluationEndEvent:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this event.
        explanation:
          type: string
          description: Human-readable explanation of the verdict. For `needs_revision`, describes which criteria failed and why.
        iteration:
          type: number
          description: 0-indexed revision cycle, matching the corresponding `span.outcome_evaluation_start`.
        outcome_evaluation_start_id:
          type: string
          description: The id of the corresponding `span.outcome_evaluation_start` event.
        outcome_id:
          type: string
          description: The `outc_` ID of the outcome being evaluated.
        processed_at:
          type: string
          description: Timestamp when outcome evaluation ended.
        result:
          type: string
          description: "Evaluation verdict. 'satisfied': criteria met, session goes idle. 'needs_revision': criteria not met,
            another revision cycle follows. 'max_iterations_reached': evaluation budget exhausted with criteria still
            unmet — one final acknowledgment turn follows before the session goes idle, but no further evaluation runs.
            'failed': grader determined the rubric does not apply to the deliverables. 'interrupted': user sent an
            interrupt while evaluation was in progress."
        type:
          type: string
          const: span.outcome_evaluation_end
        usage:
          $ref: "#/components/schemas/BetaManagedAgentsSpanModelUsage"
          description: Aggregate token usage for this evaluation cycle. Sums across all grader model requests within the cycle.
      required:
        - id
        - explanation
        - iteration
        - outcome_evaluation_start_id
        - outcome_id
        - processed_at
        - result
        - type
        - usage
      description: Emitted when an outcome evaluation cycle completes. Carries the verdict and aggregate token usage. A
        verdict of `needs_revision` means another evaluation cycle follows; `satisfied`, `max_iterations_reached`,
        `failed`, or `interrupted` are terminal — no further evaluation cycles follow.
    BetaManagedAgentsSpanOutcomeEvaluationOngoingEvent:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this event.
        iteration:
          type: number
          description: 0-indexed revision cycle, matching the corresponding `span.outcome_evaluation_start`.
        outcome_id:
          type: string
          description: The `outc_` ID of the outcome being evaluated.
        processed_at:
          type: string
          description: Timestamp when this heartbeat was emitted.
        type:
          type: string
          const: span.outcome_evaluation_ongoing
      required:
        - id
        - iteration
        - outcome_id
        - processed_at
        - type
      description: Periodic heartbeat emitted while an outcome evaluation cycle is in progress. Distinguishes 'evaluation is
        actively running' from 'evaluation is stuck' between the corresponding `span.outcome_evaluation_start` and
        `span.outcome_evaluation_end` events.
    BetaManagedAgentsSpanOutcomeEvaluationStartEvent:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this event.
        iteration:
          type: number
          description: 0-indexed revision cycle. 0 is the first evaluation; 1 is the re-evaluation after the first revision; etc.
        outcome_id:
          type: string
          description: The `outc_` ID of the outcome being evaluated.
        processed_at:
          type: string
          description: Timestamp when outcome evaluation started.
        type:
          type: string
          const: span.outcome_evaluation_start
      required:
        - id
        - iteration
        - outcome_id
        - processed_at
        - type
      description: Emitted when an outcome evaluation cycle begins.
    BetaManagedAgentsStartEvent:
      type: object
      properties:
        event:
          $ref: "#/components/schemas/BetaManagedAgentsStartEventPreview"
          description: "The previewed event's type and id. The event type determines which delta types the preview's event_delta
            events carry: agent.message events stream content_delta fragments; agent.thinking previews are start-only —
            no deltas follow, and the buffered agent.thinking with the same id concludes them."
        type:
          type: string
          const: event_start
      required:
        - event
        - type
      description: Opens a preview of a buffered event. Carries the previewed event's type and id only. Followed by zero or
        more event_delta events with the same event id, normally concluded by the buffered event carrying that id. If
        the producing model request ends without that event (an error or interrupt mid-stream), its terminal
        span.model_request_end closes the preview. Only sent on stream connections that opt in via event_deltas; never
        appears in event history.
    BetaManagedAgentsStartEventPreview:
      anyOf:
        - $ref: "#/components/schemas/BetaManagedAgentsAgentMessagePreview"
        - $ref: "#/components/schemas/BetaManagedAgentsAgentThinkingPreview"
    BetaManagedAgentsStreamSessionEvents:
      anyOf:
