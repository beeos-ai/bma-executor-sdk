    BetaManagedAgentsWebFetchToolConfig:
      type: object
      properties:
        enabled:
          type: boolean
        name:
          type: string
          const: web_fetch
        permission_policy:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsAlwaysAllowPolicy"
            - $ref: "#/components/schemas/BetaManagedAgentsAlwaysAskPolicy"
            - $ref: "#/components/schemas/BetaManagedAgentsAutoPolicy"
          description: Permission policy for tool execution.
        type:
          type: string
          const: web_fetch
        url_sources:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsWebFetchURLSources"
            - type: "null"
          description: Which sources contribute URLs the tool may fetch, always in the object form. Null when not set, which
            allows every source.
        allowed_domains:
          type: array
          items:
            type: string
        blocked_domains:
          type: array
          items:
            type: string
        max_content_tokens:
          type:
            - number
            - "null"
      required:
        - enabled
        - name
        - permission_policy
        - type
        - url_sources
      description: Configuration for the web_fetch tool.
    BetaManagedAgentsWebFetchToolConfigParams:
      type: object
      properties:
        name:
          type: string
          const: web_fetch
          description: Must be "web_fetch".
        allowed_domains:
          type: array
          items:
            type: string
          description: Only fetch URLs whose host is one of these domains or a subdomain of one. Each entry is a plain hostname
            like "docs.example.com" (no scheme, port, or path). At most 64 entries; an empty list is rejected (omit the
            field instead). Cannot be combined with blocked_domains.
        blocked_domains:
          type: array
          items:
            type: string
          description: Never fetch URLs whose host is one of these domains or a subdomain of one. Each entry is a plain hostname
            like "ads.example.com" (no scheme, port, or path). At most 64 entries; an empty list is rejected (omit the
            field instead). Cannot be combined with allowed_domains.
        enabled:
          type:
            - boolean
            - "null"
          description: Whether this tool is enabled and available to Claude. Overrides the default_config setting.
        max_content_tokens:
          type:
            - number
            - "null"
          description: Maximum number of tokens of fetched text content to include in context per call. Does not apply to binary
            content such as PDFs.
        permission_policy:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsAlwaysAllowPolicy"
            - $ref: "#/components/schemas/BetaManagedAgentsAlwaysAskPolicy"
            - $ref: "#/components/schemas/BetaManagedAgentsAutoPolicy"
            - type: "null"
          description: Permission policy for this tool. Controls whether tool calls are auto-approved or require confirmation.
        type:
          type: string
          const: web_fetch
        url_sources:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsWebFetchURLSourcesParams"
            - type: "null"
          description: Which sources contribute URLs the tool may fetch. Omit to allow every source.
      required:
        - name
      description: Configuration override for the web_fetch tool.
    BetaManagedAgentsWebFetchURLSourceAll:
      type: object
      properties:
        type:
          type: string
          const: all
      required:
        - type
      description: Every URL from this source may be fetched. This is the default.
    BetaManagedAgentsWebFetchURLSourceExcept:
      type: object
      properties:
        tools:
          type: array
          items:
            $ref: "#/components/schemas/BetaManagedAgentsWebFetchURLSourceToolReference"
          description: The tools whose results do not contribute. Between 1 and 128 entries, each with a different name. An empty
            list is rejected; use "all" to leave out no tool's results.
        type:
          type: string
          const: except
      required:
        - tools
        - type
      description: Every tool's results contribute URLs that may be fetched, except the named tools' results.
    BetaManagedAgentsWebFetchURLSourceNone:
      type: object
      properties:
        type:
          type: string
          const: none
      required:
        - type
      description: This source contributes no URLs that may be fetched.
    BetaManagedAgentsWebFetchURLSourceOnly:
      type: object
      properties:
        tools:
          type: array
          items:
            $ref: "#/components/schemas/BetaManagedAgentsWebFetchURLSourceToolReference"
          description: The tools whose results contribute. Between 1 and 128 entries, each with a different name. An empty list is
            rejected; use "none" to allow no tool's results.
        type:
          type: string
          const: only
      required:
        - tools
        - type
      description: Only the named tools' results contribute URLs that may be fetched.
    BetaManagedAgentsWebFetchURLSources:
      type: object
      properties:
        client_tool_results:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsWebFetchURLSourceToolFilter"
            - type: "null"
          description: Which custom tools' results contribute URLs that may be fetched. Null when not set, which allows every
            custom tool's results.
        server_tool_results:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsWebFetchURLSourceToolFilter"
            - type: "null"
          description: Which of the web_search and web_fetch tools' results contribute URLs that may be fetched. Null when not
            set, which allows both.
        user_input:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsWebFetchURLSourceUserInput"
            - type: "null"
          description: Whether URLs in the text of user messages may be fetched. Null when not set, which allows them.
      required:
        - client_tool_results
        - server_tool_results
        - user_input
      description: Which sources contribute URLs the web_fetch tool may fetch. A key that is null was not set and allows every
        URL from that source.
    BetaManagedAgentsWebFetchURLSourceShorthand:
      type: string
      enum:
        - all
        - none
      description: 'String form of a url_sources value that has no field other than its type: "all" means {"type": "all"} and
        "none" means {"type": "none"}.'
    BetaManagedAgentsWebFetchURLSourcesParams:
      type: object
      properties:
        client_tool_results:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsWebFetchURLSourceToolFilterParams"
            - type: "null"
          description: "Which custom tools' results contribute URLs that may be fetched: \"all\" (the default), \"none\", or an
            only or except list. Each name in a list must be a custom tool in the same tools array."
        server_tool_results:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsWebFetchURLSourceToolFilterParams"
            - type: "null"
          description: "Which of the web_search and web_fetch tools' results contribute URLs that may be fetched: \"all\" (the
            default), \"none\", or an only or except list. Each name in a list must be \"web_search\" or \"web_fetch\"."
        user_input:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsWebFetchURLSourceUserInputParams"
            - type: "null"
          description: 'Whether URLs in the text of user messages may be fetched: "all" (the default) or "none".'
      description: Which sources contribute URLs the web_fetch tool may fetch. When web_fetch is limited to URLs the
        conversation has already shown the model (in a user message, a custom tool's result, or an earlier web_search or
        web_fetch result), each key narrows one of those sources and defaults to "all". Setting all three keys to "none"
        is rejected.
    BetaManagedAgentsWebFetchURLSourceToolFilter:
      anyOf:
        - $ref: "#/components/schemas/BetaManagedAgentsWebFetchURLSourceAll"
        - $ref: "#/components/schemas/BetaManagedAgentsWebFetchURLSourceNone"
        - $ref: "#/components/schemas/BetaManagedAgentsWebFetchURLSourceOnly"
        - $ref: "#/components/schemas/BetaManagedAgentsWebFetchURLSourceExcept"
      description: Which tools' results contribute URLs that may be fetched.
    BetaManagedAgentsWebFetchURLSourceToolFilterParams:
      anyOf:
        - $ref: "#/components/schemas/BetaManagedAgentsWebFetchURLSourceShorthand"
        - $ref: "#/components/schemas/BetaManagedAgentsWebFetchURLSourceToolFilter"
      description: Which tools' results contribute URLs that may be fetched. Accepts the string "all" or "none", or an object
        whose type is "all", "none", "only" or "except". Responses use the object form.
    BetaManagedAgentsWebFetchURLSourceToolReference:
      type: object
      properties:
        name:
          type: string
          description: Name of the tool. Compared exactly, so upper and lower case letters are different.
        type:
          type: string
          const: tool_reference
          description: Must be "tool_reference".
      required:
        - name
        - type
      description: Names one tool in an only or except list.
    BetaManagedAgentsWebFetchURLSourceUserInput:
      anyOf:
        - $ref: "#/components/schemas/BetaManagedAgentsWebFetchURLSourceAll"
        - $ref: "#/components/schemas/BetaManagedAgentsWebFetchURLSourceNone"
      description: Whether URLs in the text of user messages may be fetched.
    BetaManagedAgentsWebFetchURLSourceUserInputParams:
      anyOf:
        - $ref: "#/components/schemas/BetaManagedAgentsWebFetchURLSourceShorthand"
        - $ref: "#/components/schemas/BetaManagedAgentsWebFetchURLSourceUserInput"
      description: 'Whether URLs in the text of user messages may be fetched. Accepts the string "all" or "none", or the
        object {"type": "all"} or {"type": "none"}. Responses use the object form.'
    BetaManagedAgentsWebSearchToolConfig:
      type: object
      properties:
        enabled:
          type: boolean
        name:
          type: string
          const: web_search
        permission_policy:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsAlwaysAllowPolicy"
            - $ref: "#/components/schemas/BetaManagedAgentsAlwaysAskPolicy"
            - $ref: "#/components/schemas/BetaManagedAgentsAutoPolicy"
          description: Permission policy for tool execution.
        type:
          type: string
          const: web_search
        allowed_domains:
          type: array
          items:
            type: string
        blocked_domains:
          type: array
          items:
            type: string
        user_location:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsUserLocation"
            - type: "null"
          description: Approximate user location for search result localization.
      required:
        - enabled
        - name
        - permission_policy
        - type
      description: Configuration for the web_search tool.
    BetaManagedAgentsWebSearchToolConfigParams:
      type: object
      properties:
        name:
          type: string
          const: web_search
          description: Must be "web_search".
        allowed_domains:
          type: array
          items:
            type: string
          description: Only return search results whose host is one of these domains or a subdomain of one. Each entry is a plain
            hostname like "docs.example.com" (no scheme or port; an optional path suffix is accepted). At most 64
            entries; an empty list is rejected (omit the field instead). Cannot be combined with blocked_domains.
        blocked_domains:
          type: array
          items:
            type: string
          description: Never return search results whose host is one of these domains or a subdomain of one. Each entry is a plain
            hostname like "ads.example.com" (no scheme or port; an optional path suffix is accepted). At most 64
            entries; an empty list is rejected (omit the field instead). Cannot be combined with allowed_domains.
        enabled:
          type:
            - boolean
            - "null"
          description: Whether this tool is enabled and available to Claude. Overrides the default_config setting.
        permission_policy:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsAlwaysAllowPolicy"
            - $ref: "#/components/schemas/BetaManagedAgentsAlwaysAskPolicy"
            - $ref: "#/components/schemas/BetaManagedAgentsAutoPolicy"
            - type: "null"
          description: Permission policy for this tool. Controls whether tool calls are auto-approved or require confirmation.
        type:
          type: string
          const: web_search
        user_location:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsUserLocation"
            - type: "null"
          description: Approximate user location for search result localization.
      required:
        - name
      description: Configuration override for the web_search tool.
    BetaManagedAgentsWorkflowRunCreatedEvent:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this event.
        description:
          type:
            - string
            - "null"
          description: Description that the agent gave the run, passed on as written, or `null` if it gave none.
        name:
          type: string
          description: Name that the agent gave the run, passed on as written, or a name that the server assigned.
        phases:
          type: array
          items:
            $ref: "#/components/schemas/BetaManagedAgentsWorkflowRunPhase"
          description: The phases that the run's plan declares, in the plan's order. Can be empty.
        processed_at:
          type: string
          description: Timestamp when this event was processed.
        type:
          type: string
          const: workflow_run.created
        workflow_run_id:
          type: string
          description: Identifier of the run. The same value is on all of the run's `workflow_run.*` events.
      required:
        - id
        - description
        - name
        - phases
        - processed_at
        - type
        - workflow_run_id
      description: A workflow run was created. A workflow run is background work that the session's agent starts. Emitted once
        per run, before the run's other `workflow_run.*` events.
    BetaManagedAgentsWorkflowRunError:
      anyOf:
        - $ref: "#/components/schemas/BetaManagedAgentsTimeoutWorkflowRunError"
        - $ref: "#/components/schemas/BetaManagedAgentsProgramWorkflowRunError"
        - $ref: "#/components/schemas/BetaManagedAgentsUnknownWorkflowRunError"
        - $ref: "#/components/schemas/BetaManagedAgentsThreadLimitWorkflowRunError"
        - $ref: "#/components/schemas/BetaManagedAgentsMaxWorkflowRunsWorkflowRunError"
      description: Why a workflow run did not finish, or was not created. More types may be added. On
        `workflow_run.status_ended`, for a `type` you do not recognize, rely on the event's `result.type`.
    BetaManagedAgentsWorkflowRunErrorEvent:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this event.
        error:
          $ref: "#/components/schemas/BetaManagedAgentsWorkflowRunError"
          description: Why the run did not finish, or was not created.
        processed_at:
          type: string
          description: Timestamp when this event was processed.
        type:
          type: string
          const: workflow_run.error
        workflow_run_id:
          type:
            - string
            - "null"
          description: Identifier of the run that met the error, or `null` when the error kept a run from being created.
      required:
        - id
        - error
        - processed_at
        - type
        - workflow_run_id
      description: A workflow run met an error, or an error kept a run from being created. A run that ends with a
        `result.type` of `error` emits this event before its `workflow_run.status_ended`, with the same `error`.
    BetaManagedAgentsWorkflowRunPhase:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the phase.
        description:
          type:
            - string
            - "null"
          description: Description that the agent gave the phase, passed on as written, or `null` if it gave none.
        name:
          type: string
          description: Name that the agent gave the phase, passed on as written.
      required:
        - id
        - description
        - name
      description: A phase that a workflow run's plan declares.
    BetaManagedAgentsWorkflowRunPhaseEndedEvent:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this event.
        phase_started_id:
          type: string
          description: Identifier of the `workflow_run.phase_started` event that opened the phase.
        processed_at:
          type: string
          description: Timestamp when this event was processed.
        type:
          type: string
          const: workflow_run.phase_ended
        workflow_run_id:
          type: string
          description: Identifier of the run. The same value is on all of the run's `workflow_run.*` events.
        workflow_run_phase_id:
          type: string
          description: Identifier of the phase, as in `phases` on the run's `workflow_run.created` event.
      required:
        - id
        - phase_started_id
        - processed_at
        - type
        - workflow_run_id
        - workflow_run_phase_id
      description: A workflow run's plan left a phase, or the run's end closed it. Emitted once for every
        `workflow_run.phase_started` event, before the run's `workflow_run.status_ended` event. The event does not say
        whether the plan finished the phase's work, or why it left.
    BetaManagedAgentsWorkflowRunPhaseStartedEvent:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this event.
        processed_at:
          type: string
          description: Timestamp when this event was processed.
        type:
          type: string
          const: workflow_run.phase_started
        workflow_run_id:
          type: string
          description: Identifier of the run. The same value is on all of the run's `workflow_run.*` events.
        workflow_run_phase_id:
          type: string
          description: Identifier of the phase, as in `phases` on the run's `workflow_run.created` event.
      required:
        - id
        - processed_at
        - type
        - workflow_run_id
        - workflow_run_phase_id
      description: A workflow run's plan entered a phase.
    BetaManagedAgentsWorkflowRunResult:
      anyOf:
        - $ref: "#/components/schemas/BetaManagedAgentsWorkflowRunResultCompleted"
        - $ref: "#/components/schemas/BetaManagedAgentsWorkflowRunResultError"
        - $ref: "#/components/schemas/BetaManagedAgentsWorkflowRunResultStopped"
      description: How a workflow run ended.
    BetaManagedAgentsWorkflowRunResultCompleted:
      type: object
      properties:
        type:
          type: string
          const: completed
      required:
        - type
      description: The run's plan, a program that the agent wrote, finished. This does not say whether the work succeeded.
    BetaManagedAgentsWorkflowRunResultError:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/BetaManagedAgentsWorkflowRunError"
          description: Why the run did not finish.
        type:
          type: string
          const: error
      required:
        - error
        - type
      description: The run failed or reached its time limit.
    BetaManagedAgentsWorkflowRunResultStopped:
      type: object
      properties:
        type:
          type: string
          const: stopped
      required:
        - type
      description: The agent stopped the run.
    BetaManagedAgentsWorkflowRunStatusEndedEvent:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this event.
        processed_at:
          type: string
          description: Timestamp when this event was processed.
        result:
          $ref: "#/components/schemas/BetaManagedAgentsWorkflowRunResult"
          description: How the run ended.
        type:
          type: string
          const: workflow_run.status_ended
        workflow_run_id:
          type: string
          description: Identifier of the run. The same value is on all of the run's `workflow_run.*` events.
      required:
        - id
        - processed_at
        - result
        - type
        - workflow_run_id
      description: A workflow run ended. Emitted once per run, as the last of the run's `workflow_run.*` events.
    BetaManagedAgentsWorkflowRunStatusIdleEvent:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this event.
        processed_at:
          type: string
          description: Timestamp when this event was processed.
        type:
          type: string
          const: workflow_run.status_idle
        workflow_run_id:
          type: string
          description: Identifier of the run. The same value is on all of the run's `workflow_run.*` events.
      required:
        - id
        - processed_at
        - type
        - workflow_run_id
      description: A workflow run is idle. Emitted each time the run goes idle, whatever the cause. If the run ends while
        idle, no `workflow_run.status_running` comes between this event and its `workflow_run.status_ended`.
    BetaManagedAgentsWorkflowRunStatusRunningEvent:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this event.
        processed_at:
          type: string
          description: Timestamp when this event was processed.
        type:
          type: string
          const: workflow_run.status_running
        workflow_run_id:
          type: string
          description: Identifier of the run. The same value is on all of the run's `workflow_run.*` events.
      required:
        - id
        - processed_at
        - type
        - workflow_run_id
      description: A workflow run is running. Emitted when the run starts to execute, and each time it resumes after being
        idle. A run that starts idle emits `workflow_run.status_idle` first.
    BetaManagedAgentsWriteToolConfig:
      type: object
      properties:
        enabled:
          type: boolean
        name:
          type: string
          const: write
        permission_policy:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsAlwaysAllowPolicy"
            - $ref: "#/components/schemas/BetaManagedAgentsAlwaysAskPolicy"
            - $ref: "#/components/schemas/BetaManagedAgentsAutoPolicy"
          description: Permission policy for tool execution.
        type:
          type: string
          const: write
      required:
        - enabled
        - name
        - permission_policy
        - type
      description: Configuration for the write tool.
    BetaManagedAgentsWriteToolConfigParams:
      type: object
      properties:
        name:
          type: string
          const: write
          description: Must be "write".
        enabled:
          type:
            - boolean
            - "null"
          description: Whether this tool is enabled and available to Claude. Overrides the default_config setting.
        permission_policy:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsAlwaysAllowPolicy"
            - $ref: "#/components/schemas/BetaManagedAgentsAlwaysAskPolicy"
            - $ref: "#/components/schemas/BetaManagedAgentsAutoPolicy"
            - type: "null"
          description: Permission policy for this tool. Controls whether tool calls are auto-approved or require confirmation.
        type:
          type: string
          const: write
      required:
        - name
      description: Configuration override for the write tool.
    BetaMonetaryAmount:
      type: object
      properties:
        amount:
          type: string
          description: 'Amount in minor units of the currency, as an integer decimal string with no leading zeros: "2500" is
            $25.00 and "50" is fifty cents. A string rather than a number so no float rounding is ever applied.'
        currency:
          $ref: "#/components/schemas/BetaCurrency"
          description: Uppercase ISO-4217 currency code. `USD` is the only currency currently supported; the accepted set is
            closed and grows only when a new currency is priced.
      required:
        - amount
        - currency
      description: A monetary amount in a specific currency.
    BetaPackages:
      type: object
      properties:
        apt:
          type: array
          items:
            type: string
          description: Ubuntu/Debian packages to install
        cargo:
          type: array
          items:
            type: string
          description: Rust packages to install
        gem:
          type: array
          items:
            type: string
          description: Ruby packages to install
        go:
          type: array
          items:
            type: string
          description: Go packages to install
        npm:
          type: array
          items:
            type: string
          description: Node.js packages to install
        pip:
          type: array
          items:
            type: string
          description: Python packages to install
        type:
          type: string
          const: packages
          description: Package configuration type
      required:
        - apt
        - cargo
        - gem
        - go
        - npm
        - pip
      description: Packages (and their versions) available in this environment.
    BetaPackagesParams:
      type: object
      properties:
        apt:
          anyOf:
            - type: array
              items:
                type: string
            - type: "null"
          description: Ubuntu/Debian packages to install
        cargo:
          anyOf:
            - type: array
              items:
                type: string
            - type: "null"
          description: Rust packages to install
        gem:
          anyOf:
            - type: array
              items:
                type: string
            - type: "null"
          description: Ruby packages to install
        go:
          anyOf:
            - type: array
              items:
                type: string
            - type: "null"
          description: Go packages to install
        npm:
          anyOf:
            - type: array
              items:
                type: string
            - type: "null"
          description: Node.js packages to install
        pip:
          anyOf:
            - type: array
              items:
                type: string
            - type: "null"
          description: Python packages to install
        type:
          type: string
          const: packages
          description: Package configuration type
      description: >-
        Specify packages (and optionally their versions) available in this environment.


        When versioning, use the version semantics relevant for the package manager, e.g. for `pip` use
        `package==1.0.0`. You are responsible for validating the package and version exist. Unversioned installs the
        latest.


        Under `limited` networking, requires `networking.allow_package_managers` to be `true`.
    BetaSelfHostedConfig:
      type: object
      properties:
        type:
          type: string
          const: self_hosted
          description: Environment type
      required:
        - type
      description: Configuration for self-hosted environments.
    BetaSelfHostedConfigParams:
      type: object
      properties:
        type:
          type: string
          const: self_hosted
          description: Environment type
      required:
        - type
      description: Request params for `self_hosted` environment configuration.
    BetaUnrestrictedNetwork:
      type: object
      properties:
        type:
          type: string
          const: unrestricted
          description: Network policy type
      required:
        - type
      description: Unrestricted network access.
    BmaAgentHarness:
      type: object
      description: The brain of an agent (`bma_harness`), written on create and update and read back. `default` (or null) is
        the platform's default brain and reads back as an omitted field.
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - default
            - embedded
            - acp
            - executor
          description: "`default` is the BMA kernel; `embedded` a brain the platform hosts itself (agent `dsh` or `go`); `acp` an
            agent the session's machine runs (agent `claude-code` or `dsh`); `executor` an external full agent declared
            by one explicit machine. Only a brain the platform has brought online and can host is accepted: otherwise
            400 `invalid_request_error` with `bma_error_code` `harness_unavailable`, on agent create/update (embedded)
            and session create (acp, when the environment's executor does not declare the agent)."
        agent:
          type: string
          description: The embedded or ACP agent, or an external executor id declared in the machine agent capability; not allowed
            for kind `default`.
      additionalProperties: false
    BmaAgentRequirements:
      type: object
      description: "What an agent requires of the machine that is its hands (`bma_requirements`): a constraint, not a
        location. Where the brain and hands run is decided by the environment (`bma_placement`) and the scheduler
        matches these requirements against the environment's candidates. Changing it creates a new agent version.
        Omitted or null means no requirement (the current behavior)."
      properties:
        hands:
          $ref: "#/components/schemas/BmaHandsRequirements"
      additionalProperties: false
    BmaEnvironmentBrainPlacement:
      type: object
      description: Where the environment runs the brain.
      properties:
        location:
          type: string
          enum:
            - server
            - colocated
            - machine
          description: "`server` runs the brain on the platform and fits only a `default` or `embedded` brain; `colocated` runs it
            on the machine that is the hands and `machine` on a machine chosen with `machines`; both fit only an `acp`
            brain. Omitted: derived from the environment and the agent's brain (ADR-0002). A brain that does not fit the
            location is 400 `invalid_request_error` with `bma_error_code` `harness_unavailable` when a session is
            created."
        machines:
          $ref: "#/components/schemas/BmaPlacementMachineSelector"
        prefer:
          type: array
          items:
            $ref: "#/components/schemas/BmaPlacementPreference"
      additionalProperties: false
    BmaEnvironmentDesktop:
      type: object
      description: Desktop defaults of an environment (`bma_desktop`).
      properties:
        wallpaper:
          anyOf:
            - $ref: "#/components/schemas/BmaEnvironmentWallpaper"
            - type: "null"
      additionalProperties: false
    BmaEnvironmentHandsPlacement:
      type: object
      description: Where the hands (the machine tools run on) come from.
      properties:
        machines:
          $ref: "#/components/schemas/BmaPlacementMachineSelector"
        prefer:
          type: array
          items:
            $ref: "#/components/schemas/BmaPlacementPreference"
      additionalProperties: false
    BmaEnvironmentHarness:
      type: object
      description: "The brain of an environment (`bma_harness`, ADR-0058): it runs the environment's sessions whose session
        and agent name no brain. Same shape and values as the agent's, without `executor`. A session's brain is resolved
        when it is created: the session's `bma_harness`, else the agent's, else the environment's, else the platform
        default; an omitted, null or `default` value names none (it inherits) and is never stored as a brain."
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - default
            - embedded
            - acp
          description: "`default` (or null) clears it: the platform default applies. `embedded` agent `go` or `dsh`; `acp` agent
            `claude-code` or `dsh`, which the session's machine must declare when a session is created (400
            `harness_unavailable` otherwise, as for an agent). An embedded brain the platform does not host is 400
            `harness_unavailable`."
        agent:
          type: string
          description: The embedded or ACP agent; not allowed for kind `default`.
      additionalProperties: false
    BmaEnvironmentMachine:
      type: object
      description: The machine an environment is projected from (`bma_machine`); read-only.
      required:
        - machine_id
        - source_kind
        - lease
      properties:
        machine_id:
          $ref: "#/components/schemas/MachineID"
        source_kind:
          $ref: "#/components/schemas/MachineSourceKind"
        lease:
          $ref: "#/components/schemas/BmaEnvironmentMachineLease"
        harnesses:
          type: array
          description: Ids of the hosted agents the machine's executor declared (for example `dsh`, `claude-code`), so a client
            can choose a machine for an `acp` brain. Omitted when the executor declared none.
          items:
            type: string
        labels:
          type: array
          description: Labels the executor reported about itself plus the platform's `os:<os>` and `arch:<arch>`.
          items:
            type: string
        remote_brain_allowed:
          type: boolean
          description: Read-back of the owner's switch "allow a remote brain to use this machine" (executor capability
            `remote_brain`); it can only be changed in the executor's local configuration. False when absent.
      additionalProperties: false
    BmaEnvironmentMachineLease:
      type: object
      description: Who runs on a persistent machine; sessions borrowing it run their turns one at a time and the rest wait.
      required:
        - session_id
        - queued_sessions
      properties:
        session_id:
          type:
            - string
            - "null"
        queued_sessions:
          type: integer
          minimum: 0
      additionalProperties: false
    BmaEnvironmentPlacement:
      type: object
      description: Where an environment puts the brain and where the hands come from, and how the scheduler waits
        (`bma_placement` on an environment). A change only affects sessions bound after it; a bound session keeps its
        machines. Not accepted (400 `invalid_request_error`) on an environment projected from a machine (`bma_machine`),
        whose placement is derived. A `self_hosted` environment needs `hands.machines`; a `cloud` environment without it
        uses its own pool. Mixing cloud and BYO hands is 400.
      properties:
        brain:
          $ref: "#/components/schemas/BmaEnvironmentBrainPlacement"
        hands:
          $ref: "#/components/schemas/BmaEnvironmentHandsPlacement"
        scheduling:
          $ref: "#/components/schemas/BmaEnvironmentScheduling"
      additionalProperties: false
    BmaEnvironmentScheduling:
      type: object
      description: How the scheduler waits when a choice is blocked by something that can change (a machine offline, draining,
        full or leased by another session). A choice that no declared machine can ever satisfy is rejected when the
        session is created, never queued.
      properties:
        queue_timeout_seconds:
          type:
            - integer
            - "null"
          minimum: 30
          maximum: 86400
          description: "How long a turn may wait to be bound before it ends with `session.error` `bma_error_code`
            `scheduling_timeout` and the session goes idle (the session stays open and the next input is scheduled
            again). Null or omitted: the platform default (a pool machine 5 minutes, a BYO machine no deadline)."
        brain_offline_timeout_seconds:
          type: integer
          minimum: 30
          maximum: 86400
          default: 600
          description: How long a turn waits for a brain that runs on a machine and lost its connection before the turn ends with
            `session.error` `bma_error_code` `brain_unavailable`. A machine brain is not moved to another host (its
            state lives on that machine); processes already running on the hands machine are not killed by the
            disconnect. Applies to `machine` and `colocated` brains; a platform-hosted brain is moved to another host
            instead. Default 600.
      additionalProperties: false
    BmaEnvironmentWallpaper:
      type: object
      required:
        - file_id
      properties:
        file_id:
          type: string
          description: A file of the Files API shown as the default wallpaper of new desktops.
      additionalProperties: false
    BmaFileLabels:
      description: A file's caller-defined string labels (native File.metadata).
      type: object
      additionalProperties:
        type: string
    BmaHandsRequirements:
      type: object
      description: Requirements of the hands machine. Every listed value must hold (AND across `os` as one set and across all
        `capabilities`); an omitted or empty list adds no requirement.
      properties:
        os:
          type: array
          uniqueItems: true
          description: The hands machine runs one of these operating systems. A machine reports its own value (`darwin` is matched
            as `macos`); a pool machine is matched by its template's specification.
          items:
            type: string
            enum:
              - linux
              - macos
              - windows
        capabilities:
          type: array
          uniqueItems: true
          description: Capabilities the hands machine must declare (`display` is the desktop). Unknown names are 400
            `invalid_request_error`.
          items:
            type: string
            enum:
              - shell
              - files
              - terminal
              - display
              - computer_use
              - session_files
              - chrome
      additionalProperties: false
    BmaMCPServerAuth:
      type: object
      description: The project secret an MCP server authenticates with (`bma_auth`); reads never return the secret.
      required:
        - type
        - secret_id
      properties:
        type:
          type: string
          enum:
            - bearer
            - oauth
            - sigv4
        secret_id:
          $ref: "#/components/schemas/SecretID"
        service:
          type: string
          description: Required with `sigv4`, rejected otherwise.
        region:
          type: string
          description: Required with `sigv4`, rejected otherwise.
      additionalProperties: false
    BmaPlacementMachineSelector:
      type: object
      description: Which machines a role may use; give exactly one of `ids` and `labels`. Machines must exist and be granted
        to the project (404 `not_found_error` otherwise). Labels are what the machine's executor reports about itself
        plus `os:<os>` and `arch:<arch>`; they only narrow a choice among machines the project is already authorized to
        use, and no authorization or security decision depends on them.
      properties:
        ids:
          type: array
          minItems: 1
          uniqueItems: true
          description: Specific machines (or a group of machines); the scheduler picks among them.
          items:
            $ref: "#/components/schemas/MachineID"
        labels:
          type: array
          minItems: 1
          uniqueItems: true
          description: Machines that carry all of these labels (each 1-64 characters of `a-z0-9._-`, or an automatic `os:` /
            `arch:` label).
          items:
            type: string
            maxLength: 69
      additionalProperties: false
    BmaPlacementPreference:
      type: object
      description: A soft preference used when scoring candidates; never excludes a machine.
      required:
        - labels
        - weight
      properties:
        labels:
          type: array
          minItems: 1
          uniqueItems: true
          description: Candidates carrying all of these labels score `weight`; the weights of the matching preferences add up.
          items:
            type: string
        weight:
          type: integer
          minimum: 1
          maximum: 100
      additionalProperties: false
    BmaSessionExecutorConfig:
      type: object
      description: Turn settings of a session whose brain runs in an executor (`bma_executor_config`). Every turn's
        `turn.start` config carries them as they are; the platform checks only type and length, and the executor decides
        whether a directory is allowed or a level exists (a value it refuses fails the turn). No Managed Agents
        equivalent; the closest is the per-query options of the Claude Agent SDK (`cwd`, `effort`).
      properties:
        permission:
          type: string
          enum:
            - ask
            - read_only
            - workspace
            - full_access
          description: Explicit session permission for tools on a BYO executor; ignored for pools or remote hands. Executor
            ceilings and platform tool denials still apply.
        model:
          type: string
          minLength: 1
          maxLength: 200
          description: Model name for a BYO executor using its own model credentials. The executor validates it against its
            declared model catalog. Ignored on managed pool machines and executors declaring harness_model, whose
            platform-issued credentials remain bound to the session model. For a brain on its machine owner's own
            credentials (harness `model_credentials` `owner`, for example Claude Code; ADR-0068) it is the only model
            the brain runs (the agent's model is never sent; omitted runs the owner's default) and, with
            `thinking_level`, must be one the machine's brain offers, else the create or update is 400 `bma_error_code`
            `model_not_available` naming the offered models.
        cwd:
          type: string
          minLength: 1
          maxLength: 4096
          description: Working directory of the brain on its machine (ACP `session/new.cwd`), at most 4096 bytes.
        thinking_level:
          type: string
          minLength: 1
          maxLength: 64
          description: Thinking or reasoning-effort level, one of the levels the executor declares for the model (for example
            `none`, `low`, `medium`, `high`), at most 64 bytes.
        options:
          type: object
          description: Non-secret executor-specific scalar preferences, at most 4096 encoded bytes. Forwarded only as turn
            metadata executor_options; cannot replace platform credentials.
          additionalProperties:
            oneOf:
              - type: string
                maxLength: 4096
              - type: number
              - type: boolean
      additionalProperties: false
    BmaSessionHarness:
      type: object
      description: The session's brain (`bma_harness`). On create it overrides the agent's brain for this session (same values
        as the agent's; `placement` is not accepted); on read it adds where the environment runs the brain.
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - default
            - embedded
            - acp
            - executor
        agent:
          type: string
        placement:
          type: string
          description: Where the environment runs an `acp` brain, derived from the environment and read only; `sandbox` for a
            cloud environment. An `embedded` brain always runs on the server and has none.
      additionalProperties: false
    BmaSessionPlacement:
      type: object
      description: "Read-only placement of a session (`bma_placement` on a session response): what the scheduler bound, read
        from the session's binding, brain and hands apart. Each change of it is also reported as a
        `session.bma_placement` event."
      required:
        - brain
        - hands
        - status
      properties:
        brain:
          $ref: "#/components/schemas/BmaSessionPlacementRole"
        hands:
          $ref: "#/components/schemas/BmaSessionPlacementRole"
        status:
          type: string
          enum:
            - bound
            - queued
            - unbound
            - failed
          description: "The worst of the two roles: `failed`, else `queued` (waiting for something that can change; see the latest
            `session.bma_placement` event), else `unbound` (a machine has not been claimed yet: pool hands are claimed
            at the first machine tool), else `bound`."
      additionalProperties: false
    BmaSessionPlacementMachine:
      type: object
      required:
        - machine_id
      properties:
        machine_id:
          $ref: "#/components/schemas/MachineID"
      additionalProperties: false
    BmaSessionPlacementRequest:
      type: object
      description: "Per-session choice of machines (`bma_placement` on session create). Each machine must be among the
        environment's candidates, else 400 `invalid_request_error` with `bma_error_code` `placement_unsatisfiable`; an
        unknown or ungranted machine is 404 `not_found_error`. Omitted: the scheduler chooses. A BYO hands machine whose
        owner has not allowed a remote brain, with the brain on another machine, is 403 `permission_error` with
        `bma_error_code` `remote_brain_not_allowed` (a platform-hosted brain is not restricted by that switch)."
      properties:
        brain:
          $ref: "#/components/schemas/BmaSessionPlacementMachine"
        hands:
          $ref: "#/components/schemas/BmaSessionPlacementMachine"
      additionalProperties: false
    BmaSessionPlacementRole:
      type: object
      description: Where one role of the session is bound, and the role's own status. The values are those of the role's
        `session.bma_placement` events.
      required:
        - machine_id
        - status
      properties:
        machine_id:
          type:
            - string
            - "null"
          description: The bound machine. Null for a platform-hosted brain (the platform's own service identity is not exposed),
            for a brain that is `queued`, and for pool hands (and a brain colocated with them) that no machine has been
            claimed for yet.
        location:
          type: string
          enum:
            - server
            - colocated
            - machine
          description: "Brain only: where the brain runs."
        source:
          type: string
          enum:
            - machine
            - pool
          description: "Hands only: `machine` is a BYO or persistent machine named by the placement or the session; `pool` is a
            machine claimed from the environment's pool at the first machine tool."
        status:
          type: string
          enum:
            - bound
            - queued
            - unbound
            - failed
          description: "`bound`: bound to `machine_id` (a platform-hosted brain is always bound). `queued` (brain): no candidate
            machine was online; the first to come online gets it. `unbound`: waiting for a machine to be claimed (pool
            hands, and a brain colocated with them). `failed` (brain): the machine is gone for good."
        reason:
          type: string
          description: "Brain only, when not `bound`: `offline` for `queued`, `brain_unavailable` for `failed`."
      additionalProperties: false
    BmaSessionWaiting:
      type: object
      description: "What a session's turn waits for (`bma_waiting` on a session response): `desktop_in_use` is the desktop of
        `machine_id`, held by another session's turn."
      required:
        - reason
        - machine_id
        - holder_session_id
        - started_at
      properties:
        reason:
          type: string
          enum:
            - desktop_in_use
        machine_id:
          type: string
        holder_session_id:
          type:
            - string
            - "null"
          description: The session whose turn holds the desktop; null while it is handed to the next waiter.
        started_at:
          type: string
          format: date-time
          description: When the session started waiting.
      additionalProperties: false
    BmaToolResultFile:
      type: object
      description: A session file a tool call created (`agent.tool_result.bma_files`), for example an image of the platform
        tool `generate_image`. Read it with `GET /v1/files/{file_id}/content`.
      required:
        - file_id
        - filename
        - media_type
        - size_bytes
      properties:
        file_id:
          type: string
        filename:
          type: string
        media_type:
          type: string
        size_bytes:
          type: integer
          minimum: 0
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        model:
          type: string
          description: The model that generated the file (generated files only).
      additionalProperties: false
    CapabilitySupport:
      type: object
      properties:
        supported:
          type: boolean
          description: Whether this capability is supported by the model.
      required:
        - supported
      description: Indicates whether a capability is supported.
    ContextManagementCapability:
      type: object
      properties:
        clear_thinking_20251015:
          anyOf:
            - $ref: "#/components/schemas/CapabilitySupport"
            - type: "null"
          description: Whether the clear_thinking_20251015 strategy is supported.
        clear_tool_uses_20250919:
          anyOf:
            - $ref: "#/components/schemas/CapabilitySupport"
            - type: "null"
          description: Whether the clear_tool_uses_20250919 strategy is supported.
        compact_20260112:
          anyOf:
            - $ref: "#/components/schemas/CapabilitySupport"
            - type: "null"
          description: Whether the compact_20260112 strategy is supported.
        supported:
          type: boolean
          description: Whether this capability is supported by the model.
      required:
        - clear_thinking_20251015
        - clear_tool_uses_20250919
        - compact_20260112
        - supported
      description: Context management capability details.
    CostReport:
      type: object
      required:
        - data
        - has_more
        - next_page
      properties:
        data:
          type: array
          items:
            type: object
            required:
              - starting_at
              - ending_at
              - results
            properties:
              starting_at:
                type: string
                format: date-time
              ending_at:
                type: string
                format: date-time
              results:
                type: array
                items:
                  type: object
                  properties:
                    amount:
                      type: string
                      description: The cost in cents of USD
                      as a decimal string.: null
                    currency:
                      type: string
                      const: USD
                    cost_type:
                      type:
                        - string
                        - "null"
                    description:
                      type:
                        - string
                        - "null"
                    model:
                      type:
                        - string
                        - "null"
                    workspace_id:
                      type:
                        - string
                        - "null"
                    context_window:
                      type: "null"
                    inference_geo:
                      type: "null"
                    service_tier:
                      type: "null"
                    speed:
                      type: "null"
                    token_type:
                      type: "null"
        has_more:
          type: boolean
        next_page:
          type:
            - string
            - "null"
    CreateDesktopSessionExtensionRequest:
      type: object
      description: The native create body plus the machine the session runs on.
      required:
        - machine_id
      properties:
        agent_id:
          type: string
          description: The id /v1/agents uses.
        read_only:
          type: boolean
          default: false
        lease_seconds:
          type: integer
          format: int32
          minimum: 1
          maximum: 900
        keepalive_seconds:
          type: integer
          format: int32
          minimum: 60
          maximum: 3600
          default: 300
          description: Screen capture keepalive duration, applied from the open on (also while the capture is starting).
        capabilities:
          $ref: "#/components/schemas/DesktopCapabilitiesRequest"
        machine_id:
          type: string
      additionalProperties: false
    CreateDesktopTicketRequest:
      description: Body of a desktop ticket. `purpose` is optional and must be `watch`.
      type: object
      additionalProperties: false
      properties:
        purpose:
          type: string
          enum:
            - watch
        origin:
          type: string
        viewer:
          $ref: "#/components/schemas/DesktopViewerID"
        transport:
          type: string
          enum:
            - rfb
          description: Request the supported RFB fallback of the existing capture; viewer remains required for screen-live
            sessions. Omit for the default transport.
        ttl_seconds:
          type: integer
          minimum: 15
          maximum: 120
    CreatedExecutorToken:
      type: object
      required:
        - type
        - id
        - machine_id
        - name
        - created_at
        - revoked_at
        - token
      properties:
        type:
          type: string
          const: executor_token
        id:
          $ref: "#/components/schemas/MachineDaemonTokenID"
        machine_id:
          $ref: "#/components/schemas/MachineID"
        name:
          $ref: "#/components/schemas/ResourceName"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        revoked_at:
          type:
            - string
            - "null"
          format: date-time
        token:
          type: string
          minLength: 1
          description: The credential, shown only in this response.
      additionalProperties: false
    CreateExecutorTokenRequest:
      type: object
      properties:
        name:
          $ref: "#/components/schemas/ResourceName"
          description: Token name; `daemon` when omitted.
      additionalProperties: false
    CreateMachineExtensionRequest:
      type: object
      description: Workspace persistent machine (persistent true, machine_pool_id, template, display_name), BYO connect
        (source byo, display_name, ...) or org machine (display_name, ...); the native request of that family. agent_id
        is deprecated.
      properties:
        agent_id:
          type: string
          description: Deprecated. The id /v1/agents uses; with persistent true and template, creates a persistent machine of that
            agent.
        persistent:
          type: boolean
          description: true creates a persistent machine owned by the workspace from machine_pool_id (no agent). Must be true when
            agent_id is set.
        agent_ids:
          $ref: "#/components/schemas/MachineAgentIDs"
        template:
          type: string
        machine_pool_id:
          type: string
        display_name:
          type: string
        source:
          enum:
            - byo
          description: byo connects a bring-your-own machine.
        description:
          type: string
        cwd:
          type: string
        env:
          type: object
          additionalProperties:
            type: string
        secret_env:
          type: object
          additionalProperties:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        project_ids:
          type: array
          items:
            type: string
        token_name:
          type: string
      additionalProperties: false
    CreateMachinePoolRequest:
      description: Pool definition. name, provider, default_machine_provider_options, and max_total_machines are always
        required; provider_auth_secret_id is required unless provider_config names a provider tier the platform runs
        with its own credential (then omitting it uses the platform's); which default machine size and CPU and memory
        limits are required depends on the provider; Blaxel pools reject CPU fields.
      allOf:
        - $ref: "#/components/schemas/CreateMachinePoolRequestBase"
        - oneOf:
            - type: object
              required:
                - provider
                - default_machine_cpu
                - default_machine_memory_mb
                - max_total_cpu
                - max_total_memory_mb
                - max_machine_cpu
                - max_machine_memory_mb
              properties:
                provider:
                  type: string
                  enum:
                    - arker
                    - freestyle
                    - modal
                    - oci
                    - tenki
                    - unikraft
                default_machine_cpu:
                  type: integer
                  format: int32
                default_machine_memory_mb:
                  type: integer
                  format: int32
                max_total_cpu:
                  type: integer
                  format: int32
                max_total_memory_mb:
                  type: integer
                  format: int32
                max_machine_cpu:
                  type: integer
                  format: int32
                max_machine_memory_mb:
                  type: integer
                  format: int32
            - type: object
              required:
                - provider
                - max_total_cpu
                - max_total_memory_mb
                - max_machine_cpu
                - max_machine_memory_mb
              properties:
                provider:
                  type: string
                  enum:
                    - boxd
                    - createos
                    - daytona
                    - e2b
                    - superserve
                max_total_cpu:
                  type: integer
                  format: int32
                max_total_memory_mb:
                  type: integer
                  format: int32
                max_machine_cpu:
                  type: integer
                  format: int32
                max_machine_memory_mb:
                  type: integer
                  format: int32
            - type: object
              required:
                - provider
                - default_machine_memory_mb
                - max_total_memory_mb
                - max_machine_memory_mb
              properties:
                provider:
                  type: string
                  enum:
                    - blaxel
                default_machine_memory_mb:
                  type: integer
                  format: int32
                max_total_memory_mb:
                  type: integer
                  format: int32
                max_machine_memory_mb:
                  type: integer
                  format: int32
              not:
                anyOf:
                  - required:
                      - default_machine_cpu
                  - required:
                      - max_total_cpu
                  - required:
                      - min_machine_cpu
                  - required:
                      - max_machine_cpu
    CreateMachinePoolRequestBase:
      type: object
      additionalProperties: false
      required:
        - name
        - provider
        - default_machine_provider_options
        - max_total_machines
      properties:
        name:
          $ref: "#/components/schemas/ResourceName"
        description:
          type: string
        provider:
          type: string
          minLength: 1
        default_machine_cpu:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        default_machine_memory_mb:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        default_machine_env:
          description: Default environment for pool machines. A machine's environment, including resolved secret_env values, is
            applied to the provider machine at provisioning, so the provider_options startup_script and the daemon run
            with it, and is resolved again for each process at launch.
          type: object
          additionalProperties:
            type: string
        default_machine_secret_env:
          description: Default secret environment for pool machines, mapping env names to generic secret references. References
            are resolved to secret values wherever the machine environment is applied.
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SecretID"
        default_machine_provider_options:
          type: object
          additionalProperties: true
        default_cwd:
          type: string
        provider_config:
          type: object
          additionalProperties: true
        provider_auth_secret_id:
          $ref: "#/components/schemas/SecretID"
        runtime_protection_enabled:
          description: Whether BMA should delete a pool machine when its provider remains running after its daemon becomes
            inactive. Defaults to false when omitted.
          type: boolean
          default: false
        max_total_machines:
          description: "Deprecated, not enforced: how many machines a pool has no longer blocks new machines. Organization and
            project quotas over in-use machines (org resource limits max_in_use_pool_machines_per_project and
            max_in_use_pool_machines_per_org) govern capacity."
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
        max_total_cpu:
          description: "Deprecated, not enforced: organization and project in-use machine CPU quotas govern capacity."
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
        max_total_memory_mb:
          description: "Deprecated, not enforced: organization and project in-use machine memory quotas govern capacity."
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
        min_machine_cpu:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
        min_machine_memory_mb:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
        max_machine_cpu:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        max_machine_memory_mb:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        delete_after_idle_minutes:
          description: Idle minutes before deleting a machine from this pool. Omit to leave the pool default unset; a grant or
            agent source may still override it.
          type: integer
          format: int32
          minimum: 5
          maximum: 2147483647
        pause_after_idle_minutes:
          description: Idle minutes before pausing a machine from this pool. A paused machine keeps its disk and resumes on the
            next command, terminal, desktop, or explicit resume. Exclusive with delete_after_idle_minutes; a grant or
            agent source delete policy still wins.
          type: integer
          format: int32
          minimum: 5
          maximum: 2147483647
        archive_after_paused_days:
          description: Days a machine stays paused before it is archived. An archived machine is restored on the next access.
            Requires pause_after_idle_minutes.
          type: integer
          format: int32
          minimum: 1
          maximum: 3650
        delete_after_paused_days:
          description: Days a machine stays paused before it is deleted, counted from when it paused; a resume ends the paused
            period and the next pause starts a new one. A session that receives input after its machine was deleted gets
            a fresh machine. Machines kept for a person (idle deletion disabled with 0 on their binding or grant) are
            never deleted by it. Requires pause_after_idle_minutes; cannot be combined with archive_after_paused_days.
          type: integer
          format: int32
          minimum: 1
          maximum: 3650
        metadata:
          $ref: "#/components/schemas/MachineMetadata"
        project_id:
          description: "Creates the pool for this project: the pool is owned by and granted to it, and only to it, in the same
            write. The caller needs project.manage on the project instead of org.manage, and the pool's secret
            references (provider_auth_secret_id, default_machine_secret_env) must be ones a pool granted to the project
            already uses. Without it the pool is an organization pool granted to no project, which needs org.manage."
          allOf:
            - $ref: "#/components/schemas/ProjectID"
