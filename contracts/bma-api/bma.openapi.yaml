                  description: Human-readable name for the agent.
                description:
                  type:
                    - string
                    - "null"
                  description: Description of what the agent does.
                execution_identity:
                  anyOf:
                    - $ref: "#/components/schemas/BetaManagedAgentsExecutionIdentityParams"
