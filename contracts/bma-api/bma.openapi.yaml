  /v1/memory_stores:
    post:
      operationId: memory_stores.create
      tags:
        - memory_stores
      summary: Create a Memory Store
      x-bma-extension: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: >-
                    The name of the memory store, 1 to 255 characters long, without control characters. Names don't have
                    to be unique in a workspace.


                    In a session, the store's directory under `/mnt/memory/` is based on this name. The name is
                    lowercased and every run of characters other than ASCII letters and digits becomes one hyphen. The
                    session's memory store resource gives the exact path in `mount_path`.


                    See the [memory
                    guide](https://platform.claude.com/docs/en/managed-agents/memory#how-the-agent-accesses-memory) to
                    learn more about how agents access memory stores.
                description:
                  type: string
                  description: Free-text description of what the store contains, up to 1,024 characters. Included in the agent's system
                    prompt when the store is attached, so word it to be useful to the agent.
                metadata:
                  type: object
                  additionalProperties:
                    type: string
                  description: >-
                    Key-value pairs for your own use, such as the end user that the store belongs to. The agent doesn't
                    see them.


                    A store has at most 16 pairs. Keys are 1 to 64 characters long and values at most 512 characters.
              required:
                - name
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BetaManagedAgentsMemoryStore"
        4XX:
          $ref: "#/components/responses/Error"
        5XX:
          $ref: "#/components/responses/Error"
