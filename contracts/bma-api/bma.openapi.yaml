            type: number
        - name: created_at[gt]
          in: query
          required: false
          description: Return sessions created after this time (exclusive).
          schema:
            type: string
        - name: created_at[gte]
          in: query
          required: false
          description: Return sessions created at or after this time (inclusive).
          schema:
            type: string
        - name: created_at[lt]
          in: query
          required: false
          description: Return sessions created before this time (exclusive).
          schema:
            type: string
        - name: created_at[lte]
