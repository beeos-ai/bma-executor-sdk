          in: query
          required: false
          schema:
            type:
              - string
              - "null"
        - name: depth
          in: query
          required: false
          description: |-
            How far below `path_prefix` to list. Defaults to `0`, which lists every memory below the prefix.

            Pass `1` to list only the direct children. Deeper memories are then grouped into `memory_prefix` items.
          schema:
            type: number
        - name: path_prefix
          in: query
          required: false
          description: >-
            Return only memories whose path starts with this prefix, such as `/notes/`. This value appears in request
            URLs. Do not include secrets or personally identifiable information.


            Omit it to list the whole store. The prefix must end with `/` and matches whole segments, so `/notes/`
            matches `/notes/todo.md` but not `/notes-archive/todo.md`.
          schema:
            type: string
        - name: view
          in: query
          required: false
          description: |-
            Whether each memory in the response includes `content`. Defaults to `basic`, which sets it to `null`.

            With `full`, a page holds at most 20 items.
