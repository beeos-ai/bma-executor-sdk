            - hands
        outcome:
          type: string
          enum:
            - bound
            - queued
            - rebound
            - released
            - failed
          description: "`bound`: a machine was chosen. `queued`: no candidate is available now (`reason` says why). `rebound`:
            pool hands were lost and replaced from the same pool (the user directory and session files are restored from
            the session's home backup; processes and memory state are not). `released`: the binding ended. `failed`: no
            binding is possible any more (see the matching `session.error`)."
        machine_id:
          type:
            - string
            - "null"
          description: The machine concerned; null for a platform-hosted brain.
        reason:
          type:
            - string
            - "null"
          description: Why the outcome happened, for example `offline`, `draining`, `full`, `lease_busy` for `queued`. An open
            set; receivers must accept values they do not know.
        filtered:
          type: object
          description: How many candidates each filter removed, keyed by reason (for example `missing_capability_display`).
          additionalProperties:
            type: integer
            minimum: 0
        queued_for_ms:
          type:
            - integer
            - "null"
          minimum: 0
          description: "For `bound` after a wait: how long the turn waited."
      additionalProperties: false
