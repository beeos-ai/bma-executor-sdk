    BetaManagedAgentsMemory:
      type: object
      properties:
        id:
          type: string
          description: |-
            The unique ID of the memory (`mem_...`). It stays the same when the memory's path changes.

            To retrieve, update, or delete the memory, pass this ID.
        content_sha256:
          type: string
          description: Lowercase hex SHA-256 digest of the UTF-8 `content` bytes (64 characters). The server applies no
            normalization, so clients can compute the same hash locally for staleness checks and as the value for a
            `content_sha256` precondition on update. Always populated, regardless of `view`.
        content_size_bytes:
          type: number
          description: The size of the memory's `content` in UTF-8 bytes. It is set regardless of `view`.
        created_at:
          type: string
          description: When this memory was created, in RFC 3339 format.
        memory_store_id:
          type: string
          description: ID of the memory store this memory belongs to (a `memstore_...` value).
        memory_version_id:
          type: string
          description: >-
            The ID of the memory version that holds the memory's current content (`memver_...`).


            Memory versions don't have a flag that marks the latest one. Compare their IDs with this field instead.


            See the [memory guide](https://platform.claude.com/docs/en/managed-agents/memory#audit-memory-changes) to
            learn more about memory versions.
        path:
          type: string
          description: Hierarchical path of the memory within the store, e.g. `/projects/foo/notes.md`. Always starts with `/`.
            Paths are case-sensitive and unique within a store. Maximum 1,024 bytes.
        type:
          type: string
          const: memory
        updated_at:
          type: string
          description: >-
            When the memory was last changed, in RFC 3339.


            To find out who made the change, look at `created_by` on the memory version that `memory_version_id`
            references.
        content:
          type:
            - string
            - "null"
          description: |-
            The memory's UTF-8 text content, or `null` when the response uses `view=basic`.

            The maximum size is 100 kB (102,400 bytes).
      required:
        - id
        - content_sha256
        - content_size_bytes
        - created_at
        - memory_store_id
        - memory_version_id
        - path
        - type
        - updated_at
      description: >-
        A text document at a path inside a memory store.


        `content` is `null` when the response uses `view=basic`. `content_size_bytes` and `content_sha256` are always
        set, so you can detect changes without fetching the content. To retrieve, update, or delete a memory, pass its
        ID, which stays the same when its path changes.


        See the [memory guide](https://platform.claude.com/docs/en/managed-agents/memory#view-and-edit-memories) to
        learn more about working with memories.
    BetaManagedAgentsMemoryListItem:
      anyOf:
        - $ref: "#/components/schemas/BetaManagedAgentsMemory"
        - $ref: "#/components/schemas/BetaManagedAgentsMemoryPrefix"
      description: "One item in a [List Memories](https://platform.claude.com/docs/en/api/beta/memory_stores/memories/list)
        response: a `memory`, or a `memory_prefix` marker when `depth` is `1`."
    BetaManagedAgentsMemoryPrefix:
      type: object
      properties:
        path:
          type: string
          description: The rolled-up path prefix, including a trailing `/` (e.g. `/projects/foo/`). Pass this value as
            `path_prefix` on a subsequent list call to drill into the directory.
        type:
          type: string
          const: memory_prefix
      required:
        - path
        - type
      description: >-
        A directory marker that [List
        Memories](https://platform.claude.com/docs/en/api/beta/memory_stores/memories/list) returns instead of the
        memories below the requested `depth`.


        It stands for one or more memories whose paths start with `path`. It isn't a stored object and doesn't have an
        ID. Each marker counts toward the page `limit`.
    BetaManagedAgentsMemoryStore:
      type: object
      properties:
        id:
          type: string
          description: The unique ID of the memory store (`memstore_...`). Use it to attach the store to a session.
        archived_at:
          type:
            - string
            - "null"
          description: >-
            When the memory store was archived, in RFC 3339, or `null` if it hasn't been.


            Archiving can't be undone. An archived store can't be attached to new sessions. You can't create or update
            its memories or update the store. You can still read and delete its memories, redact their versions, and
            delete the store.


            See the [memory guide](https://platform.claude.com/docs/en/managed-agents/memory#archive-a-store) to learn
            more about archiving.
        created_at:
          type: string
          description: When the memory store was created, in RFC 3339.
        description:
          type: string
          description: Free-text description of what the store contains, up to 1,024 characters. Included in the agent's system
            prompt when the store is attached, so word it to be useful to the agent. Empty string when unset.
        metadata:
          type: object
          additionalProperties:
            type: string
          description: >-
            Key-value pairs for your own use, such as the end user that the store belongs to.


            A store has at most 16 pairs. Keys are 1 to 64 characters long and values at most 512 characters. You can't
            filter lists by metadata.
        name:
          type: string
          description: Human-readable name for the store. 1–255 characters. The store's mount-path slug under `/mnt/memory/` is
            derived from this name.
        type:
          type: string
          const: memory_store
        updated_at:
          type: string
          description: >-
            When the memory store was last changed, in RFC 3339.


            Changing its `name`, `description`, or `metadata` updates it. Archiving the store does too. Changes to the
            store's memories don't.
      required:
        - id
        - archived_at
        - created_at
        - description
        - metadata
        - name
        - type
        - updated_at
      description: "A `memory_store`: a named container for agent memories, scoped to a workspace. Attach a store to a session
        via `resources[]` to mount it as a directory the agent can read and write."
    BetaManagedAgentsMemoryStoreResource:
      type: object
      properties:
        memory_store_id:
          type: string
          description: The memory store ID (memstore_...). Must belong to the caller's organization and workspace.
        type:
          type: string
          const: memory_store
        access:
          type:
            - string
            - "null"
          enum:
            - read_write
            - read_only
            - null
          description: Access mode for the mounted store. Defaults to `read_write`. `read_only` mounts the store as a read-only
            filesystem.
        description:
          type: string
          description: Description of the memory store, snapshotted at attach time. Rendered into the agent's system prompt. Empty
            string when the store has no description.
        instructions:
          type:
            - string
            - "null"
          description: Per-attachment guidance for the agent on how to use this store. Rendered into the memory section of the
            system prompt. Max 4096 chars.
        mount_path:
          type:
            - string
            - "null"
          description: Filesystem path where the store is mounted in the session container, e.g. /mnt/memory/user-preferences.
            Derived from the store's name. Output-only.
        name:
          type:
            - string
            - "null"
          description: Display name of the memory store, snapshotted at attach time. Later edits to the store's name do not
            propagate to this resource.
      required:
        - memory_store_id
        - type
      description: A memory store attached to an agent session.
    BetaManagedAgentsMemoryStoreResourceParam:
      type: object
      properties:
        memory_store_id:
          type: string
          description: The memory store ID (memstore_...). Must belong to the caller's organization and workspace.
        type:
          type: string
          const: memory_store
        access:
          type:
            - string
            - "null"
          enum:
            - read_write
            - read_only
            - null
          description: Access mode for the mounted store. Defaults to read_write. read_only mounts the store as a read-only
            filesystem.
        instructions:
          type:
            - string
            - "null"
          description: Per-attachment guidance for the agent on how to use this store. Rendered into the memory section of the
            system prompt. Max 4096 chars.
      required:
        - memory_store_id
        - type
      description: Parameters for attaching a memory store to an agent session.
    BetaManagedAgentsMemoryView:
      type: string
      enum:
        - basic
        - full
      description: >-
        Whether a `memory` or `memory_version` in the response includes its `content`. Defaults to `full` on retrieve
        operations and to `basic` on list, create, and update operations.


        With `full`, list operations return at most 20 items per page.


        - `basic` - Return the object with `content` set to `null`. The   `content_size_bytes` and `content_sha256`
        fields remain populated, so sync   clients can diff without fetching content.

        - `full` - Return the object with `content` populated. On list endpoints,   `view=full` caps `limit` at 20.
    BetaManagedAgentsModel:
      type: string
      description: |-
        The model that will power your agent.

        See [models](https://docs.anthropic.com/en/docs/models-overview) for additional details and options.
    BetaManagedAgentsModelConfig:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/BetaManagedAgentsModel"
          description: |-
            The model that will power your agent.

            See [models](https://docs.anthropic.com/en/docs/models-overview) for additional details and options.
        effort:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsEffortLow"
            - $ref: "#/components/schemas/BetaManagedAgentsEffortMedium"
            - $ref: "#/components/schemas/BetaManagedAgentsEffortHigh"
            - $ref: "#/components/schemas/BetaManagedAgentsEffortXhigh"
            - $ref: "#/components/schemas/BetaManagedAgentsEffortMax"
          description: How hard Claude works on each inference call. One of `low`, `medium`, `high`, `xhigh`, `max`. Always
            present; resolved to the per-model default at save time when not supplied.
        inference_geo:
          type: string
          description: Geographic region for model inference. When unset, requests fall through to the workspace's
            default_inference_geo.
        speed:
          type: string
          enum:
            - standard
            - fast
          description: Inference speed mode. `fast` provides significantly faster output token generation at premium pricing.
            Defaults to `standard`. Not all models support `fast`; invalid combinations are rejected at create time.
      required:
        - id
      description: Model identifier and configuration.
    BetaManagedAgentsModelConfigParams:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/BetaManagedAgentsModel"
          description: |-
            The model that will power your agent.

            See [models](https://docs.anthropic.com/en/docs/models-overview) for additional details and options.
        effort:
          anyOf:
            - type: string
              const: low
            - type: string
              const: medium
            - type: string
              const: high
            - type: string
              const: xhigh
            - type: string
              const: max
            - $ref: "#/components/schemas/BetaManagedAgentsEffortLow"
            - $ref: "#/components/schemas/BetaManagedAgentsEffortMedium"
            - $ref: "#/components/schemas/BetaManagedAgentsEffortHigh"
            - $ref: "#/components/schemas/BetaManagedAgentsEffortXhigh"
            - $ref: "#/components/schemas/BetaManagedAgentsEffortMax"
            - type: "null"
          description: 'How hard Claude works on each inference call. Accepts a bare level string (`"high"`) or `{"type":
            "high"}`. On create, omitting it resolves the per-model default; on update, omitting it leaves the stored
            value unchanged.'
        inference_geo:
          type:
            - string
            - "null"
          description: Geographic region for model inference. When unset, requests fall through to the workspace's
            default_inference_geo. On update, `model` is whole-object replacement — omitting inference_geo clears it.
        speed:
          type:
            - string
            - "null"
          enum:
            - standard
            - fast
            - null
          description: Inference speed mode. `fast` provides significantly faster output token generation at premium pricing.
            Defaults to `standard`. Not all models support `fast`; invalid combinations are rejected at create time.
      required:
        - id
      description: An object that defines additional configuration control over model use
    BetaManagedAgentsModelOverloadedError:
      type: object
      properties:
        message:
          type: string
          description: Human-readable error description.
        retry_status:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsRetryStatusRetrying"
            - $ref: "#/components/schemas/BetaManagedAgentsRetryStatusExhausted"
            - $ref: "#/components/schemas/BetaManagedAgentsRetryStatusTerminal"
          description: What the client should do next.
        type:
          type: string
          const: model_overloaded_error
      required:
        - message
        - retry_status
        - type
      description: The model is currently overloaded. Emitted after automatic retries are exhausted.
    BetaManagedAgentsModelRateLimitedError:
      type: object
      properties:
        message:
          type: string
          description: Human-readable error description.
        retry_status:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsRetryStatusRetrying"
            - $ref: "#/components/schemas/BetaManagedAgentsRetryStatusExhausted"
            - $ref: "#/components/schemas/BetaManagedAgentsRetryStatusTerminal"
          description: What the client should do next.
        type:
          type: string
          const: model_rate_limited_error
      required:
        - message
        - retry_status
        - type
      description: The model request was rate-limited.
    BetaManagedAgentsModelRequestFailedError:
      type: object
      properties:
        message:
          type: string
          description: Human-readable error description.
        retry_status:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsRetryStatusRetrying"
            - $ref: "#/components/schemas/BetaManagedAgentsRetryStatusExhausted"
            - $ref: "#/components/schemas/BetaManagedAgentsRetryStatusTerminal"
          description: What the client should do next.
        type:
          type: string
          const: model_request_failed_error
      required:
        - message
        - retry_status
        - type
      description: A model request failed for a reason other than overload or rate-limiting.
    BetaManagedAgentsMultiagent:
      anyOf:
        - $ref: "#/components/schemas/BetaManagedAgentsMultiagentCoordinator"
        - $ref: "#/components/schemas/BetaManagedAgentsMultiagent20261001"
      description: Resolved multiagent orchestration configuration as returned in API responses.
    BetaManagedAgentsMultiagent20261001:
      type: object
      properties:
        advisor:
          $ref: "#/components/schemas/BetaManagedAgentsMultiagentAdvisor"
          description: Whether the session's primary thread can consult an advisor model.
        subagents:
          $ref: "#/components/schemas/BetaManagedAgentsMultiagentSubagents"
          description: Whether the agent can spawn session threads.
        type:
          type: string
          const: multiagent_20261001
        workflows:
          $ref: "#/components/schemas/BetaManagedAgentsMultiagentWorkflows"
          description: Whether the agent can start workflow runs.
      required:
        - advisor
        - subagents
        - type
        - workflows
      description: Resolved multiagent configuration with three members, each enabled or disabled on its own.
    BetaManagedAgentsMultiagent20261001Params:
      type: object
      properties:
        type:
          type: string
          const: multiagent_20261001
        advisor:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsMultiagentAdvisorParams"
            - type: "null"
          description: Whether the session's primary thread can consult an advisor model. Defaults to disabled.
        subagents:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsMultiagentSubagentsParams"
            - type: "null"
          description: Whether the agent can spawn session threads. Defaults to enabled.
        workflows:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsMultiagentWorkflowsParams"
            - type: "null"
          description: Whether the agent can start workflow runs. Defaults to enabled.
      required:
        - type
      description: "Multiagent configuration with three members, each enabled or disabled on its own. On an update, if the
        agent's stored `multiagent` also has type `multiagent_20261001`, this configuration is merged into the stored
        one, level by level, instead of replacing it. A key that the update omits keeps its stored value. A key sent as
        null takes its default, on create as well, so `\"workflows\": null` enables workflows. An object sent with a
        `type` other than the stored one replaces the stored object, and the keys that it omits take their defaults. A
        `predefined_agents` list that is sent replaces the stored list. Every object that is sent needs its `type`, and
        an enabled `advisor` needs its `model`. Other validation applies to the merged result."
    BetaManagedAgentsMultiagentAdvisor:
      anyOf:
        - $ref: "#/components/schemas/BetaManagedAgentsMultiagentAdvisorEnabled"
        - $ref: "#/components/schemas/BetaManagedAgentsMultiagentAdvisorDisabled"
      description: Whether the session's primary thread can consult an advisor model.
    BetaManagedAgentsMultiagentAdvisorDisabled:
      type: object
      properties:
        type:
          type: string
          const: disabled
      required:
        - type
      description: The agent has no advisor.
    BetaManagedAgentsMultiagentAdvisorDisabledParams:
      type: object
      properties:
        type:
          type: string
          const: disabled
      required:
        - type
      description: The agent has no advisor.
    BetaManagedAgentsMultiagentAdvisorEnabled:
      type: object
      properties:
        model:
          type: string
          description: The advisor model id.
        type:
          type: string
          const: enabled
      required:
        - model
        - type
      description: The session's primary thread can consult `model` mid-turn.
    BetaManagedAgentsMultiagentAdvisorEnabledParams:
      type: object
      properties:
        model:
          type: string
          description: A Claude model id. The model must be permitted as an advisor for this agent's model.
        type:
          type: string
          const: enabled
      required:
        - model
        - type
      description: The session's primary thread can consult `model` mid-turn.
    BetaManagedAgentsMultiagentAdvisorParams:
      anyOf:
        - $ref: "#/components/schemas/BetaManagedAgentsMultiagentAdvisorEnabledParams"
        - $ref: "#/components/schemas/BetaManagedAgentsMultiagentAdvisorDisabledParams"
      description: Whether the session's primary thread can consult an advisor model.
    BetaManagedAgentsMultiagentCoordinator:
      type: object
      properties:
        agents:
          type: array
          items:
            anyOf:
              - $ref: "#/components/schemas/BetaManagedAgentsAgentReference"
              - $ref: "#/components/schemas/BetaManagedAgentsAdvisor"
          description: Agents the coordinator may spawn as session threads, each resolved to a specific version.
        type:
          type: string
          const: coordinator
      required:
        - agents
        - type
      description: Resolved coordinator topology with a concrete agent roster.
    BetaManagedAgentsMultiagentCoordinatorParams:
      type: object
      properties:
        agents:
          type: array
          items:
            $ref: "#/components/schemas/BetaManagedAgentsMultiagentRosterEntryParams"
          description: Agents the coordinator may spawn as session threads. 1–20 entries. Each entry is an agent ID string, a
            versioned `{"type":"agent","id","version"}` reference, or `{"type":"self"}` to allow recursive
            self-invocation. Entries must reference distinct agents (after resolving `self` and string forms); at most
            one `self`. Referenced agents must exist, must not be archived, and must not themselves have `multiagent`
            set (depth limit 1).
        type:
          type: string
          const: coordinator
      required:
        - agents
        - type
      description: "A coordinator topology: the session's primary thread orchestrates work by spawning session threads, each
        running an agent drawn from the `agents` roster."
    BetaManagedAgentsMultiagentInlineAgents:
      anyOf:
        - $ref: "#/components/schemas/BetaManagedAgentsMultiagentInlineAgentsEnabled"
        - $ref: "#/components/schemas/BetaManagedAgentsMultiagentInlineAgentsDisabled"
      description: Whether the agent can define inline agents. The agent defines an inline agent itself, in a workflow run's
        plan or when it spawns a session thread, and the inline agent is not saved.
    BetaManagedAgentsMultiagentInlineAgentsDisabled:
      type: object
      properties:
        type:
          type: string
          const: disabled
      required:
        - type
      description: The agent cannot define inline agents.
    BetaManagedAgentsMultiagentInlineAgentsDisabledParams:
      type: object
      properties:
        type:
          type: string
          const: disabled
      required:
        - type
      description: The agent cannot define inline agents.
    BetaManagedAgentsMultiagentInlineAgentsEnabled:
      type: object
      properties:
        type:
          type: string
          const: enabled
      required:
        - type
      description: The agent can define inline agents.
    BetaManagedAgentsMultiagentInlineAgentsEnabledParams:
      type: object
      properties:
        type:
          type: string
          const: enabled
      required:
        - type
      description: The agent can define inline agents.
    BetaManagedAgentsMultiagentInlineAgentsParams:
      anyOf:
        - $ref: "#/components/schemas/BetaManagedAgentsMultiagentInlineAgentsEnabledParams"
        - $ref: "#/components/schemas/BetaManagedAgentsMultiagentInlineAgentsDisabledParams"
      description: Whether the agent can define inline agents. The agent defines an inline agent itself, in a workflow run's
        plan or when it spawns a session thread, and the inline agent is not saved.
    BetaManagedAgentsMultiagentParams:
      anyOf:
        - $ref: "#/components/schemas/BetaManagedAgentsMultiagentCoordinatorParams"
        - $ref: "#/components/schemas/BetaManagedAgentsMultiagent20261001Params"
      description: Multiagent orchestration configuration.
    BetaManagedAgentsMultiagentPredefinedAgentParams:
      anyOf:
        - type: string
        - $ref: "#/components/schemas/BetaManagedAgentsAgentParams"
        - $ref: "#/components/schemas/BetaManagedAgentsMultiagentSelfParams"
      description: One agent in a `predefined_agents` list. It is an agent ID string, an `agent` reference with an optional
        `version`, or `self` for the agent that owns this configuration.
    BetaManagedAgentsMultiagentRosterEntryParams:
      anyOf:
        - type: string
        - $ref: "#/components/schemas/BetaManagedAgentsAgentParams"
        - $ref: "#/components/schemas/BetaManagedAgentsMultiagentSelfParams"
        - $ref: "#/components/schemas/BetaManagedAgentsAdvisorParams"
      description: "An entry in a multiagent roster: an agent ID string, a versioned agent reference, or `self`."
    BetaManagedAgentsMultiagentSelfParams:
      type: object
      properties:
        type:
          type: string
          const: self
      required:
        - type
      description: Sentinel roster entry meaning "the agent that owns this configuration". Resolved server-side to a concrete
        agent reference.
    BetaManagedAgentsMultiagentSubagents:
      anyOf:
        - $ref: "#/components/schemas/BetaManagedAgentsMultiagentSubagentsEnabled"
        - $ref: "#/components/schemas/BetaManagedAgentsMultiagentSubagentsDisabled"
      description: Whether the agent can spawn session threads.
    BetaManagedAgentsMultiagentSubagentsDisabled:
      type: object
      properties:
        type:
          type: string
          const: disabled
      required:
        - type
      description: The agent cannot spawn session threads.
    BetaManagedAgentsMultiagentSubagentsDisabledParams:
      type: object
      properties:
        type:
          type: string
          const: disabled
      required:
        - type
      description: The agent cannot spawn session threads.
    BetaManagedAgentsMultiagentSubagentsEnabled:
      type: object
      properties:
        inline_agents:
          $ref: "#/components/schemas/BetaManagedAgentsMultiagentInlineAgents"
          description: Whether the agent can define inline agents, which are not saved, when it spawns session threads.
        predefined_agents:
          type: array
          items:
            $ref: "#/components/schemas/BetaManagedAgentsAgentReference"
          description: Predefined agents, which are saved agents that this agent can spawn as session threads, each resolved to a
            specific version.
        type:
          type: string
          const: enabled
      required:
        - inline_agents
        - predefined_agents
        - type
      description: The agent can spawn session threads.
    BetaManagedAgentsMultiagentSubagentsEnabledParams:
      type: object
      properties:
        type:
          type: string
          const: enabled
        inline_agents:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsMultiagentInlineAgentsParams"
            - type: "null"
          description: Whether the agent can define inline agents when it spawns session threads. Defaults to enabled.
        predefined_agents:
          anyOf:
            - type: array
              items:
                $ref: "#/components/schemas/BetaManagedAgentsMultiagentPredefinedAgentParams"
            - type: "null"
          description: Predefined agents that this agent can spawn as session threads. At most 20. Defaults to null. Null and an
            empty list both mean no predefined agents. This list is separate from `workflows.predefined_agents`, and an
            agent in one list is not added to the other.
      required:
        - type
      description: The agent can spawn session threads. Each thread runs a predefined agent, which is a saved agent in
        `predefined_agents`, or an inline agent, which the agent defines when it spawns the thread and which is not
        saved. If `inline_agents` is disabled, `predefined_agents` must name at least one agent.
    BetaManagedAgentsMultiagentSubagentsParams:
      anyOf:
        - $ref: "#/components/schemas/BetaManagedAgentsMultiagentSubagentsEnabledParams"
        - $ref: "#/components/schemas/BetaManagedAgentsMultiagentSubagentsDisabledParams"
      description: Whether the agent can spawn session threads.
    BetaManagedAgentsMultiagentWorkflows:
      anyOf:
        - $ref: "#/components/schemas/BetaManagedAgentsMultiagentWorkflowsEnabled"
        - $ref: "#/components/schemas/BetaManagedAgentsMultiagentWorkflowsDisabled"
      description: Whether the agent can start workflow runs.
    BetaManagedAgentsMultiagentWorkflowsDisabled:
      type: object
      properties:
        type:
          type: string
          const: disabled
      required:
        - type
      description: The agent cannot start workflow runs.
    BetaManagedAgentsMultiagentWorkflowsDisabledParams:
      type: object
      properties:
        type:
          type: string
          const: disabled
      required:
        - type
      description: The agent cannot start workflow runs.
    BetaManagedAgentsMultiagentWorkflowsEnabled:
      type: object
      properties:
        inline_agents:
          $ref: "#/components/schemas/BetaManagedAgentsMultiagentInlineAgents"
          description: Whether a run's plan can define inline agents, which are not saved.
        predefined_agents:
          type: array
          items:
            $ref: "#/components/schemas/BetaManagedAgentsAgentReference"
          description: Predefined agents, which are saved agents that a run's plan can use, each resolved to a specific version.
        type:
          type: string
          const: enabled
      required:
        - inline_agents
        - predefined_agents
        - type
      description: The agent can start workflow runs.
    BetaManagedAgentsMultiagentWorkflowsEnabledParams:
      type: object
      properties:
        type:
          type: string
          const: enabled
        inline_agents:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsMultiagentInlineAgentsParams"
            - type: "null"
          description: Whether a run's plan can define inline agents. Defaults to enabled.
        predefined_agents:
          anyOf:
            - type: array
              items:
                $ref: "#/components/schemas/BetaManagedAgentsMultiagentPredefinedAgentParams"
            - type: "null"
          description: Predefined agents that a run's plan can use. At most 20. Defaults to null. Null and an empty list both mean
            no predefined agents. This list is separate from `subagents.predefined_agents`, and an agent in one list is
            not added to the other.
      required:
        - type
      description: The agent can start workflow runs. Each run follows a plan, a program that the agent writes. A plan can use
        predefined agents, which are the saved agents in `predefined_agents`, and inline agents, which it defines itself
        and which are not saved. If `inline_agents` is disabled, `predefined_agents` must name at least one agent.
    BetaManagedAgentsMultiagentWorkflowsParams:
      anyOf:
        - $ref: "#/components/schemas/BetaManagedAgentsMultiagentWorkflowsEnabledParams"
        - $ref: "#/components/schemas/BetaManagedAgentsMultiagentWorkflowsDisabledParams"
      description: Whether the agent can start workflow runs.
    BetaManagedAgentsOutcomeEvaluationResource:
      type: object
      properties:
        completed_at:
          type:
            - string
            - "null"
          description: When the outcome reached a terminal result. Null while `pending`/`running`/`evaluating`.
        description:
          type: string
          description: What the agent should produce.
        explanation:
          type:
            - string
            - "null"
          description: Grader's verdict text from the most recent evaluation. For `satisfied`, explains why criteria are met; for
            `needs_revision` (intermediate), what's missing; for `failed`, why unrecoverable.
        iteration:
          type: number
          description: 0-indexed revision cycle the outcome is currently on.
        outcome_id:
          type: string
          description: Server-generated outc_ ID for this outcome.
        result:
          type: string
          description: Current evaluation state. `pending` before the agent begins work; `running` while producing or revising;
            `evaluating` while the grader scores; `satisfied`/`max_iterations_reached`/`failed`/`interrupted` are
            terminal.
        type:
          type: string
          const: outcome_evaluation
      required:
        - completed_at
        - description
        - explanation
        - iteration
        - outcome_id
        - result
        - type
      description: Evaluation state for a single outcome defined via a `define_outcome` event.
    BetaManagedAgentsPlainTextDocumentSource:
      type: object
      properties:
        data:
          type: string
          description: The plain text content.
        media_type:
          type: string
          const: text/plain
          description: MIME type of the text content. Must be "text/plain".
        type:
          type: string
          const: text
      required:
        - data
        - media_type
        - type
      description: Plain text document content.
    BetaManagedAgentsPrecondition:
      type: object
      properties:
        type:
          type: string
          const: content_sha256
        content_sha256:
          type: string
          description: Expected `content_sha256` of the stored memory (64 lowercase hexadecimal characters). Typically the
            `content_sha256` returned by a prior read or list call. Because the server applies no content normalization,
            clients can also compute this locally as the SHA-256 of the UTF-8 content bytes.
      required:
        - type
      description: Optional condition that must hold for an update to apply. When omitted, the update is unconditional.
        Asserts the current state of the memory being updated. When an update changes `path`, the precondition still
        refers to the memory's current content, not the destination path. Currently the only supported variant is
        `content_sha256`.
    BetaManagedAgentsProgramWorkflowRunError:
      type: object
      properties:
        message:
          type: string
          description: Short explanation written by the server. It never contains content from the run or its agents.
        type:
          type: string
          const: program_error
      required:
        - message
        - type
      description: The plan, a program that the agent wrote, failed, or the server refused it.
    BetaManagedAgentsReadToolConfig:
      type: object
      properties:
        enabled:
          type: boolean
        name:
          type: string
          const: read
        permission_policy:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsAlwaysAllowPolicy"
            - $ref: "#/components/schemas/BetaManagedAgentsAlwaysAskPolicy"
            - $ref: "#/components/schemas/BetaManagedAgentsAutoPolicy"
          description: Permission policy for tool execution.
        type:
          type: string
          const: read
      required:
        - enabled
        - name
        - permission_policy
        - type
      description: Configuration for the read tool.
    BetaManagedAgentsReadToolConfigParams:
      type: object
      properties:
        name:
          type: string
          const: read
          description: Must be "read".
        enabled:
          type:
            - boolean
            - "null"
          description: Whether this tool is enabled and available to Claude. Overrides the default_config setting.
        permission_policy:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsAlwaysAllowPolicy"
            - $ref: "#/components/schemas/BetaManagedAgentsAlwaysAskPolicy"
            - $ref: "#/components/schemas/BetaManagedAgentsAutoPolicy"
            - type: "null"
          description: Permission policy for this tool. Controls whether tool calls are auto-approved or require confirmation.
        type:
          type: string
          const: read
      required:
        - name
      description: Configuration override for the read tool.
    BetaManagedAgentsRedactedBlock:
      type: object
      properties:
        type:
          type: string
          const: redacted
      required:
        - type
      description: Placeholder for content withheld by Anthropic model policy.
    BetaManagedAgentsRepositoryAuthenticationError:
      type: object
      properties:
        message:
          type: string
          description: Human-readable error description.
        repository_url:
          type:
            - string
            - "null"
          description: URL of the repository that could not be cloned. Null when it could not be identified.
        retry_status:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsRetryStatusRetrying"
            - $ref: "#/components/schemas/BetaManagedAgentsRetryStatusExhausted"
            - $ref: "#/components/schemas/BetaManagedAgentsRetryStatusTerminal"
          description: "What the client should do next. Always `retrying`: the session keeps running without the repository."
        type:
          type: string
          const: repository_authentication_error
      required:
        - message
        - repository_url
        - retry_status
        - type
      description: The repository host rejected the credentials, or required credentials and received none.
    BetaManagedAgentsRepositoryCheckoutError:
      type: object
      properties:
        message:
          type: string
          description: Human-readable error description.
        repository_url:
          type:
            - string
            - "null"
          description: URL of the repository that could not be cloned. Null when it could not be identified.
        retry_status:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsRetryStatusRetrying"
            - $ref: "#/components/schemas/BetaManagedAgentsRetryStatusExhausted"
            - $ref: "#/components/schemas/BetaManagedAgentsRetryStatusTerminal"
          description: "What the client should do next. Always `retrying`: the session keeps running without the repository."
        type:
          type: string
          const: repository_checkout_error
      required:
        - message
        - repository_url
        - retry_status
        - type
      description: The requested branch or commit does not exist in the repository.
    BetaManagedAgentsRepositoryCloneError:
      type: object
      properties:
        message:
          type: string
          description: Human-readable error description.
        repository_url:
          type:
            - string
            - "null"
          description: URL of the repository that could not be cloned. Null when it could not be identified.
        retry_status:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsRetryStatusRetrying"
            - $ref: "#/components/schemas/BetaManagedAgentsRetryStatusExhausted"
            - $ref: "#/components/schemas/BetaManagedAgentsRetryStatusTerminal"
          description: "What the client should do next. Always `retrying`: the session keeps running without the repository."
        type:
          type: string
          const: repository_clone_error
      required:
        - message
        - repository_url
        - retry_status
        - type
      description: The repository could not be cloned.
    BetaManagedAgentsRepositoryForbiddenError:
      type: object
      properties:
        message:
          type: string
          description: Human-readable error description.
        repository_url:
          type:
            - string
            - "null"
          description: URL of the repository that could not be cloned. Null when it could not be identified.
        retry_status:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsRetryStatusRetrying"
            - $ref: "#/components/schemas/BetaManagedAgentsRetryStatusExhausted"
            - $ref: "#/components/schemas/BetaManagedAgentsRetryStatusTerminal"
          description: "What the client should do next. Always `retrying`: the session keeps running without the repository."
        type:
          type: string
          const: repository_forbidden_error
      required:
        - message
        - repository_url
        - retry_status
        - type
      description: The repository host refused access to the repository.
    BetaManagedAgentsRepositoryNotFoundError:
      type: object
      properties:
        message:
          type: string
          description: Human-readable error description.
        repository_url:
          type:
            - string
            - "null"
          description: URL of the repository that could not be cloned. Null when it could not be identified.
        retry_status:
          anyOf:
            - $ref: "#/components/schemas/BetaManagedAgentsRetryStatusRetrying"
            - $ref: "#/components/schemas/BetaManagedAgentsRetryStatusExhausted"
            - $ref: "#/components/schemas/BetaManagedAgentsRetryStatusTerminal"
          description: "What the client should do next. Always `retrying`: the session keeps running without the repository."
        type:
          type: string
          const: repository_not_found_error
      required:
        - message
        - repository_url
        - retry_status
        - type
      description: The repository host reported the repository as not found.
    BetaManagedAgentsRetryStatusExhausted:
      type: object
      properties:
        type:
          type: string
          const: exhausted
      required:
        - type
      description: This turn is dead; queued inputs are flushed and the session returns to idle. Client may send a new prompt.
    BetaManagedAgentsRetryStatusRetrying:
      type: object
      properties:
        type:
          type: string
          const: retrying
      required:
        - type
      description: The server is retrying automatically. Client should wait; the same error type may fire again as retrying,
        then once as exhausted when the retry budget runs out.
    BetaManagedAgentsRetryStatusTerminal:
      type: object
      properties:
        type:
          type: string
          const: terminal
      required:
        - type
      description: The session encountered a terminal error and will transition to `terminated` state.
    BetaManagedAgentsSearchResultBlock:
      type: object
      properties:
        citations:
          $ref: "#/components/schemas/BetaManagedAgentsSearchResultCitations"
          description: Citation settings for this search result.
        content:
          type: array
          items:
            $ref: "#/components/schemas/BetaManagedAgentsSearchResultContent"
          description: Array of text content blocks from the search result.
        source:
