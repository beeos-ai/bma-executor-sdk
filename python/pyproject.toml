[project]
name = "bma-executor-sdk"
version = "1.2.0"
description = "BMA executor protocol (bma.executor.v1.1): executor, harness and agent ends on asyncio with WebSocket, Unix socket and in-process transports."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "websockets>=14,<17"]

[project.urls]
Repository = "https://github.com/beeos-ai/bma-executor-sdk"

[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=1.4", "pyright==1.1.414"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bma_executor_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
include = ["tests/typecheck", "examples/executor_minimal.py", "examples/session_context.py"]
pythonVersion = "3.10"
strict = ["tests/typecheck"]
reportUnnecessaryTypeIgnoreComment = "error"
