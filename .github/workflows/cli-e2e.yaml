name: CLI e2e

# The bma command line against BMA staging (tools/cli_e2e.sh). It needs the
# staging acceptance key, so it runs only on main and by hand, in the
# protected environment staging-e2e: never on pull requests (forks get no
# secret, and no PR code runs with it).
on:
  push:
    branches: [main]
    paths: ['cmd/bma/**', 'tools/cligen/**', 'tools/cli_e2e.sh', 'contracts/bma-api/**', 'go.mod', 'go.sum',
      '.github/workflows/cli-e2e.yaml']
  workflow_dispatch:

concurrency:
  group: cli-e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    name: bma CLI against staging
    runs-on: ubuntu-latest
    environment: staging-e2e
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run tools/cli_e2e.sh
        env:
          BMA_API_KEY: ${{ secrets.BMA_STAGING_ACCEPTANCE_API_KEY }}
          BMA_BASE_URL: https://api.staging.beeos.ai
        run: tools/cli_e2e.sh
