name: CI

on:
  pull_request:
  push:
    branches: [main]
  # release.yaml runs this same check suite before publishing.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: "Contract lock and SDK tests (${{ matrix.name }}: Go ${{ matrix.go }}, Node ${{ matrix.node }}, Python ${{ matrix.python }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # oldest supported runtime of each SDK, then the two newest Go
          # minors with the two newest Node LTS lines and the newest Python.
          - {name: oldest, go: "1.25", node: 20, python: "3.10"}
          - {name: previous, go: "1.26", node: 24, python: "3.13"}
          - {name: latest, go: "1.27", node: 26, python: "3.14"}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Contract lock check
        run: python3 tools/check_contract.py

      - name: One version across package manifests
        run: ./tools/check_versions.sh

      - name: Typed method tables are up to date
        run: python3 tools/gen_methods.py --check

      - name: Go
        run: |
          go vet ./...
          go test -race ./...

      - name: TypeScript (with Go and Python interop)
        working-directory: typescript
        run: |
          (cd ../python && uv sync)
          npm ci
          npm run build
          npm test

      - name: Python tests, pyright strict on the typed tool assertions
        working-directory: python
        run: |
          uv run -p ${{ matrix.python }} pytest -q
          uv run -p ${{ matrix.python }} pyright

  # The Windows named pipe transport (npipe://) of the three SDKs. Only the
  # transport tests run here; the full suites run on ubuntu above.
  windows-named-pipe:
    name: Windows named pipe transport (Go, TypeScript, Python)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Go (named pipe, both directions)
        run: |
          go vet ./...
          go test -count=1 -v -run 'NamedPipe|ChannelURLAcceptsNamedPipes|ExecutorDialsAHarnessOnANamedPipe' .

      - name: Python (named pipe, Go interop)
        working-directory: python
        run: |
          uv sync
          uv run pytest -v tests/test_npipe.py
          uv run pytest -v -k npipe tests/test_executor_runtime.py tests/test_executor_interop.py

      - name: TypeScript (local socket tests on a pipe, Go and Python interop)
        working-directory: typescript
        env:
          BMA_PYTHON: ${{ github.workspace }}/python/.venv/Scripts/python.exe
        run: |
          npm ci
          npx tsc -p tsconfig.test.json
          node --test --test-name-pattern='local socket|npipe' build-test/test/executor.test.js
          node --test build-test/test/interop-go-unix.test.js build-test/test/interop-python.test.js
