name: CI

on:
  pull_request:
  push:
    branches: [main]
  # release.yaml runs this same check suite before publishing.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: "Contract lock and SDK tests (${{ matrix.name }}: Go ${{ matrix.go }}, Node ${{ matrix.node }}, Python ${{ matrix.python }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # oldest supported runtime of each SDK, then the two newest Go
          # minors with the two newest Node LTS lines and the newest Python.
          - {name: oldest, go: "1.25", node: 20, python: "3.10"}
          - {name: previous, go: "1.26", node: 24, python: "3.13"}
          - {name: latest, go: "1.27", node: 26, python: "3.14"}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Contract lock check
        run: python3 tools/check_contract.py

      - name: One version across package manifests
        run: ./tools/check_versions.sh

      - name: Typed method tables are up to date
        run: python3 tools/gen_methods.py --check

      - name: Go
        run: |
          go vet ./...
          go test -race ./...

      - name: TypeScript (with Go and Python interop)
        working-directory: typescript
        run: |
          (cd ../python && uv sync)
          npm ci
          npm run build
          npm test

      - name: Python tests, pyright strict on the typed tool assertions
        working-directory: python
        run: |
          uv run -p ${{ matrix.python }} pytest -q
          uv run -p ${{ matrix.python }} pyright

  # The Claude Code brain against the real, pinned claude CLI (downloaded from
  # Anthropic's release bucket, checked against its manifest and the SDK's
  # pins). The model endpoint is scripted and the API key made up: no
  # credential is used.

  bma-package:
    name: bma assets build and install.sh installs them
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      - name: Package, install from the assets, refuse a tampered archive
        run: |
          ./tools/package_bma.sh 0.0.0 "$RUNNER_TEMP/assets"
          home="$(mktemp -d)"
          HOME="$home" BMA_INSTALL_BASE="file://$RUNNER_TEMP/assets" sh packaging/unix/install.sh
          test "$("$home/.bma/bin/bma" version)" = 0.0.0
          cp -r "$RUNNER_TEMP/assets" "$RUNNER_TEMP/bad"
          printf 'x' >> "$RUNNER_TEMP/bad/bma-linux-amd64.tar.gz"
          ! HOME="$(mktemp -d)" BMA_INSTALL_BASE="file://$RUNNER_TEMP/bad" sh packaging/unix/install.sh
  claude-code:
    name: Claude adapter with the pinned claude CLI
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      - name: Fetch the pinned claude CLI
        run: tools/fetch_claude_cli.sh 2.1.318 testdata/claude-cli/claude

      - name: Claude adapter tests (they fail, not skip, when the CLI is missing)
        env:
          BMA_REQUIRE_CLAUDE_CLI: "1"
        run: |
          go test -race -count=1 -v -run 'ClaudeCLI' ./... | tee /tmp/claude.log
          ! grep -q -- '--- SKIP' /tmp/claude.log

  # The Codex brain against each pinned codex CLI (OpenAI's GitHub release
  # asset, checked against the digest GitHub publishes and the SDK's pins). The
  # model provider is a scripted Responses endpoint and the API key made up: no
  # credential is used.
  codex:
    name: Codex adapter with the pinned codex CLI ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ["0.168.0", "0.169.0"]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      - name: Fetch the pinned codex CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tools/fetch_codex_cli.sh ${{ matrix.version }} testdata/codex-cli/codex

      - name: Codex adapter tests (they fail, not skip, when the CLI is missing)
        env:
          BMA_REQUIRE_CODEX_CLI: "1"
        run: |
          go test -race -count=1 -v -run 'Codex' ./... | tee /tmp/codex.log
          ! grep -q -- '--- SKIP' /tmp/codex.log

  # The DSH profile of ACPAgent against the real, pinned bma-dsh-acp (npm ci
  # installs the locked tree): a user's image reaches a scripted model
  # endpoint. The model endpoint is scripted; no credential is used.
  dsh-acp:
    name: ACPAgent user images with the pinned bma-dsh-acp
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install the pinned bma-dsh-acp
        working-directory: testdata/bma-dsh-acp
        run: npm ci

      - name: User image test (fails, not skips, when the agent is missing)
        env:
          BMA_REQUIRE_DSH_ACP: "1"
        run: |
          go test -race -count=1 -v -run 'UserImageReachesTheModelThroughBmaDshAcp' ./... | tee /tmp/dsh.log
          ! grep -q -- '--- SKIP' /tmp/dsh.log

  # The Go executor on Windows: environment, cmd.exe command lines, job
  # objects, ConPTY, files. Tests that need a POSIX shell skip themselves.
  windows-go:
    name: Go executor on Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum

      - name: Go
        run: |
          go vet ./...
          go test -count=1 ./...

  # The installable Windows package (zip + install/uninstall scripts), kept as
  # a build artifact for machine verification, and installed once on a runner.
  windows-package:
    name: Windows package (zip)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum

      - name: Build
        run: packaging/windows/build.sh dist

      - name: Keep the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bma-windows-hand
          path: dist/*.zip
          retention-days: 30
          if-no-files-found: error

  windows-package-install:
    name: Windows package install and uninstall
    needs: windows-package
    runs-on: windows-latest
    steps:
      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bma-windows-hand
          path: package

      - name: Install, check, uninstall
        shell: pwsh
        run: |
          $zip = (Get-ChildItem package\*.zip).FullName
          Expand-Archive -LiteralPath $zip -DestinationPath expanded
          Set-Location expanded\bma-windows-hand
          .\windows-hand.exe -version
          $sums = Get-Content SHA256SUMS | Where-Object { $_ -notmatch 'SHA256SUMS' }
          foreach ($line in $sums) {
            $hash, $name = $line -split '\s+\*?', 2
            if ((Get-FileHash -Algorithm SHA256 $name).Hash -ne $hash.ToUpper()) { throw "checksum mismatch: $name" }
          }
          $dir = Join-Path $env:RUNNER_TEMP 'bma'
          $token = 'ci-dummy-token-not-a-secret'
          .\install.ps1 -BaseUrl https://executor.invalid -MachineToken $token -MachineId mch_ci -InstallDir $dir
          foreach ($path in 'bin\windows-hand.exe', 'executor.env', 'work', 'files', 'logs') {
            if (-not (Test-Path (Join-Path $dir $path))) { throw "missing $path" }
          }
          $task = Get-ScheduledTask -TaskName 'BMA Executor'
          Write-Host ($task.Actions | Format-List | Out-String)
          if ($task.Actions[0].Arguments -notmatch 'windows-hand.exe') { throw 'task does not run the executor' }
          $acl = (Get-Acl (Join-Path $dir 'executor.env')).Access | ForEach-Object { $_.IdentityReference.Value }
          Write-Host "executor.env readable by: $($acl -join ', ')"
          if ($acl -contains 'BUILTIN\Users' -or $acl -contains 'Everyone') { throw 'executor.env is readable by everyone' }
          # Run the installed executor without a platform: it must fail on the unreachable host, not crash.
          $p = Start-Process -FilePath (Join-Path $dir 'bin\windows-hand.exe') -ArgumentList '-env-file', (Join-Path $dir 'executor.env') `
            -PassThru -RedirectStandardError (Join-Path $dir 'logs\run.err') -RedirectStandardOutput (Join-Path $dir 'logs\run.out')
          Start-Sleep -Seconds 8
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Get-Content (Join-Path $dir 'logs\run.err') -ErrorAction SilentlyContinue | Select-Object -First 8
          if ((Get-Content (Join-Path $dir 'logs\run.err') -Raw) -match $token) { throw 'the token was logged' }
          .\uninstall.ps1 -InstallDir $dir -Purge
          if (Get-ScheduledTask -TaskName 'BMA Executor' -ErrorAction SilentlyContinue) { throw 'task still registered' }
          if (Test-Path $dir) { throw 'install dir still there' }

  # The Windows named pipe transport (npipe://) of the three SDKs. Only the
  # transport tests run here; the full suites run on ubuntu above.
  windows-named-pipe:
    name: Windows named pipe transport (Go, TypeScript, Python)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Go (named pipe, both directions)
        run: |
          go vet ./...
          go test -count=1 -v -run 'NamedPipe|ChannelURLAcceptsNamedPipes|ExecutorDialsAHarnessOnANamedPipe' .

      - name: Python (named pipe, Go interop)
        working-directory: python
        run: |
          uv sync
          uv run pytest -v tests/test_npipe.py
          uv run pytest -v -k npipe tests/test_executor_runtime.py tests/test_executor_interop.py

      - name: TypeScript (local socket tests on a pipe, Go and Python interop)
        working-directory: typescript
        env:
          BMA_PYTHON: ${{ github.workspace }}/python/.venv/Scripts/python.exe
        run: |
          npm ci
          npx tsc -p tsconfig.test.json
          node --test --test-name-pattern='local socket|npipe' build-test/test/executor.test.js
          node --test build-test/test/interop-go-unix.test.js build-test/test/interop-python.test.js
